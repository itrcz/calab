syntax = "proto3";
package calaba.v1;

import "calaba/v1/common.proto";
import "google/protobuf/timestamp.proto";

// Public profile, visible to members of shared workspaces.
message User {
  string id = 1;
  string display_name = 2;
  string avatar_file_id = 3; // empty = no avatar
  string status_text = 4;
  // Registration time: the "Member since" line of the profile (with WorkspaceMember.joined_at).
  google.protobuf.Timestamp created_at = 5;
  string status_emoji = 6;
  google.protobuf.Timestamp status_expires_at = 7; // unset = no expiry; expired status is returned empty
  bool is_guest = 8; // guest account from a room link (ADR-0016): show a "Guest" badge
  // IANA time zone ("Europe/Moscow"); empty = not set. Clients show the offset ("+3 UTC").
  string timezone = 9;
  // A bot account (ADR-0031): show a "BOT" badge; clients list bots in their own section, not
  // among people online / offline.
  bool is_bot = 10;
  // Birthday (docs/09 #76); unset = not given, or hidden by its owner (Me.birthday_hidden):
  // a hidden birthday is sent to nobody but the owner (in Me.user).
  Birthday birthday = 11;
  // Contacts (ADR-0077): filled only for a viewer who shares a workspace with the user where
  // neither of them is a guest; never for guests, bots or bot viewers (bot API, webhooks).
  // Workspace-scoped payloads (READY snapshot, members, WORKSPACE_MEMBER_*, USER_UPDATE)
  // decide by that workspace alone: a User without email says nothing about the contacts,
  // so clients keep the ones they already have. Never used for authentication or invitations.
  string email = 12;
  // false = the address is not confirmed (ADR-0065): show it marked "not verified".
  bool email_verified = 13;
  // Informational, unverified phone ("+7 999 123-45-67"); empty = not given or not visible.
  string phone = 14;
  // Global nickname (ADR-0077), lower case, without "@"; empty = none. Public: everyone who
  // sees the user sees it, guests too. Bots carry their bot username.
  string username = 15;
}

// A birthday: day and month always, the year only if the user gave it. 29 February is valid
// (celebrated on 28 February in other years).
message Birthday {
  uint32 day = 1;   // 1..31
  uint32 month = 2; // 1..12
  optional uint32 year = 3;
}

enum MicMode {
  MIC_MODE_UNSPECIFIED = 0; // treated as VAD
  MIC_MODE_VAD = 1;         // voice activation (default)
  MIC_MODE_PUSH_TO_TALK = 2;
}

// Per-user settings synced across the user's devices (USER_UPDATE on change).
// Device-specific things (selected mic/speaker, PTT key hook state) stay local on the client.
// The server always returns every field explicitly, with defaults for new users
// (noise_suppression = true, mic_mode = VAD, audio_bitrate_kbps unset = room setting), so a
// zero value is a real choice, never "missing". PATCH /api/me replaces all settings: send
// the full message.
message UserSettings {
  bool noise_suppression = 1;    // RNNoise worklet on/off (docs/02-media.md); default true
  bool unstable_network_red = 2; // opt-in Opus RED (ADR-0004); default false
  bool push_to_talk = 3 [deprecated = true]; // use mic_mode; kept in sync by the server
  string push_to_talk_key = 4;   // accelerator string, client-defined format
  MicMode mic_mode = 5;          // default VAD
  optional uint32 audio_bitrate_kbps = 6; // personal cap for published voice; unset = room setting
  // Meeting reminders (ADR-0038 §5), read-only here: stored apart from the other settings and
  // changed with UpdateMeRequest.event_reminders (a `settings` replace leaves them as they are).
  // Minutes before a meeting, ≤ 5 values of 5, 10, 15, 30, 60, 120, 1440; default [60, 5].
  repeated uint32 event_reminders = 7;
  // Remind while the user's status is «Не беспокоить» (DND); default true.
  bool event_reminders_dnd = 8;
  // Working hours (ADR-0041), read-only here like event_reminders: changed with
  // UpdateMeRequest.work_hours. Default 10:00–19:00 Mon–Fri in the user's zone.
  WorkHours work_hours = 9;
  // Read-only here; changed by UpdateMeRequest.hide_message_text_in_notifications.
  // Default false. Older audio-settings replacements must not reset privacy.
  bool hide_message_text_in_notifications = 10;
}

// Working hours of a user (ADR-0041) in their profile zone (UTC without one): minutes from
// local midnight, start_min < end_min ≤ 1440, on the listed days (1 = Monday … 7 = Sunday).
message WorkHours {
  uint32 start_min = 1;
  uint32 end_min = 2;
  repeated uint32 days = 3; // 1..7, distinct, at least one; sorted by the server
}

// PATCH /api/me event_reminders: replaces both values.
message EventReminderSettings {
  repeated uint32 minutes = 1; // ≤ 5 distinct values of 5, 10, 15, 30, 60, 120, 1440; [] = none
  bool dnd = 2;
}

// The authenticated user: public profile + private fields.
message Me {
  User user = 1;
  string email = 2;
  UserSettings settings = 3;
  // Product superadmin (email in SUPERADMIN_EMAILS, ADR-0024): may use /api/admin/*.
  bool is_superadmin = 4;
  // ADR-0023: false until the address is confirmed with a code (POST /api/auth/verify).
  // Unverified accounts may sign in and read, but get 403 EMAIL_NOT_VERIFIED on creating
  // workspaces, invites and new DMs. Accounts from before ADR-0023 start unverified too
  // (no grandfathering): show a non-dismissable "confirm your email" bar with a code field.
  // With EMAIL_VERIFICATION=optional (ADR-0065) nothing is blocked and the bar is shown only
  // for a waiting email invitation (Ready / LoginResponse / RegisterResponse:
  // email_verification_optional, email_invite_pending), but the address stays unconfirmed
  // and is not trusted (email invitations, OAuth claims, superadmin).
  // Always true for guests (no email). Servers without SMTP verify at registration.
  bool email_verified = 5;
  // Requested new address (PATCH /api/me/email) waiting for its code; empty = none.
  // `email` stays the login address until the code is confirmed.
  string pending_email = 6;
  // Language of emails: "en" | "ru" | "es" | "zh-CN"; empty = not set (English).
  string locale = 7;
  // The birthday (in user.birthday) is kept to the user: nobody else gets it, no card is posted.
  bool birthday_hidden = 8;
}

// GET /api/me
message GetMeResponse {
  Me me = 1;
}

// PATCH /api/me. Unset fields are left unchanged; `settings`, when present, replaces all settings.
message UpdateMeRequest {
  optional string display_name = 1;
  optional string status_text = 2;
  optional string avatar_file_id = 3; // "" clears the avatar
  optional UserSettings settings = 4;
  optional string timezone = 5; // IANA name (validated by the server); "" clears
  // Language of emails (ADR-0023): a BCP 47 tag mapped to "en" | "ru" | "es" | "zh-CN";
  // "" clears (English). Unsupported languages → 422.
  optional string locale = 6;
  // Birthday: day and month (a real date; with the year, if given, between 1900 and this
  // year) → 422 otherwise; day = 0 and month = 0 clears it. Unset = unchanged.
  Birthday birthday = 7;
  optional bool birthday_hidden = 8;
  // Meeting reminders (ADR-0038 §5); unset = unchanged. Not for guests and bots (403).
  EventReminderSettings event_reminders = 9;
  // Working hours (ADR-0041); unset = unchanged. Not for guests and bots (403); 422 for
  // start_min ≥ end_min, end_min > 1440, no days or a day outside 1..7.
  WorkHours work_hours = 10;
  // Omitted = unchanged; hides authored message text in provider push payloads.
  optional bool hide_message_text_in_notifications = 11;
  // Phone (ADR-0077): up to 32 characters of "+", digits, spaces and "-()" ("" clears);
  // 422 VALIDATION (field "phone") otherwise. Not for guests (403) and bots (403).
  optional string phone = 12;
  // Nickname (ADR-0077): 3..32 of a-z, 0-9, "_", starting with a letter (a leading "@" and
  // upper case are accepted and normalized); "" clears it. 422 USERNAME_INVALID: bad format or
  // a reserved name; 409 USERNAME_TAKEN: someone (a person or a bot) has it. Not for guests
  // and bots (403).
  optional string username = 13;
}

// GET /api/usernames/{name}/available → whether the caller may take the nickname now (the
// caller's own nickname is available). Rate limited (429). A hint only: PATCH /api/me decides.
message UsernameAvailabilityResponse {
  bool available = 1;
  // Why not: USERNAME_INVALID (format or reserved) or USERNAME_TAKEN; UNSPECIFIED when available.
  ErrorCode reason = 2;
  string username = 3; // the normalized name that was checked
}

message UpdateMeResponse {
  Me me = 1;
}

// PATCH /api/me/password → 204. The current password is required; every other session of
// the user is revoked (this one stays). 403 INVALID_CREDENTIALS: wrong current password;
// 403 FORBIDDEN: guest account. Password attempts share a 5 / 15 min bucket per account.
message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2; // 8..256 characters
}

// PATCH /api/me/email → UpdateMeResponse (+ USER_UPDATE {me} to the user's devices).
// ADR-0023: the address does not change yet — a 6-digit code goes to the new address and
// me.pending_email is set; POST /api/auth/verify {code} makes it the login email (verified).
// Servers without SMTP change it at once. 409 CONFLICT: address taken; 403 as above;
// 429: another code was sent to that address less than 60 s ago / 3 mails per hour.
message ChangeEmailRequest {
  string new_email = 1;
  string current_password = 2;
}

// PATCH /api/me/status — custom status. Empty text and emoji clear it. Announced to the
// user's workspaces as PRESENCE_UPDATE (+ USER_UPDATE). Response: UpdateMeResponse.
message UpdateStatusRequest {
  string text = 1;  // ≤ 128 chars
  string emoji = 2; // one emoji sequence, ≤ 32 bytes
  uint32 expires_in_seconds = 3; // 0 = never, ≤ 30 days
}

// Private note about another user ("Note (only visible to you)", docs/09 item 20). Only the
// author reads and writes it; the subject must be the author, share a workspace or a DM with
// them, otherwise 404.
//   GET    /api/users/{id}/note → UserNoteResponse (text empty, updated_at unset = no note)
//   PUT    /api/users/{id}/note  PutUserNoteRequest → UserNoteResponse; empty text deletes
//   DELETE /api/users/{id}/note → 204
message UserNote {
  string subject_id = 1;
  string text = 2; // ≤ 1000 characters
  google.protobuf.Timestamp updated_at = 3;
}

message PutUserNoteRequest {
  string text = 1; // trimmed; ≤ 1000 characters; empty = delete
}

message UserNoteResponse {
  UserNote note = 1;
}

// GET /api/workspaces/{id}/birthdays?days=7 (a member, not a guest): members whose birthday is
// within `days` days (1..31, default 7) of the caller's today (by the caller's time zone, UTC
// without one), soonest first. Hidden birthdays and bots are left out.
message ListBirthdaysResponse {
  repeated UpcomingBirthday birthdays = 1;
}

message UpcomingBirthday {
  string user_id = 1;
  Birthday birthday = 2;
  uint32 in_days = 3; // 0 = today
}

// PATCH /api/workspaces/{id}/members/{userId}/birthday (docs/09 #77): an admin sets or clears
// a member's birthday. MANAGE_NICKNAMES in the workspace and the kick hierarchy (the owner:
// anyone; others: members whose highest role is below their own); a bot or a guest member → 403,
// a bot token → 403 BOT_NOT_ALLOWED. The birthday is validated as in PATCH /api/me (→ 422);
// day = 0 and month = 0, or no birthday, clears it. The member's own "hidden" flag stays as it
// is: a hidden birthday still reaches nobody else (User.birthday, GET …/birthdays). USER_UPDATE
// goes to the member (Me) and to their workspaces (User).
message UpdateMemberBirthdayRequest {
  Birthday birthday = 1;
}

message UpdateMemberBirthdayResponse {
  MemberBirthday birthday = 1;
}

// A member's birthday as an admin sees it: hidden ones too, marked.
message MemberBirthday {
  string user_id = 1;
  Birthday birthday = 2; // unset = none
  bool hidden = 3;       // hidden by the member: shown to nobody else but here
}

// GET /api/workspaces/{id}/members/birthdays (MANAGE_NICKNAMES, docs/09 #77, the table
// "Members → Birthdays"): every member who has a birthday, hidden ones included (hidden =
// true); bots and guests are left out.
message ListMemberBirthdaysResponse {
  repeated MemberBirthday birthdays = 1;
}
