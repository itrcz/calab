syntax = "proto3";
package calaba.v1;

import "google/protobuf/timestamp.proto";
import "calaba/v1/media.proto";
import "calaba/v1/permissions.proto";
import "calaba/v1/plan.proto";
import "calaba/v1/user.proto";

enum WorkspaceVisibility {
  WORKSPACE_VISIBILITY_UNSPECIFIED = 0;
  WORKSPACE_VISIBILITY_PRIVATE = 1; // join by invite only
  WORKSPACE_VISIBILITY_OPEN = 2;    // any registered user may join as member
}

// Clock format for every time shown in a workspace (docs/09 #73). The server always sends
// AUTO, H24 or H12; UNSPECIFIED (an older server) reads as AUTO.
enum TimeFormat {
  TIME_FORMAT_UNSPECIFIED = 0;
  TIME_FORMAT_AUTO = 1; // the viewer's system locale
  TIME_FORMAT_H24 = 2;  // 16:50
  TIME_FORMAT_H12 = 3;  // 4:50 PM
}

message Workspace {
  string id = 1;
  string slug = 2; // 3..32 chars, [a-z0-9-], no leading/trailing/double '-'
  string name = 3;
  string icon_file_id = 4;
  WorkspaceVisibility visibility = 5;
  string owner_id = 6;
  google.protobuf.Timestamp created_at = 7;
  // Defaults applied to voice rooms that do not override them.
  RoomMediaSettings media_defaults = 8;
  uint64 storage_quota_bytes = 9;
  uint64 storage_used_bytes = 10;
  bool allow_self_nickname = 11; // members may set their own nickname (default true)
  // Plan and effective limits (ADR-0024). Set for members (READY, WORKSPACE_CREATE / UPDATE,
  // GET /api/workspaces[/{id}], create / join); unset in discover and invite previews. The
  // effective file quota is min(storage_quota_bytes, plan.limits.storage_mb MiB).
  WorkspacePlan plan = 12;
  // Set while a superadmin has suspended the workspace (read-only: writes get 403
  // WORKSPACE_SUSPENDED). Unset = active.
  WorkspaceSuspension suspension = 13;
  TimeFormat time_format = 14;
}

message WorkspaceSuspension {
  google.protobuf.Timestamp at = 1;
  // Why: only for the owner and admins (and the admin API); empty for everyone else.
  string reason = 2;
}

// A banned user (settings → «Banned»; MANAGE_WORKSPACE).
message WorkspaceBan {
  string workspace_id = 1;
  User user = 2;       // the banned account (guest accounts too)
  string email = 3;    // the account's address at ban time, if any: it is banned as well
  string reason = 4;
  string banned_by = 5; // user id; empty = account deleted
  google.protobuf.Timestamp created_at = 6;
}

message WorkspaceMember {
  string workspace_id = 1;
  User user = 2;
  WorkspaceRole role = 3;
  string nickname = 4;
  // Joined this workspace: "Member since" in the profile, next to user.created_at (registration).
  google.protobuf.Timestamp joined_at = 5;
  // All roles of the member (ADR-0026), built-in ones included: MEMBER (or GUEST) always,
  // ADMIN / OWNER for them, custom roles. `role` above is the highest built-in one.
  repeated string role_ids = 6;
}

message Invite {
  string id = 1;
  string workspace_id = 2;
  string code = 3; // use as calaba://join/<code>
  string created_by = 4;
  uint32 max_uses = 5; // 0 = unlimited
  uint32 uses = 6;
  google.protobuf.Timestamp expires_at = 7; // unset = never
  google.protobuf.Timestamp created_at = 8;
}

// POST /api/workspaces
message CreateWorkspaceRequest {
  string slug = 1;
  string name = 2;
  WorkspaceVisibility visibility = 3; // UNSPECIFIED = PRIVATE
}

message CreateWorkspaceResponse {
  Workspace workspace = 1;
}

// GET /api/workspaces — workspaces the caller is a member of.
message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
}

// GET /api/workspaces/discover — open workspaces the caller is not a member of.
message DiscoverWorkspacesResponse {
  repeated Workspace workspaces = 1;
}

// GET /api/workspaces/{id}
message GetWorkspaceResponse {
  Workspace workspace = 1;
  WorkspaceRole role = 2; // caller's role
}

// PATCH /api/workspaces/{id} (MANAGE_WORKSPACE). Unset fields are left unchanged.
message UpdateWorkspaceRequest {
  optional string slug = 1;
  optional string name = 2;
  optional WorkspaceVisibility visibility = 3;
  optional string icon_file_id = 4; // "" clears
  optional uint32 default_audio_bitrate_kbps = 5; // 16|24|32|48|64
  optional ScreenSharePreset default_max_stream_preset = 6;
  optional uint32 default_max_streams = 7; // 0..10
  optional bool allow_self_nickname = 8;
  optional uint32 default_camera_limit = 9; // 0..25 (0 = cameras off)
  optional TimeFormat time_format = 10; // AUTO|H24|H12 (UNSPECIFIED is 422)
}

message UpdateWorkspaceResponse {
  Workspace workspace = 1;
}

// POST /api/workspaces/{id}/join (open workspaces) and POST /api/workspaces/join/{code} (invites).
message JoinWorkspaceResponse {
  Workspace workspace = 1;
  WorkspaceMember member = 2;
}

// POST /api/workspaces/{id}/invites (MANAGE_WORKSPACE)
message CreateInviteRequest {
  uint32 max_uses = 1;           // 0 = unlimited
  uint32 expires_in_seconds = 2; // 0 = never
}

message CreateInviteResponse {
  Invite invite = 1;
}

// GET /api/workspaces/{id}/invites (MANAGE_WORKSPACE)
message ListInvitesResponse {
  repeated Invite invites = 1;
}

// GET /api/workspaces/{id}/members
message ListMembersResponse {
  repeated WorkspaceMember members = 1;
}

// PATCH /api/workspaces/{id}/members/{user_id}.
// role (legacy, kept for clients before ADR-0026; prefer PUT …/members/{user_id}/roles):
// changes the built-in role only, custom roles are kept. MANAGE_WORKSPACE; only the owner may grant/revoke ADMIN; OWNER cannot be granted here.
// nickname: the member themself or MANAGE_WORKSPACE.
message UpdateMemberRequest {
  optional WorkspaceRole role = 1;
  optional string nickname = 2;
}

message UpdateMemberResponse {
  WorkspaceMember member = 1;
}

// GET /api/invites/{code} — preview before joining. Public (no token: the /join/<code> page
// of a signed-out visitor, e.g. from an invitation email), 30 per minute per IP; an unknown,
// expired or used-up code is 404 INVITE_INVALID. An emailed invitation stays previewable
// after it was accepted (until it expires): its invitee may open the link again.
//
// POST /api/invites/{code}/join → JoinWorkspaceResponse: a link's code or an emailed code.
// An existing member gets the membership (200, no use spent). An emailed code: 403
// INVITE_EMAIL_MISMATCH for another address than the account's, 403 EMAIL_NOT_VERIFIED for
// an unverified account (confirming the address joins automatically, ADR-0027).
message GetInviteResponse {
  // Public subset only: id, slug, name, icon_file_id (the rest is unset).
  Workspace workspace = 1;
  google.protobuf.Timestamp expires_at = 2; // unset = never
  // Email invitation (ADR-0023): the code works only for this address (register with it /
  // be signed in with it), else 403 INVITE_EMAIL_MISMATCH. Prefill and lock it on the
  // sign-up form.
  string email = 3;
  uint32 member_count = 4; // members without guests
}

// ---- Invitations by email (ADR-0023). All need MANAGE_WORKSPACE (the invite right) and a
// verified email of the caller (403 EMAIL_NOT_VERIFIED). ----

// POST /api/workspaces/{id}/invites/lookup → InviteLookupResponse. Exact (case-insensitive)
// match on verified, active accounts; 20 lookups per minute per user; every lookup is logged.
message InviteLookupRequest {
  string email = 1;
}

// Empty object (user unset) = no such account: invite by email instead.
message InviteLookupResponse {
  User user = 1;
  bool member = 2; // already a member of this workspace
}

// POST /api/workspaces/{id}/members → 201 AddMemberResponse: adds a verified account found
// by lookup as `member` right away (WORKSPACE_MEMBER_ADD to the workspace, WORKSPACE_CREATE
// to the user) and mails them "you were added to …". 409 CONFLICT: already a member;
// 404: no such (verified, non-guest) user.
message AddMemberRequest {
  string user_id = 1;
}

message AddMemberResponse {
  WorkspaceMember member = 1;
}

// A pending invitation sent to an address (settings → invitations).
message EmailInvite {
  string id = 1;
  string workspace_id = 2;
  string email = 3;
  WorkspaceRole role = 4; // MEMBER or ADMIN
  string invited_by = 5;  // user id
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp expires_at = 7; // 7 days after the last send
  google.protobuf.Timestamp last_sent_at = 8;
}

// POST /api/workspaces/{id}/invites/email → 201 CreateEmailInviteResponse. Mails a link
// PUBLIC_APP_URL/join/<code> (single use, 7 days, bound to the address); the mail also shows
// the code as text (it is a valid sign-up invite code for that address). Registering with
// the address (link or not) and verifying it joins the workspace automatically. Sending
// again to the same address renews the link, at most once per 24 h (429 with Retry-After).
// role: MEMBER (default) or ADMIN (owner only). 409 CONFLICT: already a member.
message CreateEmailInviteRequest {
  string email = 1;
  optional WorkspaceRole role = 2;
}

message CreateEmailInviteResponse {
  EmailInvite invite = 1;
}

// GET /api/workspaces/{id}/invites/email → pending (not accepted) invitations, newest first.
// DELETE /api/workspaces/{id}/invites/email/{inviteId} → 204: revokes the link.
message ListEmailInvitesResponse {
  repeated EmailInvite invites = 1;
}

// ---- Bans (backlog item 32). MANAGE_WORKSPACE; the owner cannot be banned, an admin only by
// the owner, nobody bans themself. ----

// POST /api/workspaces/{id}/bans → 201 CreateBanResponse. Removes the member (like
// DELETE …/members/{user_id}: WORKSPACE_MEMBER_REMOVE, voice disconnect) and refuses every way
// back (403 BANNED): invitations, open join, email invitations (pending ones to the address are
// revoked), room links. Banning a user who is no longer a member works too. WORKSPACE_BAN_ADD
// goes to the owner / admins. reason ≤ 500 characters.
message CreateBanRequest {
  string user_id = 1;
  string reason = 2;
}

message CreateBanResponse {
  WorkspaceBan ban = 1;
}

// GET /api/workspaces/{id}/bans → newest first. DELETE /api/workspaces/{id}/bans/{user_id} →
// 204 (WORKSPACE_BAN_REMOVE to the owner / admins); the user may be invited again.
message ListBansResponse {
  repeated WorkspaceBan bans = 1;
}

// ---- Roles (ADR-0026). Mutations need MANAGE_ROLES (admins have it) and act only on roles
// below the caller's highest role (the owner: any); a non-admin cannot grant permissions
// they lack, nor MANAGE_ROLES / MANAGE_WORKSPACE; ADMINISTRATOR is never grantable. ----

// GET /api/workspaces/{id}/roles (any member) → all roles, highest position first.
message ListRolesResponse {
  repeated Role roles = 1;
}

// POST /api/workspaces/{id}/roles → 201. The new role goes to the bottom of the custom
// roles (position 2; the others move up: ROLE_UPDATE). At most 50 roles per workspace
// (built-ins included): 409 CONFLICT.
message CreateRoleRequest {
  string name = 1; // 1..32 characters after trimming
  uint32 color = 2; // 0..0xFFFFFF
  uint64 permissions = 3;
  bool mentionable = 4;
}

message CreateRoleResponse {
  Role role = 1;
}

// PATCH /api/workspaces/{id}/roles/{role_id}. Unset fields are left unchanged. Built-in
// roles: the name is fixed; OWNER / ADMIN permissions are fixed; GUEST permissions stay
// within VIEW_ROOM | SEND_MESSAGES | ATTACH_FILES | CONNECT | SPEAK | STREAM | VIDEO.
message UpdateRoleRequest {
  optional string name = 1;
  optional uint32 color = 2;
  optional uint64 permissions = 3;
  optional bool mentionable = 4;
}

message UpdateRoleResponse {
  Role role = 1;
}

// DELETE /api/workspaces/{id}/roles/{role_id} → 204 (custom roles only). Its holders keep
// their other roles (every member keeps MEMBER / GUEST); its room overrides are removed
// (ROLE_DELETE, then ROOM_PERMISSIONS_UPDATE for each room that had one).

// PUT /api/workspaces/{id}/roles/order: all custom roles, highest first; they get
// positions n+1 … 2. Roles at or above the caller's highest role must keep their place.
message SetRoleOrderRequest {
  repeated string role_ids = 1;
}

message SetRoleOrderResponse {
  repeated Role roles = 1; // all roles, highest first
}

// PUT /api/workspaces/{id}/members/{user_id}/roles (MANAGE_ROLES): the member's complete
// role set. MEMBER / GUEST may be listed or omitted but not swapped (guest → member is
// POST …/promote); OWNER cannot be granted or revoked; ADMIN only by the owner. Every added
// or removed role must be below the caller's highest role and, for a non-admin, carry no
// permission the caller lacks; the target's highest role must be below the caller's (or
// the target is the caller). → WORKSPACE_MEMBER_UPDATE.
message SetMemberRolesRequest {
  repeated string role_ids = 1;
}

message SetMemberRolesResponse {
  WorkspaceMember member = 1;
}
