syntax = "proto3";
package calaba.v1;

import "google/protobuf/timestamp.proto";
import "calaba/v1/user.proto";
import "calaba/v1/identity.proto";

// A login session = one device. Each session has its own rotating refresh token.
message Session {
  string id = 1;
  string device_name = 2;
  string ip = 3;
  string user_agent = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp last_seen_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  SessionAuthority authority = 9;
  bool current = 8; // true for the session that made the request
}

// Token pair returned by register / login / refresh.
message AuthTokens {
  string access_token = 1; // JWT HS256, `Authorization: Bearer <token>`
  google.protobuf.Timestamp access_expires_at = 2;
  string refresh_token = 3; // opaque, single use (rotated on every refresh)
  google.protobuf.Timestamp refresh_expires_at = 4;
  string session_id = 5;
  SessionAuthority authority = 6;
}

// First-party SSO completion preserves proof/test results without widening authority.
message SSOCompleteResponse {
  AuthTokens tokens = 1;
  WorkspaceAssurance assurance = 2;
  bool tested = 3;
}

// POST /api/auth/register
message RegisterRequest {
  string email = 1;
  string password = 2; // 8..256 chars
  string display_name = 3;
  // Required when REGISTRATION_MODE=invite: a valid workspace invite code — a link's code or
  // the code of an invitation sent by email. A link's code: the new user joins that workspace
  // at once. An emailed code works only with the invited address (else 403
  // INVITE_EMAIL_MISMATCH); the user joins after confirming the address (POST /api/auth/verify).
  string invite_code = 4;
  string device_name = 5;
  // Language of emails (BCP 47, e.g. "ru-RU"); empty = from Accept-Language, else English.
  // Registration sends a verification code to `email` (ADR-0023, ADR-0027) unless
  // EMAIL_VERIFICATION=optional and no email invitation waits for it (ADR-0065).
  string locale = 6;
  // Opt-in similar-address check (docs/09 #119). When set and another account has the same
  // local part at a sibling domain of the same organisation (same name, different last label:
  // kv@gptunnel.ai vs kv@gptunnel.ru; or a domain of the invite's workspace email invitations),
  // nothing is created: the response carries only similar_account = true. The client asks the
  // user and repeats the request without the flag to create the account anyway.
  bool check_similar_account = 7;
}

message RegisterResponse {
  AuthTokens tokens = 1;
  Me me = 2;
  // Set only for check_similar_account (then tokens and me are empty). Never names the other
  // address.
  bool similar_account = 3;
  // ADR-0065: the server runs EMAIL_VERIFICATION=optional — an unconfirmed address blocks
  // no action. The client shows no "confirm your email" onboarding step and no bar (unless
  // email_invite_pending); the address is offered for confirmation in the account settings.
  // false (also from servers before ADR-0065): ask as ADR-0023 says.
  bool email_verification_optional = 4;
  // ADR-0065: an email invitation waits for this account's unconfirmed address; it joins
  // only after the confirmation (ADR-0027), so the client asks for it even when
  // email_verification_optional. Set only when email_verification_optional.
  bool email_invite_pending = 5;
}

// POST /api/auth/login
message LoginRequest {
  string email = 1;
  string password = 2;
  string device_name = 3;
}

message LoginResponse {
  AuthTokens tokens = 1;
  Me me = 2;
  // ADR-0065: the server runs EMAIL_VERIFICATION=optional — an unconfirmed address blocks
  // no action. The client shows no "confirm your email" onboarding step and no bar (unless
  // email_invite_pending); the address is offered for confirmation in the account settings.
  // false (also from servers before ADR-0065): ask as ADR-0023 says.
  bool email_verification_optional = 3;
  // ADR-0065: an email invitation waits for this account's unconfirmed address; it joins
  // only after the confirmation (ADR-0027), so the client asks for it even when
  // email_verification_optional. Set only when email_verification_optional.
  bool email_invite_pending = 4;
}

// POST /api/auth/refresh (no access token needed).
// Presenting an already rotated refresh token revokes the whole session (reuse detection).
// Web clients (X-Client: web) leave refresh_token empty: it comes from the calaba_refresh
// cookie, and the rotated token is set as a cookie instead of being returned in the body.
message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  AuthTokens tokens = 1;
}

// POST /api/auth/logout. Identifies the session by the access token (Authorization) or,
// without one, by the refresh token: this field, else the calaba_refresh cookie (web).
// Revokes that session, or every session of the user when all_sessions is set.
message LogoutRequest {
  bool all_sessions = 1;
  string refresh_token = 2;
}

// GET /api/me/sessions
message ListSessionsResponse {
  repeated Session sessions = 1;
}

// ---- Email verification and password reset (ADR-0023) ----
// Codes: 6 digits, valid 10 minutes, 5 attempts, a new one at most every 60 s; at most 3
// mails per address per hour (429 with Retry-After).
//
// POST /api/auth/verify/send (access token) → 204: (re)sends the code to the pending new
// address, else to the account email. Signing in (login) while unverified also sends one
// if the last is older than 60 s. 409 CONFLICT: already verified and no pending change;
// 403: guest. Servers without SMTP mark the address verified instead (USER_UPDATE {me}).
//
// POST /api/auth/verify (access token) → VerifyEmailResponse (+ USER_UPDATE {me}): confirms
// the email (or the pending change). Afterwards pending email invitations of the address are
// accepted automatically (WORKSPACE_CREATE per workspace). 422 CODE_INVALID: wrong code;
// 422 CODE_EXPIRED: no active code (expired / 5 attempts used) — send a new one.
message VerifyEmailRequest {
  string code = 1;
}

message VerifyEmailResponse {
  Me me = 1;
  // Workspaces joined by this verification (pending email invitations of the address); the
  // same WORKSPACE_CREATE events also arrive over the gateway. Empty = none.
  repeated string joined_workspace_ids = 2;
}

// POST /api/auth/password/forgot (no auth) → 200 ForgotPasswordResponse, whether or not the
// address has an account: if it has, a reset code is mailed to it. 503: the server has no SMTP.
message ForgotPasswordRequest {
  string email = 1;
}

message ForgotPasswordResponse {
  // True only when the exact address has no account but one with the same local part exists at
  // a sibling domain of the same organisation (docs/09 #119, #137: kv@gptunnel.ai vs
  // kv@gptunnel.ru). False when the exact account exists, so the answer does not reveal it.
  // Never names the other address.
  bool similar_account = 1;
}

// POST /api/auth/password/reset (no auth) → 204. Sets the new password, marks the email
// verified and revokes every session of the account (sign in again). 422 CODE_INVALID for a
// wrong / expired code or an unknown address (indistinguishable on purpose); 422 VALIDATION
// (field "password"): 8..256 characters.
message ResetPasswordRequest {
  string email = 1;
  string code = 2;
  string password = 3;
}

// Session credentials are returned only to the bound initiating client.
message SSOFinishResponse {
  AuthTokens tokens = 1;
  WorkspaceIdentityAccess access = 2;
  Me me = 3; // restricted profile for workspace_sso/recovery
}
