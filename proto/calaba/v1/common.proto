syntax = "proto3";
package calaba.v1;

// Machine-readable error code. REST errors are returned as `ApiError` with a matching
// HTTP status (see docs/05-realtime-protocol.md, "Errors").
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INTERNAL = 1;             // 500
  ERROR_CODE_BAD_REQUEST = 2;          // 400: malformed body / query
  ERROR_CODE_VALIDATION = 3;           // 422: well-formed but invalid field values
  ERROR_CODE_UNAUTHENTICATED = 4;      // 401: missing / invalid / expired access token
  ERROR_CODE_FORBIDDEN = 5;            // 403: authenticated, but lacks permission
  ERROR_CODE_NOT_FOUND = 6;            // 404 (also used instead of 403 when the resource must stay hidden)
  ERROR_CODE_CONFLICT = 7;             // 409: unique violation (slug, email, ...)
  ERROR_CODE_RATE_LIMITED = 8;         // 429
  ERROR_CODE_INVALID_CREDENTIALS = 9;  // 401: login failed
  ERROR_CODE_INVALID_REFRESH_TOKEN = 10; // 401: refresh token unknown / expired / reused
  ERROR_CODE_REGISTRATION_CLOSED = 11; // 403: REGISTRATION_MODE=invite and no valid invite
  ERROR_CODE_INVITE_INVALID = 12;      // 404/410: invite unknown, expired or used up
  ERROR_CODE_FILE_TOO_LARGE = 13;      // 413
  ERROR_CODE_FILE_QUOTA_EXCEEDED = 14; // 413: workspace storage quota
  ERROR_CODE_PAYLOAD_TOO_LARGE = 15;   // 413: request body too large
  ERROR_CODE_UNAVAILABLE = 16;         // 503
  ERROR_CODE_ROOM_FULL = 17;           // 409: voice room user_limit reached
  ERROR_CODE_WORKSPACE_LIMIT = 18;     // 409: MAX_WORKSPACES_PER_USER owned workspaces
  ERROR_CODE_STORAGE_FULL = 19;        // 507: server-wide storage cap (STORAGE_MAX_TOTAL_BYTES)
  // 403: the account's email is not verified yet (ADR-0023): creating workspaces, invites
  // and starting DMs need a verified address. Guest accounts are not affected.
  ERROR_CODE_EMAIL_NOT_VERIFIED = 20;
  ERROR_CODE_CODE_INVALID = 21;        // 422: wrong email code (password reset: also unknown / expired)
  ERROR_CODE_CODE_EXPIRED = 22;        // 422: no active email code (expired, used up after 5 attempts) — request a new one
  // Meeting recording (ADR-0025).
  ERROR_CODE_NOT_PAIRED = 23;          // 409: the workspace is not connected to GPTunneL (ask an owner / admin)
  ERROR_CODE_ALREADY_RECORDING = 24;   // 409: the room is already being recorded
  ERROR_CODE_RECORDING_LIMIT = 25;     // 409: RECORDING_MAX_CONCURRENT recordings run on the server (used / limit)
  // 403: the workspace is suspended by a superadmin (Workspace.suspension): sending / editing
  // messages, reactions, files, voice, streams / cameras, invitations and recording are refused;
  // reading keeps working.
  ERROR_CODE_WORKSPACE_SUSPENDED = 26;
  // 403: the caller (or their email address) is banned from the workspace: joining by
  // invitation, open join, email invitation or room link is refused.
  ERROR_CODE_BANNED = 27;
  // 403: an invitation sent by email to another address than the account's (or the sign-up
  // form's): sign in with / register the invited address.
  ERROR_CODE_INVITE_EMAIL_MISMATCH = 28;
  // 409: POST …/recordings/{rid}/reupload — the recording's local file is gone (removed 7 days
  // after the recording stopped, or it never had one).
  ERROR_CODE_FILE_GONE = 29;
  // 409: POST …/recordings/{rid}/reupload — the file was already delivered to GPTunneL (only
  // …/recheck applies).
  ERROR_CODE_ALREADY_UPLOADED = 30;
  // 403: a bot writes to a person who blocked it (POST /api/me/blocked-bots/{id}, ADR-0031).
  ERROR_CODE_BOT_BLOCKED = 40;
  // One-to-one calls (ADR-0034), all 409.
  ERROR_CODE_BUSY = 41;            // POST /api/dms/{id}/call: the callee is in another call
  ERROR_CODE_IN_CALL = 42;         // POST /api/dms/{id}/call: the caller already has a call
  ERROR_CODE_CALL_NOT_ACTIVE = 43; // POST /api/rooms/{id}/join of a DM without an active call of the caller
  // 401 on POST /api/auth/refresh: the session was ended; `reason` says why: "REUSE" (a refresh
  // token was presented after its successor had been used: possible theft, both copies are
  // void), "LOGOUT", "LOGOUT_ALL", "OTHER_DEVICE" (ended from another device's session list),
  // "PASSWORD_CHANGED", "ACCOUNT_DISABLED", "GUEST_EXPIRED"; absent = unknown. Older servers
  // answer INVALID_REFRESH_TOKEN instead.
  ERROR_CODE_SESSION_REVOKED = 44;
  // 410: a signed meeting answer link (ADR-0038) after the end of the meeting.
  ERROR_CODE_EVENT_OVER = 50;
  // 409: POST /api/room-invites/{code}/join before the link's not_before (a meeting's guest
  // link works from 15 minutes before the meeting).
  ERROR_CODE_INVITE_NOT_YET_VALID = 51;
  // 409: POST /api/workspaces/{id}/freebusy/suggest with within_work_hours when the working
  // hours of the people do not intersect in the window (ADR-0041): offer to turn the flag off.
  ERROR_CODE_NO_COMMON_HOURS = 52;
  // 409: POST /api/workspaces/{id}/rooms/temp over the live temporary rooms cap (ADR-0044):
  // 20 per workspace, or 5 per creator (reason "PER_USER"); used / limit are set.
  ERROR_CODE_TEMP_ROOM_LIMIT = 53;
  // 410: the room is an archived temporary room (ADR-0044): its history is readable (VIEW_ROOM),
  // writes, reactions, voice, links and settings are not.
  ERROR_CODE_ROOM_ARCHIVED = 54;
  // Telephony (ADR-0046, sip.proto).
  // 409: telephony is off in the workspace (SIP settings disabled or not saved to LiveKit).
  ERROR_CODE_SIP_DISABLED = 55;
  // 409: the room already has a phone call that is dialing, ringing or active (one per room).
  ERROR_CODE_SIP_CALL_ACTIVE = 56;
  // 422: the number is outside the workspace's allowed_prefixes (field "number").
  ERROR_CODE_SIP_NUMBER_NOT_ALLOWED = 57;
  // 429: the workspace placed 20 calls within the last hour (Retry-After is set); for the
  // connection test: 5 per hour.
  ERROR_CODE_SIP_RATE_LIMITED = 58;
  // 502: LiveKit refused the SIP settings (PUT …/sip); the message is LiveKit's text, also
  // stored as SipSettings.last_error.
  ERROR_CODE_SIP_PROVIDER_ERROR = 59;
  ERROR_CODE_SSO_REQUIRED = 60;
  ERROR_CODE_IDENTITY_SCOPE_DENIED = 61;
  ERROR_CODE_DIRECTORY_ACCESS_DENIED = 62;
  ERROR_CODE_RECOVERY_ONLY = 63;
  ERROR_CODE_IDENTITY_CONFIG_CHANGED = 64;
  ERROR_CODE_IDENTITY_NOT_LINKED = 65;
  ERROR_CODE_IDENTITY_DEPENDENCY_UNAVAILABLE = 66;
  ERROR_CODE_RECENT_AUTH_REQUIRED = 67;
}

// Error body of every non-2xx REST response.
message ApiError {
  ErrorCode code = 1;
  string message = 2;
  // Offending field for ERROR_CODE_VALIDATION (lowerCamelCase JSON name), if any.
  string field = 3;
  // Why, when a code has several causes: "PLAN_LIMIT" = a limit of the workspace plan
  // (ADR-0024; ROOM_FULL, FILE_QUOTA_EXCEEDED); "REACTION_LIMIT" = CONFLICT on adding a
  // reaction when the caller already has `limit` different emojis on the message;
  // "OWNER_ONLY" = FORBIDDEN, only the workspace owner may do this (ADR-0029: a room's
  // restricted flag); "MESSAGE_NOT_EDITABLE" = VALIDATION on editing a forwarded copy and
  // "NOT_FORWARDABLE" = VALIDATION on forwarding a bot command or a system message that is
  // not a recording card (ADR-0033); SESSION_REVOKED: why the session ended (see there);
  // "ADMISSION_DECLINED" = RATE_LIMITED on a room link knock within 10 minutes of a decline
  // by the organizer, "ADMISSION_QUEUE_FULL" = RATE_LIMITED when 50 guests already wait for
  // the room (ADR-0040); "NOTES_LIMIT" = CONFLICT on creating a 21st notes shelf and
  // "PERSONAL_QUOTA" = FILE_QUOTA_EXCEEDED of the uploader's personal quota in a shelf
  // (ADR-0039); "FEATURE_DISABLED" = CONFLICT on setting a field of a board feature that is
  // switched off on the board, with `field` (ADR-0058 §3); "BOARD_CATEGORY_LIMIT",
  // "CHECKLIST_LIMIT", "CHECKLIST_ITEM_LIMIT" = CONFLICT on the 51st board category, the 11th
  // checklist of a task, the 101st item of a checklist (ADR-0058); "IDENTITY_NOT_CONFIGURED" =
  // CONFLICT on an SSO / directory / OAuth provider route of a server without the identity
  // operator configuration (ADR-0054: IDENTITY_PUBLIC_ORIGIN and keyrings). Absent otherwise.
  optional string reason = 4;
  // The counter and limit that were hit, when meaningful: ROOM_FULL — users in the room and
  // the room limit; FILE_QUOTA_EXCEEDED — bytes used and the effective quota in bytes;
  // REACTION_LIMIT — the caller's different emojis on the message and the per-user cap (3).
  // ADMISSION_QUEUE_FULL — the waiting guests and the cap (50). NOTES_LIMIT — the caller's
  // shelves and the cap (20).
  // Absent when not meaningful.
  optional uint64 used = 5;
  optional uint64 limit = 6;
}

// Cursor pagination over time-ordered ids (uuidv7). At most one of before/after is set.
message PageRequest {
  string before = 1; // return items with id < before (newest first)
  string after = 2;  // return items with id > after (oldest first)
  uint32 limit = 3;  // 1..100, server default 50
}

message PageInfo {
  bool has_more = 1;
}

// Empty response body (e.g. logout, delete).
message Empty {}

// GET /api/version (public, no auth): build and license information. Clients show the
// attribution required by the license (NOTICE) in their "About" screen.
message GetVersionResponse {
  string version = 1;            // release version ("dev" for local builds)
  string commit = 2;             // short git commit ("unknown" if not stamped)
  string license = 3;            // SPDX id: "BUSL-1.1"
  string commercial_license = 4; // where to obtain a commercial license
  string attribution = 5;        // "Powered by GPTunneL"
  string url = 6;                // attribution link
  string product = 7;            // product name shown to users: "Calab"
  // Where to ask for a paid plan (ADR-0024): PLAN_CONTACT_URL, else mailto:PLAN_CONTACT_EMAIL.
  string plan_contact = 8;
}
