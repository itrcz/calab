syntax = "proto3";
package calaba.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "calaba/v1/file.proto";
import "calaba/v1/message.proto";
import "calaba/v1/room.proto";

// Task boards (ADR-0042, docs/04 «Доски задач»): kanban / list / timeline of a workspace.
//
// Access: a board is computed like a room (computePermissions with the board's overrides,
// BOARD_ONLY bits): VIEW_BOARD sees the board, its tasks and comments and may comment;
// CREATE_TASKS creates tasks and edits the ones it created or is assigned to; EDIT_TASKS edits,
// moves and archives any task, moderates comments and manages statuses, labels and milestones
// (CBF-73); MANAGE_BOARD manages settings, access and the board's archive. A private board (is_private) is seen
// only by those with VIEW_BOARD from an override (a role's or their own); ADMINISTRATOR sees
// everything. Guests never see boards. A board the caller cannot see answers 404.
//
// Comments are messages of the task's hidden room (Task.room_id, Room.type TASK): the room
// endpoints (/api/rooms/{room_id}/messages…, reactions, pins, read state, files through
// POST /api/boards/{id}/files) work as in a chat; the room is not in READY rooms or room lists.
// Its permissions come from the board: VIEW_BOARD → VIEW_ROOM | SEND_MESSAGES | ATTACH_FILES,
// EDIT_TASKS adds MANAGE_MESSAGES; an archived task's room is read-only.
//
// Dates without a time (start_on, due_on, milestone due_on) are "YYYY-MM-DD"; empty = none.
// Colors are 0xRRGGBB.

enum BoardStatusType {
  BOARD_STATUS_TYPE_UNSPECIFIED = 0;
  BOARD_STATUS_TYPE_BACKLOG = 1;
  BOARD_STATUS_TYPE_UNSTARTED = 2; // «Todo»
  BOARD_STATUS_TYPE_STARTED = 3;   // the first move into it sets Task.started_at
  BOARD_STATUS_TYPE_COMPLETED = 4; // sets completed_at / completed_by
  BOARD_STATUS_TYPE_CANCELLED = 5; // sets completed_at / completed_by
}

// TASK_PRIORITY_NONE is the zero value on purpose (Linear «No priority»); the DB stores 0..4.
enum TaskPriority {
  TASK_PRIORITY_NONE = 0;
  TASK_PRIORITY_LOW = 1;
  TASK_PRIORITY_MEDIUM = 2;
  TASK_PRIORITY_HIGH = 3;
  TASK_PRIORITY_URGENT = 4;
}

enum BoardViewKind {
  BOARD_VIEW_KIND_UNSPECIFIED = 0;
  BOARD_VIEW_KIND_KANBAN = 1;
  BOARD_VIEW_KIND_LIST = 2;
  BOARD_VIEW_KIND_TIMELINE = 3;
}

// A relation is stored once: task_id BLOCKS related_id; RELATES and DUPLICATES read both ways.
enum TaskRelationKind {
  TASK_RELATION_KIND_UNSPECIFIED = 0;
  TASK_RELATION_KIND_BLOCKS = 1;
  TASK_RELATION_KIND_RELATES = 2;
  TASK_RELATION_KIND_DUPLICATES = 3;
}

// The status template of a new board (ADR-0042 §5).
enum BoardTemplate {
  BOARD_TEMPLATE_UNSPECIFIED = 0; // = SIMPLE
  BOARD_TEMPLATE_SIMPLE = 1;      // Todo / В работе / Готово
  BOARD_TEMPLATE_DEVELOPMENT = 2; // Backlog / Todo / В работе / Ревью / Готово / Отменено
  BOARD_TEMPLATE_EMPTY = 3;       // one status «Todo» (a board needs a default status)
}

// A switchable feature of a board (ADR-0058 §3). The DB stores the disabled ones as a bit mask
// (bit = the value), so a feature added later is on for existing boards.
enum BoardFeature {
  BOARD_FEATURE_UNSPECIFIED = 0;
  BOARD_FEATURE_ESTIMATE = 1;    // Task.estimate
  BOARD_FEATURE_START_DATE = 2;  // Task.start_on
  BOARD_FEATURE_DUE_DATE = 3;    // Task.due_on
  BOARD_FEATURE_PRIORITY = 4;    // Task.priority other than NONE
  BOARD_FEATURE_LABELS = 5;      // Task.label_ids
  BOARD_FEATURE_MILESTONES = 6;  // Task.milestone_id
  BOARD_FEATURE_SUBTASKS = 7;    // new Task.parent_id, checklist item convert
  BOARD_FEATURE_RELATIONS = 8;   // adding relations (removing stays allowed)
  BOARD_FEATURE_APPROVALS = 9;   // approvers, votes and the approval gate
  BOARD_FEATURE_CHECKLISTS = 10; // creating / editing checklists (deleting stays allowed)
  BOARD_FEATURE_ATTACHMENTS = 11; // attachments of the description
  BOARD_FEATURE_COMMENTS = 12;   // the task room is read-only (like an archived task)
  BOARD_FEATURE_TIMELINE = 13;   // the timeline view (client only)
  BOARD_FEATURE_FORMS = 14;      // intake forms: creating / editing, and opening one
  BOARD_FEATURE_AUTOMATIONS = 15; // rules: creating / enabling / testing; enabled rules pause
  BOARD_FEATURE_GIT_LINKS = 16;  // the Git section and badge of a task (client only)
}

// The scale of Task.estimate (ADR-0058 §3). Writes outside the scale are 422 (field
// "estimate"); changing the scale does not rewrite tasks. UNSPECIFIED is never sent.
enum EstimateScale {
  ESTIMATE_SCALE_UNSPECIFIED = 0;
  ESTIMATE_SCALE_FIBONACCI = 1; // 1, 2, 3, 5, 8, 13, 21 (the default)
  ESTIMATE_SCALE_LINEAR = 2;    // 1..10
  ESTIMATE_SCALE_TSHIRT = 3;    // XS = 1, S = 2, M = 3, L = 5, XL = 8 (the number is stored)
}

// A category of the boards list (ADR-0058 §1), separate from room categories. Seen by every
// member who sees boards; clients hide categories without visible boards.
message BoardCategory {
  string id = 1;
  string workspace_id = 2;
  string name = 3; // 1..100 characters
  int32 position = 4;
}

// An item of a task checklist (ADR-0058 §2).
message TaskChecklistItem {
  string id = 1;
  string checklist_id = 2;
  string task_id = 3;
  string text = 4; // 1..500 characters
  bool done = 5;
  string done_by = 6;                       // empty while not done
  google.protobuf.Timestamp done_at = 7;    // unset while not done
  double position = 8;                      // fractional order within the checklist, ascending
  string created_by = 9;
  google.protobuf.Timestamp created_at = 10;
}

// A named checklist of a task (≤ 10 per task, ≤ 100 items each).
message TaskChecklist {
  string id = 1;
  string task_id = 2;
  string title = 3; // 1..100 characters
  int32 position = 4;
  repeated TaskChecklistItem items = 5; // by position
  string created_by = 6;
  google.protobuf.Timestamp created_at = 7;
}

// A milestone inside a task (ADR-0063): a stage with a target date, ≤ 20 per task. Subtasks of
// the task may link to it (Task.task_milestone_id); while live non-cancelled subtasks are linked
// (total > 0) the server completes it exactly when all of them are completed, otherwise a person
// toggles it (UpdateTaskMilestoneRequest.completed).
message TaskMilestone {
  string id = 1;
  string task_id = 2;
  string name = 3;                              // 1..60 characters
  string due_on = 4;                            // "YYYY-MM-DD"; empty = no date
  double position = 5;                          // fractional order within the task, ascending
  google.protobuf.Timestamp completed_at = 6;   // unset while not completed
  string completed_by = 7;                      // empty for the server's completion without an actor
  uint32 done = 8;                              // linked live subtasks in a completed status
  uint32 total = 9;                             // linked live subtasks, cancelled ones not counted
  string created_by = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

// The milestones of a task over all of them (the card's chip «◇ 2/4»).
message TaskMilestoneProgress {
  uint32 done = 1;  // completed milestones
  uint32 total = 2; // all milestones
}

message BoardStatus {
  string id = 1;
  string name = 2; // 1..32 characters
  BoardStatusType type = 3;
  uint32 color = 4;
  int32 position = 5; // column order, ascending
  bool is_default = 6; // exactly one per board: new tasks without status_id get it
  // Icon token (ADR-0093); "" = the icon of the type (backlog dashed, unstarted circle,
  // started half, completed check, cancelled x). Tokens: dashed, circle, quarter, half,
  // three-quarters, check, x, eye, shield-check, hourglass, pause, flag, star, bolt, rocket,
  // bug, inbox, archive, lock. The list lives in packages/protocol STATUS_ICONS and Go
  // boards.StatusIcons (shared vector proto/testdata/status_icons.json). Display only:
  // the type keeps the semantics (finished / started) for filters and rules.
  string icon = 7;
}

message BoardLabel {
  string id = 1;
  string name = 2; // 1..32 characters, unique per board (case-insensitive)
  uint32 color = 3;
  int32 position = 4;
}

message BoardMilestone {
  string id = 1;
  string name = 2; // 1..60 characters
  string due_on = 3;
  int32 position = 4;
}

// A saved view (ADR-0042 §3): shared ones are seen by everyone who sees the board and edited
// with MANAGE_BOARD; personal ones only by their author.
message BoardView {
  string id = 1;
  string name = 2; // 1..40 characters
  BoardViewKind kind = 3;
  TaskFilter filter = 4;
  // "" | "status" | "assignee" | "priority" | "label" | "milestone" (≤ 32 characters, not
  // interpreted by the server).
  string group_by = 5;
  // "updated" | "due" | "priority" | "key" | "manual", optionally with "-" for descending
  // (≤ 32 characters, not interpreted by the server).
  string sort = 6;
  bool shared = 7;
  string created_by = 8;
  int32 position = 9;
  string board_id = 10;
}

message Board {
  string id = 1;
  string workspace_id = 2;
  string name = 3;         // 1..60 characters
  string key = 4;          // 2..6 of A–Z0–9 starting with a letter, unique in the workspace; «FNG»
  string emoji = 5;        // one emoji or empty
  string icon_file_id = 6; // an image of the workspace; empty = none
  string description = 7;  // ≤ 2000 characters
  bool is_private = 8;
  int32 position = 9; // order in the boards list, ascending
  uint32 auto_archive_days = 10; // completed / cancelled tasks older than this are archived; 0 = never
  // The recipient's effective bits on the board (READY, REST; in BOARD_* events recomputed per
  // recipient by the gateway).
  uint64 permissions = 11;
  uint32 open_tasks = 12;    // live tasks not in a completed / cancelled status
  uint32 my_open_tasks = 13; // of them assigned to the recipient (0 in BOARD_* events: keep the known value)
  string created_by = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp archived_at = 16; // set = in the archive (only in ?archived=1 lists)
  repeated BoardStatus statuses = 17; // by position
  repeated BoardLabel labels = 18;    // by position
  repeated BoardMilestone milestones = 19; // by position
  // Shared views and the recipient's own (REST; READY and BOARD_* events carry shared ones only).
  repeated BoardView views = 20;
  // The board's access overrides (like Room.permission_overrides): role / user allow and deny
  // of the board bits.
  repeated RoomPermissionOverride permission_overrides = 21;
  bool key_locked = 22;         // the key can no longer change: the board has had a task
  string default_view_id = 23;  // a shared view opened by default; empty = kanban without filter
  // The pre-3.5 «закрытая» flag (ADR-0048). Since the ADR-0058 addendum 2026-10-14 every
  // private board (is_private) is closed even to administrators and the owner — VIEW_BOARD only
  // from an allow override on the board (by role or personally) or being its creator; the owner
  // alone bypasses while Workspace.owner_sees_private is on. The server keeps restricted equal
  // to is_private; clients read either as «private». Strangers get 404.
  bool restricted = 24;
  // Board categories (ADR-0058 §1): the category the board is listed in; empty = none.
  // position is the order within that container (a category or «без категории»).
  string category_id = 25;
  // Board features switched off (ADR-0058 §3), ascending, no duplicates; empty = all on. The data
  // of a disabled feature is kept and still served; writes that set it are refused (409
  // CONFLICT, reason FEATURE_DISABLED, field = the JSON field name).
  repeated BoardFeature disabled_features = 26;
  // The estimate scale (ADR-0058 §3); the server always sends a concrete value.
  EstimateScale estimate_scale = 27;
  // Task-scoped access (ADR-0059, ADR-0076): the recipient sees the board only through its
  // tasks - those where they are an assignee, an approver or a watcher; permissions = 0 (task
  // bits come from taskPermissions), permission_overrides empty, open_tasks 0. Restricted
  // boards too (ADR-0076); never for guests or bots. Create-only (ADR-0115): permissions =
  // CREATE_TASKS - the recipient creates tasks and also sees the ones they authored.
  bool task_scoped = 28;
  // Automations (ADR-0060): rules of the board, enabled or not (BOARD_UPDATE follows a rule
  // created or deleted).
  uint32 rules_count = 29;
  // Approvals (ADR-0082): seconds after an approver is added (or their decided vote is reset by
  // a change of the task) before the APPROVAL_REQUESTED notice goes out; one of 0 (immediately),
  // 60, 300, 900, 1800, 3600. An approver removed or a vote cast meanwhile cancels the notice.
  uint32 approval_notify_delay_seconds = 30;
  // «Инструкция для ИИ» (CBF-68, ADR-0118): how the model shapes a smart task of this board,
  // ≤ 4000 characters. Only in GET /api/boards/{id} and the PATCH answer, and only to a
  // recipient with VIEW_BOARD; empty everywhere else (lists, READY, BOARD_* events).
  string ai_instruction = 31;
  // «Искать дубли за 2 недели» (CBF-75, ADR-0123): a smart task filed on this board is first
  // compared by the model with the board's tasks of the last 14 days the person sees; the model
  // may refuse it as a duplicate (CreateSmartTaskResponse.refusal). Off by default.
  bool ai_find_duplicates = 32;
  // CBF-156, ADR-0160: whether the approval holds status changes on this board. HOLD (the
  // default) = ADR-0049 §2: a task PENDING / REJECTED does not go forward (409
  // TASK_APPROVAL_REQUIRED, override_approval for MANAGE_BOARD). OFF = any status change by
  // whoever may edit the task. In both modes a status change keeps every vote.
  ApprovalGate approval_gate = 33;
}

// Whether the approval holds the status changes of a board's tasks (ADR-0160).
enum ApprovalGate {
  APPROVAL_GATE_UNSPECIFIED = 0;
  APPROVAL_GATE_HOLD = 1; // the default: no forward move while PENDING / REJECTED
  APPROVAL_GATE_OFF = 2;  // the approval never holds a status change
}

message TaskAssignee {
  string user_id = 1;
  bool is_lead = 2; // exactly one lead when the list is not empty
  string note = 3;  // «за что отвечает», ≤ 120 characters
  string assigned_by = 4;
  google.protobuf.Timestamp assigned_at = 5;
}

// Requested assignee (POST /tasks, PUT /tasks/{id}/assignees).
message TaskAssigneeInput {
  // A member of the workspace, not a guest (one who does not see the board then sees this task,
  // ADR-0059 / ADR-0076); a bot only one who sees the board.
  string user_id = 1;
  bool is_lead = 2;
  string note = 3;
}

// Task approvals (ADR-0049). The task's derived state: NONE = no approvers; PENDING = fewer
// approvals than the quorum and no rejection; APPROVED = approvals ≥ the quorum and no
// rejection; REJECTED = at least one approver rejected (a veto, the quorum does not matter).
// The quorum is min(Task.approval_required, number of approvers); approval_required 0 = all.
// The server computes it; clients read Task.approval_state.
enum TaskApprovalState {
  TASK_APPROVAL_STATE_UNSPECIFIED = 0;
  TASK_APPROVAL_STATE_NONE = 1;
  TASK_APPROVAL_STATE_PENDING = 2;
  TASK_APPROVAL_STATE_APPROVED = 3;
  TASK_APPROVAL_STATE_REJECTED = 4;
}

// One approver's vote.
enum ApproverState {
  APPROVER_STATE_UNSPECIFIED = 0;
  APPROVER_STATE_PENDING = 1;
  APPROVER_STATE_APPROVED = 2;
  APPROVER_STATE_REJECTED = 3;
}

// An approver of a task (ADR-0049 §1): a member who sees the board, not a guest nor a bot.
message TaskApprover {
  string user_id = 1;
  ApproverState state = 2;
  string comment = 3; // ≤ 500 characters; always set when REJECTED
  google.protobuf.Timestamp decided_at = 4; // unset while PENDING
  string added_by = 5;
  google.protobuf.Timestamp added_at = 6;
  // ADR-0108: the board manager (MANAGE_BOARD) who recorded this approval on the approver's
  // behalf; empty for the approver's own vote, and when that manager's account was deleted
  // (on_behalf stays true). Cleared with on_behalf.
  string recorded_by = 7;
  // ADR-0108: this approval was recorded on the approver's behalf, not cast by them. Only with
  // state APPROVED; cleared by any later change of the vote (the approver's own vote, a
  // withdrawal, a reset).
  bool on_behalf = 8;
}

message TaskRelation {
  string task_id = 1;    // the blocking side for BLOCKS
  string related_id = 2;
  TaskRelationKind kind = 3;
}

message Task {
  string id = 1;
  string board_id = 2;
  uint32 number = 3;     // per board, from 1
  string key = 4;        // board key + "-" + number: "FNG-12" (follows the board on a move)
  string title = 5;      // 1..200 characters
  string description = 6; // markdown-lite, ≤ 20000 characters
  string status_id = 7;
  TaskPriority priority = 8;
  repeated TaskAssignee assignees = 9; // the lead first
  string created_by = 10;              // a user or a bot
  uint32 estimate = 11;                // 1..21; 0 = none
  string start_on = 12;
  string due_on = 13;
  string parent_id = 14;               // one level of subtasks
  string milestone_id = 15;
  double position = 16;                // order within the status (fractional; ascending)
  string room_id = 17;                 // the hidden comment room (Room.type TASK)
  repeated string label_ids = 18;
  uint32 subtask_count = 19;           // live subtasks
  uint32 subtask_done = 20;            // of them in a completed / cancelled status
  uint32 comment_count = 21;           // live messages of the task room
  uint32 attachment_count = 22;
  repeated TaskRelation relations = 23; // both directions
  // The recipient's subscription (REST, and TASK_UPDATE on the recipient's user channel;
  // see viewer_state).
  bool subscribed = 24;
  bool muted = 25;
  google.protobuf.Timestamp created_at = 26;
  google.protobuf.Timestamp updated_at = 27;
  google.protobuf.Timestamp started_at = 28;   // first move into a STARTED status
  google.protobuf.Timestamp completed_at = 29; // in a COMPLETED / CANCELLED status since then
  string completed_by = 30;
  google.protobuf.Timestamp archived_at = 31;
  string workspace_id = 32;
  repeated FileMeta attachments = 33; // GET /tasks/{id} only (others: attachment_count)
  // The recipient has something unseen in the task (a notification by their task level):
  // cleared by PUT /api/tasks/{id}/read.
  bool unread = 34;
  // subscribed / muted / unread are the recipient's: true in REST answers and in TASK_UPDATE on
  // the recipient's user channel; false in board broadcasts (TASK_CREATE / TASK_UPDATE on the
  // workspace channel) — keep the known values then.
  bool viewer_state = 35;
  // Approvals (ADR-0049): approvers by added_at; approval_required = approvals needed, 0 =
  // all; approval_state is derived by the server (see TaskApprovalState). While the state is
  // PENDING or REJECTED the task cannot move "forward": into a status with a greater position
  // than the current one, or into any COMPLETED status (409 CONFLICT, reason
  // "TASK_APPROVAL_REQUIRED"); backwards, within the column and into CANCELLED are allowed.
  repeated TaskApprover approvers = 36;
  uint32 approval_required = 37;
  TaskApprovalState approval_state = 38;
  // Checklists (ADR-0058 §2): items over all checklists of the task and of them done (every
  // task list, events and REST); the checklists themselves only in GET /tasks/{id}.
  uint32 checklist_total = 39;
  uint32 checklist_done = 40;
  repeated TaskChecklist checklists = 41; // GET /tasks/{id} only, by position
  // Git links (ADR-0060 §4): branches, pull / merge requests and commits that mention the task
  // key, newest first; the links only in GET /tasks/{id}, the counter in every task.
  repeated TaskGitLink git_links = 42;
  uint32 git_links_count = 43;
  // Milestones inside the task (ADR-0063), by position: in every task (lists, events, REST) —
  // the timeline draws them on the task's bar and TASK_UPDATE of the task carries their changes.
  repeated TaskMilestone milestones = 44;
  TaskMilestoneProgress milestone_progress = 45; // unset when the task has no milestones
  // A subtask's milestone: one of its parent's milestones (ADR-0063); reset when the parent
  // changes. Empty = none.
  string task_milestone_id = 46;
  // Watchers (ADR-0076): members who see the card - an explicit role, always also subscribed.
  // A watcher who does not see the board sees this task (VIEW_BOARD on it: view, comment,
  // subscribe). Sorted by user id. See PUT / DELETE /api/tasks/{id}/watchers.
  repeated string watcher_ids = 47;
  // Releases (board task #101): one per environment the task was deployed to (the first release
  // of that environment that carried it), newest first. In every task form.
  repeated TaskRelease releases = 48;
}

// One entry of the task journal (ADR-0042 §1): written on every change, never edited.
// kind: "created" | "status" | "assignees" | "priority" | "labels" | "dates" | "estimate" |
// "parent" | "milestone" | "relation" | "title" | "description" | "archived" | "restored" |
// "moved_board" | "attachments" | "approvers" | "approval" | "approvals_reset" | "checklist" |
// "git" | "milestones" (ADR-0063, see TaskMilestoneResponse) | "watchers" (ADR-0076). before / after
// hold the changed fields (e.g. {"status_id": "…", "status_type": "started"},
// {"assignees": [{"user_id": …}]}). Approvals (ADR-0049): "approvers" — {"user_ids": […],
// "required": n} before and after; "approval" — after {"user_id", "state": "pending" |
// "approved" | "rejected", "comment"}; "approvals_reset" — the title / description / its
// attachments changed and every vote went back to pending: before {"approved": n,
// "rejected": n}. A vote or a change of approvers that decides the task also carries
// after.approval_state "approved" | "rejected" (ADR-0060). ADR-0108: an "approval" a board
// manager recorded or withdrew for the approver (user_id) has actor = the manager and
// after.on_behalf true; before.on_behalf (and recorded_by, its author) marks a replaced one;
// "approval_override" — a status moved forward past an incomplete approval: after
// {"from_status_id", "status_id", "approved", "quorum", "rejected"} (the "status" entry is
// written as well). "git" (ADR-0060 §4): after {"event":
// the RuleGitEvent name without its prefix, "kind": "branch" | "pr" | "commit", "provider",
// "repo", "ref", "title", "url", "state", "commits": [{"sha", "title", "url"}] of a push,
// "branch", "author" (who made the event); a pull request also "target_branch", "draft",
// "users" (reviewers added / the approver)}; before {"state", "title", "draft"} of a pull
// request that changed. "release" (board task #101): the task entered a release, after
// {"release_id", "name", "environment", "sha", "url"} (actor = who posted the release).
// Snapshots (ADR-0091): "description" — {"length", "text"} before and after; "attachments" —
// {"file_ids", "files": [{"file_id", "name", "size", "mime"}]}; "labels" — {"label_ids",
// "labels": [{"id", "name", "color"}]}; "milestone" — {"milestone_id", "name"}; "parent" —
// {"parent_id", "key", "title"}; "relation" — {"kind", "related_id", "key", "title"} (entries
// written before carry only the ids; key and title only for a task the reader sees, ADR-0059 —
// the live TASK_ACTIVITY and the webhook changes have the id alone).
// Comments (ADR-0091): "comment" — a comment was posted (actor = its author): after
// {"message_id", "text", "attachments": [{"file_id", "name", "size", "mime"}], "reply_to_id"?,
// "forwarded"}; "comment_edit" — before / after {"message_id", "text", "attachments"} (edits of
// one comment by one person within 5 minutes merge, ADR-0081); "comment_delete" — before
// {"message_id", "author_id", "text", "attachments"}, after empty (actor = who deleted it).
// Automations (ADR-0060): a change made by a rule has actor_id empty and rule_id set; the client
// shows «Автоматизация: <rule name>» (names from the board's rules / BOARD_RULE_UPDATE).
message TaskActivity {
  string id = 1;
  string task_id = 2;
  string actor_id = 3; // a user or a bot
  string kind = 4;
  google.protobuf.Struct before = 5;
  google.protobuf.Struct after = 6;
  google.protobuf.Timestamp created_at = 7;
  string board_id = 8;
  string rule_id = 9; // the automation rule that made the change (ADR-0060); empty otherwise
  // ADR-0106: the bot that made the change on behalf of actor_id (its owner); empty otherwise.
  string via_bot_id = 10;
  // ADR-0156: the channel of the change, "mcp" when actor_id (a bot, or a person through via_bot_id)
  // made it through the MCP endpoint; clients show «via MCP». Empty otherwise.
  string via = 11;
}

// The task feed: comments (messages of the task room) and journal entries in one timeline.
message TaskActivityItem {
  oneof item {
    Message message = 1;
    TaskActivity activity = 2;
  }
}

// Filter fields (ADR-0042 §3). Values by field:
// STATUS: status ids. STATUS_TYPE: "backlog" | "unstarted" | "started" | "completed" |
// "cancelled". ASSIGNEE / LEAD / CREATOR / SUBSCRIBER: user ids or "me". PRIORITY: "0".."4"
// (or none | low | medium | high | urgent). ESTIMATE: number (or values). LABEL / MILESTONE /
// PARENT: ids. RELATION: "blocks" | "blocked" | "relates" | "duplicates". CREATED_AT /
// UPDATED_AT: from / to. START_ON / DUE_ON: values "YYYY-MM-DD" (BETWEEN: two), else from / to
// (their UTC date). Date values may be relative (saved views): "today", "week_start",
// "week_end" (Monday..Sunday), "month_end", "-7d" / "+14d" (days from today), today in the
// caller's profile zone. HAS_ATTACHMENTS / HAS_COMMENTS / ARCHIVED: IS "true" | "false" (or
// NOT_EMPTY / EMPTY). TEXT: CONTAINS values[0] (title and description words, or the key).
// APPROVAL_STATE (ADR-0049): "none" | "pending" | "approved" | "rejected" with IS / ANY_OF /
// IS_NOT / NONE_OF. APPROVER_PENDING: user ids or "me" — an approver whose vote is still
// pending («Ждут моего согласования»); EMPTY / NOT_EMPTY: nobody's / somebody's vote pending.
// BOARD (ADR-0139): board ids with IS / IS_NOT (the cross-board task search).
// RELEASE (board task #101): release ids with IS / ANY_OF / IS_NOT / NONE_OF; EMPTY / NOT_EMPTY:
// in no release / in some release.
enum TaskField {
  TASK_FIELD_UNSPECIFIED = 0;
  TASK_FIELD_STATUS = 1;
  TASK_FIELD_STATUS_TYPE = 2;
  TASK_FIELD_ASSIGNEE = 3;
  TASK_FIELD_LEAD = 4;
  TASK_FIELD_CREATOR = 5;
  TASK_FIELD_PRIORITY = 6;
  TASK_FIELD_ESTIMATE = 7;
  TASK_FIELD_LABEL = 8;
  TASK_FIELD_MILESTONE = 9;
  TASK_FIELD_PARENT = 10;
  TASK_FIELD_RELATION = 11;
  TASK_FIELD_SUBSCRIBER = 12;
  TASK_FIELD_CREATED_AT = 13;
  TASK_FIELD_UPDATED_AT = 14;
  TASK_FIELD_START_ON = 15;
  TASK_FIELD_DUE_ON = 16;
  TASK_FIELD_HAS_ATTACHMENTS = 17;
  TASK_FIELD_HAS_COMMENTS = 18;
  TASK_FIELD_TEXT = 19;
  TASK_FIELD_ARCHIVED = 20;
  TASK_FIELD_APPROVAL_STATE = 21;
  TASK_FIELD_APPROVER_PENDING = 22;
  TASK_FIELD_BOARD = 23;
  TASK_FIELD_RELEASE = 24;
}

// Operations. IS / ANY_OF: one of values (LABEL IS: all of values); IS_NOT / NONE_OF: none of
// values; EMPTY / NOT_EMPTY: the field is unset / set; BEFORE / AFTER / BETWEEN: dates and
// times (BEFORE < to, else from; AFTER ≥ from, else to; BETWEEN [from, to]); GT / LT: number
// (ESTIMATE, PRIORITY); CONTAINS: TEXT.
enum TaskOp {
  TASK_OP_UNSPECIFIED = 0;
  TASK_OP_IS = 1;
  TASK_OP_IS_NOT = 2;
  TASK_OP_ANY_OF = 3;
  TASK_OP_NONE_OF = 4;
  TASK_OP_EMPTY = 5;
  TASK_OP_NOT_EMPTY = 6;
  TASK_OP_BEFORE = 7;
  TASK_OP_AFTER = 8;
  TASK_OP_BETWEEN = 9;
  TASK_OP_GT = 10;
  TASK_OP_LT = 11;
  TASK_OP_CONTAINS = 12;
}

message TaskCondition {
  TaskField field = 1;
  TaskOp op = 2;
  repeated string values = 3; // ≤ 100
  google.protobuf.Timestamp from = 4;
  google.protobuf.Timestamp to = 5;
  int32 number = 6;
}

// ≤ 30 conditions; all must hold, or any one with `any`. An unsupported field / op pair is 422.
message TaskFilter {
  repeated TaskCondition conditions = 1;
  bool any = 2;
}

// ---- boards ----

// GET /api/workspaces/{id}/boards[?archived=1] — the boards the caller sees, by position
// (archived ones instead with archived=1, MANAGE_BOARD on them). Guests: 403.
message ListBoardsResponse {
  repeated Board boards = 1;
}

// POST /api/workspaces/{id}/boards → 201 BoardResponse (CREATE_BOARDS, ADR-0048). The creator gets a
// user override with every board bit. ≤ 50 boards per workspace and the plan's max_boards
// (409 CONFLICT, reason "PLAN_LIMIT" / "BOARD_LIMIT").
message CreateBoardRequest {
  string name = 1;
  string key = 2; // empty = derived from the name
  string emoji = 3;
  bool is_private = 4;
  string description = 5;
  BoardTemplate template = 6;
  string icon_file_id = 7;
  // Private boards only (ADR-0058 addendum 2026-10-14; 422 on a public one): who is added —
  // members of the workspace (422 otherwise) get a personal allow VIEW_BOARD | CREATE_TASKS,
  // roles of the workspace (not owner / admin / guest built-ins) a role allow of the same.
  repeated string member_ids = 8;
  repeated string role_ids = 9;
}

// Answer of every board route that changes the board (statuses, labels, milestones,
// permissions, position): the board as the caller sees it. BOARD_UPDATE goes to its viewers.
message BoardResponse {
  Board board = 1;
}

// PATCH /api/boards/{id} (MANAGE_BOARD). key only while the board had no task (409 otherwise).
// is_private true makes the members' role lose VIEW_BOARD (an override), false drops that deny.
message UpdateBoardRequest {
  optional string name = 1;
  optional string key = 2;
  optional string emoji = 3;
  optional string icon_file_id = 4;
  optional string description = 5;
  optional bool is_private = 6;
  optional uint32 auto_archive_days = 7; // 0..3650
  optional string default_view_id = 8;   // a shared view of the board; "" = none
  // Deprecated alias of is_private (ADR-0058 addendum 2026-10-14): true = private, false =
  // public; with is_private both must agree (422 otherwise). Switching a board to private gives
  // the caller a personal allow VIEW_BOARD | MANAGE_BOARD so they keep access.
  optional bool restricted = 9;
  // Board features (ADR-0058 §3): set_disabled_features replaces the disabled set with
  // disabled_features (UNSPECIFIED and unknown values are 422); estimate_scale UNSPECIFIED is 422.
  bool set_disabled_features = 10;
  repeated BoardFeature disabled_features = 11;
  optional EstimateScale estimate_scale = 12;
  // ADR-0082: one of 0, 60, 300, 900, 1800, 3600 (422 otherwise). Notices already scheduled
  // keep their time.
  optional uint32 approval_notify_delay_seconds = 13;
  // CBF-68: «Инструкция для ИИ», ≤ 4000 characters (trimmed; "" = none), 422 field aiInstruction.
  optional string ai_instruction = 14;
  // CBF-75: «Искать дубли за 2 недели» (MANAGE_BOARD).
  optional bool ai_find_duplicates = 15;
  // CBF-156, ADR-0160 (MANAGE_BOARD): HOLD or OFF; UNSPECIFIED / unknown is 422 approvalGate.
  optional ApprovalGate approval_gate = 16;
}

// PUT /api/boards/{id}/position (MANAGE_BOARD): the new index in the list; others shift
// (BOARD_UPDATE for each board that moved). category_id set moves the board into that category
// of the workspace ("" = none) and position is the index there (ADR-0058 §1).
message SetBoardPositionRequest {
  int32 position = 1;
  optional string category_id = 2;
}

// GET / PUT /api/boards/{id}/permissions (MANAGE_BOARD; bots too, ADR-0109). Like room overrides:
// ≤ 100 targets, only board bits (VIEW_BOARD, CREATE_TASKS, EDIT_TASKS, MANAGE_BOARD), a
// non-administrator may only grant / remove bits they hold on the board.
message SetBoardPermissionsRequest {
  repeated RoomPermissionOverride overrides = 1;
}

// GET /api/tasks/{id}/mention-access?user_ids=a,b,c (any viewer of the task, ≤ 200 ids) -
// who of the given members sees the board and who would only get this card if @mentioned
// (ADR-0076 section 5). Members in neither list cannot be called (guests, bots without access).
message TaskMentionAccessResponse {
  repeated string see_ids = 1;
  repeated string card_ids = 2;
}

message BoardPermissionsResponse {
  repeated RoomPermissionOverride overrides = 1;
  Board board = 2;
  // Members who see the board only through its cards (ADR-0059 / ADR-0076: assignees,
  // approvers, watchers of live tasks without VIEW_BOARD) - «Позванные по карточкам: N».
  uint32 task_scoped_count = 3;
}

// POST /api/boards/{id}/statuses (MANAGE_BOARD, ≤ 20) → BoardResponse.
message CreateBoardStatusRequest {
  string name = 1;
  BoardStatusType type = 2; // UNSPECIFIED = UNSTARTED
  uint32 color = 3;
  optional int32 position = 4; // unset = last
  bool is_default = 5;
  optional string icon = 6; // BoardStatus.icon token; unset or "" = by type; unknown = 422 icon
}

// PATCH /api/boards/{id}/statuses/{sid} → BoardResponse. DELETE …/{sid}?move_to=<sid> moves its
// tasks (archived ones too) to move_to; the default status cannot be deleted (make another the
// default first).
message UpdateBoardStatusRequest {
  optional string name = 1;
  optional BoardStatusType type = 2;
  optional uint32 color = 3;
  optional int32 position = 4; // new index; others shift
  optional bool is_default = 5; // only true: the previous default loses it
  optional string icon = 6; // BoardStatus.icon token; "" resets to the type icon; unknown = 422 icon
}

// POST /api/boards/{id}/labels (MANAGE_BOARD, ≤ 50) → BoardResponse. CREATE_TASKS may create a
// label too (the on-the-fly «Создать лейбл» of the picker); editing / deleting needs MANAGE_BOARD.
message CreateBoardLabelRequest {
  string name = 1;
  uint32 color = 2;
  optional int32 position = 3;
}

message UpdateBoardLabelRequest {
  optional string name = 1;
  optional uint32 color = 2;
  optional int32 position = 3;
}

// POST /api/boards/{id}/milestones (MANAGE_BOARD, ≤ 50) → BoardResponse.
message CreateBoardMilestoneRequest {
  string name = 1;
  string due_on = 2;
  optional int32 position = 3;
}

message UpdateBoardMilestoneRequest {
  optional string name = 1;
  optional string due_on = 2; // "" = none
  optional int32 position = 3;
}

// ---- tasks ----

// GET /api/boards/{id}/tasks?filter=<TaskFilter JSON>&archived=1&updated_after=<RFC 3339>&
// cursor=&limit= — ≤ 500 per page (default 500), by status then position; next_cursor empty =
// the last page. Archived tasks only with archived=1 (then only them) or an ARCHIVED condition.
// With archived=1 the order is newest archived first and the cursor is opaque (limit applies).
message ListTasksResponse {
  repeated Task tasks = 1;
  string next_cursor = 2;
}

// POST /api/boards/{id}/tasks → 201 TaskResponse (CREATE_TASKS). status_id empty = the default
// status; after_task_id: place after that task of the same status (empty = last).
// from_message_id: «Создать задачу из сообщения» — a message the caller can see (404
// otherwise); the description gets its quote and link. attachment_ids: unattached uploads of
// the caller (POST /api/boards/{id}/files), ≤ 20. ≤ 5000 live tasks per board (409 CONFLICT,
// reason "BOARD_TASK_LIMIT"), ≤ 200 subtasks per parent. approver_ids / approval_required:
// approvers from the start (ADR-0049; the rules of SetTaskApproversRequest), each subscribed and
// notified (APPROVAL_REQUESTED).
message CreateTaskRequest {
  string title = 1;
  string description = 2;
  string status_id = 3;
  TaskPriority priority = 4;
  repeated TaskAssigneeInput assignees = 5;
  repeated string label_ids = 6;
  string start_on = 7;
  string due_on = 8;
  uint32 estimate = 9;
  string parent_id = 10;
  string milestone_id = 11;
  string after_task_id = 12;
  string from_message_id = 13;
  repeated string attachment_ids = 14;
  repeated string approver_ids = 15;
  uint32 approval_required = 16;
}

// POST /api/workspaces/{id}/smart-tasks → 201 CreateSmartTaskResponse (CBF-68, ADR-0118;
// CBF-75, ADR-0123): «Создать умную задачу». People only, never guests; the workspace's AI must
// be READY (GetAiStatusResponse), else 409 CONFLICT reason "AI_NOT_READY". The server sends the
// model the text, the files (images and the first and last page of a PDF as images, text files
// as text, other files by name and type; at most 4 images, ~5 MB of them, 20 000 characters of
// text) and the boards where the caller may create tasks (CREATE_TASKS: name, key, description,
// labels); the model picks one board, which must be in that list. With the board's
// ai_instruction the model then shapes the task (title, description, labels of the board,
// priority) by it; without one the description is the text as is. With the board's
// ai_find_duplicates the model also gets the board's live tasks of the last 14 days that the
// caller sees (key, title, the start of the description). The model may refuse to file the
// task: 200 with refusal set and no task. The task is created as POST /api/boards/{id}/tasks by
// the caller (their rights, limits and features of the board; the original text is kept in the
// description). The model never sets assignees, approvers, watchers or access; @mentions it
// adds are dropped. A model that refuses images is asked again with the files by name
// (files_unseen).
// Errors: 422 VALIDATION text (1..4000 characters) | attachmentIds (≤ 20 unattached uploads of
// the caller in the workspace, POST /api/workspaces/{id}/files) | priority; 409 CONFLICT reason
// "NO_BOARDS" (no board to create on), "AI_FAILED" (the provider refused or did not answer;
// message = the CheckAiResponse.error code), "AI_BAD_ANSWER" (not the JSON asked for, or a
// board outside the list): no task is created. 429 RATE_LIMITED: 10 at once then 5 per minute
// per person, 60 per hour per workspace. Takes up to ~60 s (two model calls; ~90 s with
// images).
message CreateSmartTaskRequest {
  string text = 1;
  repeated string attachment_ids = 2;
  // NONE = let the board's instruction decide (none without one); otherwise it wins.
  TaskPriority priority = 3;
}

message CreateSmartTaskResponse {
  Task task = 1;
  bool used_instruction = 2;    // the board's ai_instruction shaped the task
  bool attachments_dropped = 3; // the chosen board has attachments off: the files were not attached
  // CBF-75: the model refused to file the task (status 200, task unset): the person edits the
  // text or the files and sends again.
  SmartTaskRefusal refusal = 4;
  // CBF-75: the model does not take images: it saw the files by name (and text files' text).
  bool files_unseen = 5;
}

// CBF-75: why the model did not file a smart task.
message SmartTaskRefusal {
  string reason = 1;        // plain text, ≤ 300 characters: no links, markup or mentions
  string duplicate_key = 2; // the task it duplicates ("DOC-123"), one the caller sees; "" = none
}

// POST /tasks (201), GET /tasks/{id}, PATCH, archive / restore, relations, subscription,
// assignees, GET /api/t/{key}. subtasks / related / parent: GET and the key lookup only.
message TaskResponse {
  Task task = 1;
  repeated Task subtasks = 2; // live subtasks by position
  repeated Task related = 3;  // the other sides of task.relations that the caller can see
  Task parent = 4;
  Board board = 5;            // GET /api/t/{key} only
  Room room = 6;              // the task room (type TASK): GET /tasks/{id} and GET /api/t/{key}
}

// PATCH /api/tasks/{id} → TaskResponse. Unset fields are unchanged. CREATE_TASKS may edit tasks
// it created or is assigned to; EDIT_TASKS any. status_id with after_task_id / before_task_id =
// a kanban move (position between the neighbours; neither = last). board_id moves the task to
// another board (MANAGE_BOARD on both; a new number, activity "moved_board"; statuses by type,
// labels by name, milestone dropped; approvers and votes move along). A status change of a task
// whose approval_state is PENDING / REJECTED is refused when it goes forward (see Task
// approvals): 409 CONFLICT, reason "TASK_APPROVAL_REQUIRED", used = approvals, limit = the
// quorum. A title / description / attachments change resets every vote (ADR-0049 §3).
message UpdateTaskRequest {
  optional string title = 1;
  optional string description = 2;
  optional string status_id = 3;
  optional TaskPriority priority = 4;
  optional uint32 estimate = 5;     // 0 = none
  optional string start_on = 6;     // "" = none
  optional string due_on = 7;       // "" = none
  optional string parent_id = 8;    // "" = none
  optional string milestone_id = 9; // "" = none
  bool set_labels = 10;             // replace label_ids
  repeated string label_ids = 11;
  string after_task_id = 12;
  string before_task_id = 13;
  optional string board_id = 14;
  bool set_attachments = 15;        // replace the description's attachments
  repeated string attachment_ids = 16;
  // A subtask's milestone (ADR-0063): one of its parent's (422 "taskMilestoneId" otherwise);
  // "" = none. MILESTONES off: a new value is 409 FEATURE_DISABLED.
  optional string task_milestone_id = 17;
  // ADR-0108: move the status forward although the approval is not complete (the gate of
  // ADR-0049 §2 would answer 409 TASK_APPROVAL_REQUIRED). Only for MANAGE_BOARD on the task's
  // board and a human (403 APPROVAL_OVERRIDE_DENIED otherwise, BOT_NOT_ALLOWED for a bot and a
  // bot on behalf of its owner); journal "approval_override". Ignored when the gate does not
  // hold the move; never applies to a move to another board (board_id).
  bool override_approval = 18;
}

// PUT /api/tasks/{id}/assignees (the full list, ≤ 10; exactly one is_lead when not empty) →
// TaskResponse. New assignees are subscribed and notified.
message SetAssigneesRequest {
  repeated TaskAssigneeInput assignees = 1;
}

// PUT /api/tasks/{id}/approvers → TaskResponse (ADR-0049): the full list of approvers and the
// quorum, by whoever may edit the task (EDIT_TASKS, or CREATE_TASKS on a task they created or
// are assigned to). ≤ 10 distinct members who see the board, not guests nor bots (422);
// required 0 = all, else 1..number of approvers (422 otherwise). Those who stay keep their
// votes; removed ones lose them; new ones start PENDING, are subscribed and notified
// (APPROVAL_REQUESTED). Journal "approvers".
message SetTaskApproversRequest {
  // Members of the workspace, not guests nor bots (one who does not see the board then sees this
  // task, ADR-0059 / ADR-0076).
  repeated string user_ids = 1;
  uint32 required = 2;
}

enum TaskApprovalDecision {
  TASK_APPROVAL_DECISION_UNSPECIFIED = 0;
  TASK_APPROVAL_DECISION_APPROVE = 1;
  TASK_APPROVAL_DECISION_REJECT = 2;   // a veto: comment required
  TASK_APPROVAL_DECISION_WITHDRAW = 3; // back to PENDING
}

// POST /api/tasks/{id}/approval → TaskResponse (ADR-0049 §3): the caller's own vote; only an
// approver (403 otherwise) who sees the board (404). comment ≤ 500 characters, required for
// REJECT (422). A vote may change any time. Journal "approval"; the quorum reached notifies
// APPROVED, a rejection REJECTED (see TaskNoticeKind).
message TaskApprovalRequest {
  TaskApprovalDecision decision = 1;
  string comment = 2;
  // ADR-0108: an approver of the task the vote is recorded for, by a board manager
  // (MANAGE_BOARD, a human: 403 APPROVAL_ON_BEHALF_DENIED / BOT_NOT_ALLOWED otherwise). APPROVE
  // only over a PENDING vote (409 APPROVER_DECIDED over the approver's own decision); WITHDRAW
  // only of an approval recorded on behalf (409 APPROVER_DECIDED); REJECT is personal (422
  // "decision"). Not an approver: 422 "onBehalfOf". The caller's own id = their own vote.
  // Journal "approval" with on_behalf; the approver gets APPROVED_ON_BEHALF.
  string on_behalf_of = 3;
}

// PUT /api/tasks/{id}/relations → TaskResponse; DELETE /api/tasks/{id}/relations?related_id=
// &kind= removes one. A task of the same workspace the caller sees; not itself.
message SetTaskRelationRequest {
  string related_id = 1;
  TaskRelationKind kind = 2;
}

// PUT /api/tasks/{id}/watchers → TaskResponse (ADR-0076): makes user_id a watcher (and a
// subscriber), by whoever may edit the task (403 otherwise). A member of the workspace, not a
// guest; a bot only one who sees the board (422 "userId"); a human who does not see the board
// then sees this task. ≤ 50 watchers (409). Adding a watcher twice is a no-op. Journal
// "watchers" {"user_ids": [...]} before and after. An @mention by whoever may edit the task
// (description, comment) makes the mentioned humans watchers too.
// DELETE /api/tasks/{id}/watchers?user_id= → TaskResponse removes one: by whoever may edit the
// task, or the watcher themselves («Перестать наблюдать»). The subscription goes too when the
// user no longer sees the task; their access goes unless another basis is left (a role on the
// board, assignee, approver). Neither works on an archived task (409).
message SetTaskWatcherRequest {
  string user_id = 1;
}

// PUT /api/tasks/{id}/subscription (VIEW_BOARD) → TaskResponse. muted false = subscribed with
// notifications, true = «Отписаться» (auto-subscription does not bring it back).
message SetTaskSubscriptionRequest {
  bool muted = 1;
}

// GET /api/tasks/{id}/activity?before=<id>&limit=&only= (≤ 100, default 50): comments and
// journal entries, newest first; before = the id of the oldest item seen (message or activity
// id). only=journal: only journal entries, the "comment*" kinds included (ADR-0091, the
// «История» tab); only=comments: only messages (the «Комментарии» tab); without it both, the
// journal without its "comment" entries (each comment is there as its message).
message TaskActivityPage {
  repeated TaskActivityItem items = 1;
  bool has_more = 2;
}

// GET /api/boards/{id}/activity?since=&until=&actor=&kind=&cursor= (MANAGE_BOARD or
// EDIT_TASKS) — the journal oldest first, ≤ 1000 per page; &format=csv streams all of it as
// CSV (id, created_at, task_key, actor_id, kind, before, after).
message BoardActivityResponse {
  repeated TaskActivity activities = 1;
  string next_cursor = 2;
}

// GET /api/me/tasks?workspace_id=&scope=assigned|lead|created|subscribed&open=1&cursor= — the
// caller's tasks on boards they see, newest update first, ≤ 200 per page.
message MyTasksResponse {
  repeated Task tasks = 1;
  string next_cursor = 2;
}

// GET /api/workspaces/{id}/tasks/search?q=&state=&archived=&board_id=&filter=&sort=&cursor=&limit=
// (ADR-0139) — the tasks of all boards the caller sees (or of board_id), by key (FNG-12, FNG) and
// words of title / description / comments. q 0..200 (empty = filters only); state: open | done |
// all (default); archived: "" = live only (default), "1" = live and archived, "only" = archived
// only; filter: a TaskFilter in JSON; sort: relevance (default with q) | updated (default
// without) | created | key | title | board | status | assignee | priority | due, "-" for
// descending; limit ≤ 50 (default 20); next_cursor empty = the last page.
message SearchTasksResponse {
  repeated Task tasks = 1;
  string next_cursor = 2;
  // The visible task whose key q spells (any archive state, regardless of the filters, state
  // and board_id); unset when q is no key or no such task is visible.
  Task key_task = 3;
  // Of the returned tasks whose title did not match: a fragment of the description or of the
  // newest matching comment, matches between U+0002 and U+0003.
  repeated TaskSearchSnippet snippets = 4;
}

message TaskSearchSnippet {
  string task_id = 1;
  string text = 2;
  bool comment = 3; // from a comment, not the description
}

// ---- saved task searches (ADR-0139) ----

// The conditions of a task search as the client keeps them.
message TaskSearchQuery {
  string q = 1; // ≤ 200 characters
  string state = 2; // "all" | "open" | "done" | "archived"
  TaskFilter filter = 3;
  string sort = 4; // ≤ 32 characters, the search's sort
}

// A named task search of one person in one workspace (left panel of the boards).
message SavedTaskSearch {
  string id = 1;
  string name = 2; // 1..60 characters
  TaskSearchQuery query = 3;
  int32 position = 4;
}

// GET /api/workspaces/{id}/task-searches — the caller's own, by position.
message ListSavedTaskSearchesResponse {
  repeated SavedTaskSearch searches = 1;
}

// POST /api/workspaces/{id}/task-searches → 201 SavedTaskSearchResponse; ≤ 50 per person and
// workspace (409 CONFLICT, reason "TASK_SEARCH_LIMIT"). Guests: 403.
message CreateSavedTaskSearchRequest {
  string name = 1;
  TaskSearchQuery query = 2;
}

// PATCH /api/workspaces/{id}/task-searches/{sid} (its author) → SavedTaskSearchResponse; DELETE → 204.
message UpdateSavedTaskSearchRequest {
  optional string name = 1;
  TaskSearchQuery query = 2; // set = replace
  optional int32 position = 3;
}

message SavedTaskSearchResponse {
  SavedTaskSearch search = 1;
}

// ---- views ----

// GET /api/boards/{id}/views — shared views and the caller's own, by position.
message ListBoardViewsResponse {
  repeated BoardView views = 1;
}

// POST /api/boards/{id}/views (VIEW_BOARD; shared: MANAGE_BOARD) → 201 BoardViewResponse.
// ≤ 30 views per board.
message CreateBoardViewRequest {
  string name = 1;
  BoardViewKind kind = 2;
  TaskFilter filter = 3;
  string group_by = 4;
  string sort = 5;
  bool shared = 6;
  optional int32 position = 7;
}

// PATCH /api/boards/{id}/views/{vid} (author of a personal view; MANAGE_BOARD for a shared one)
// → BoardViewResponse; DELETE → 204.
message UpdateBoardViewRequest {
  optional string name = 1;
  optional BoardViewKind kind = 2;
  TaskFilter filter = 3; // set = replace
  optional string group_by = 4;
  optional string sort = 5;
  optional bool shared = 6;
  optional int32 position = 7;
}

message BoardViewResponse {
  BoardView view = 1;
}

// ---- board categories (ADR-0058 §1) ----

// GET /api/workspaces/{id}/board-categories — every board category of the workspace, by
// position (guests: 403).
message ListBoardCategoriesResponse {
  repeated BoardCategory categories = 1;
}

// POST /api/workspaces/{id}/board-categories (CREATE_BOARDS) → 201 BoardCategoryResponse;
// ≤ 50 per workspace (409 CONFLICT, reason "BOARD_CATEGORY_LIMIT"). position unset = last.
message CreateBoardCategoryRequest {
  string name = 1;
  optional int32 position = 2;
}

// PATCH /api/board-categories/{id} (CREATE_BOARDS) → BoardCategoryResponse. DELETE → 204: its
// boards move to «без категории» at the end (BOARD_UPDATE for each).
message UpdateBoardCategoryRequest {
  optional string name = 1;
  optional int32 position = 2; // new index; others shift
}

message BoardCategoryResponse {
  BoardCategory category = 1;
}

// PUT /api/workspaces/{id}/boards/order — one drag & drop in one transaction: listed boards get
// the given category ("" = none) and position (MANAGE_BOARD on each; a board the caller does not
// see is 422), listed categories the given position (CREATE_BOARDS). Unlisted items are
// unchanged.
message SetBoardOrderRequest {
  message BoardPosition {
    string board_id = 1;
    string category_id = 2;
    int32 position = 3;
  }
  message CategoryPosition {
    string category_id = 1;
    int32 position = 2;
  }
  repeated BoardPosition boards = 1;
  repeated CategoryPosition categories = 2;
}

// The boards the caller sees and every category, after the change.
message SetBoardOrderResponse {
  repeated Board boards = 1;
  repeated BoardCategory categories = 2;
}

// ---- checklists (ADR-0058 §2) ----
// Rights as for the task's fields: EDIT_TASKS on any task, CREATE_TASKS on tasks the caller
// created or is assigned to (bots alike). The board feature CHECKLISTS off: creating and
// editing is 409 FEATURE_DISABLED (deleting is allowed); a plan without checklists
// (PlanLimits.checklists_disabled): every write is 409 PLAN_LIMIT, reading stays.
// Every write answers TaskChecklistResponse and sends TASK_CHECKLIST_UPDATE / _DELETE (not
// TASK_UPDATE) and a "checklist" journal entry.

// POST /api/tasks/{id}/checklists → 201 TaskChecklistResponse; ≤ 10 per task (409 CONFLICT,
// reason "CHECKLIST_LIMIT"). position unset = last.
message CreateTaskChecklistRequest {
  string title = 1;
  optional int32 position = 2;
}

// PATCH /api/checklists/{id} → TaskChecklistResponse. DELETE /api/checklists/{id} →
// TaskChecklistResponse without checklist (the task's new counters).
message UpdateTaskChecklistRequest {
  optional string title = 1;
  optional int32 position = 2; // new index among the task's checklists; others shift
}

// POST /api/checklists/{id}/items → 201 TaskChecklistResponse; ≤ 100 per checklist (409
// CONFLICT, reason "CHECKLIST_ITEM_LIMIT"). position unset = last.
message CreateTaskChecklistItemRequest {
  string text = 1;
  optional double position = 2;
}

// PATCH /api/checklist-items/{id} → TaskChecklistResponse (the item's checklist after the
// change). checklist_id moves the item to another checklist of the same task (422 otherwise).
// DELETE /api/checklist-items/{id} → TaskChecklistResponse.
message UpdateTaskChecklistItemRequest {
  optional string text = 1;
  optional bool done = 2;
  optional double position = 3;
  optional string checklist_id = 4;
}

// The changed checklist and the task's counters (Task.checklist_total / checklist_done).
message TaskChecklistResponse {
  TaskChecklist checklist = 1; // unset after DELETE /api/checklists/{id}
  uint32 checklist_total = 2;
  uint32 checklist_done = 3;
}

// POST /api/checklist-items/{id}/convert → 201 ConvertChecklistItemResponse: a subtask titled
// with the item's text in the default status (no other fields); the item is removed. Needs the
// board feature SUBTASKS (409 FEATURE_DISABLED, field "parentId") and a task that is not a
// subtask itself (422).
message ConvertChecklistItemResponse {
  Task task = 1;                    // the new subtask
  TaskChecklist checklist = 2;      // the item's checklist without it
  uint32 checklist_total = 3;
  uint32 checklist_done = 4;
}

// ---- task milestones (ADR-0063) ----
// Rights as for the task's fields: EDIT_TASKS on any task, CREATE_TASKS on tasks the caller
// created or is assigned to (ADR-0059: an assignee by the card alike; bots alike); reading with
// the task. The board feature MILESTONES off: creating and editing is 409 FEATURE_DISABLED,
// field "milestones" (deleting is allowed). An archived task is 409. Every write answers
// TaskMilestoneResponse, journals a "milestones" entry on the task (after {"action": "created"
// | "renamed" | "dated" | "completed" | "reopened" | "moved" | "deleted", "milestone_id",
// "name", "due_on"}; before: the old name / date) and sends TASK_UPDATE of the task.
// A subtask's link is journaled on the subtask: "milestones" with action "linked" / "unlinked"
// and the parent's TASK_UPDATE (its progress); the server's completion of a milestone (all
// linked subtasks done, or not any more) journals "auto_completed" / "auto_reopened" on the
// parent, actor = the author of the change that caused it.

// POST /api/tasks/{id}/milestones → 201 TaskMilestoneResponse; ≤ 20 per task (409 CONFLICT,
// reason "TASK_MILESTONE_LIMIT"); a subtask has no milestones (422). position unset = last.
message CreateTaskMilestoneRequest {
  string name = 1;   // 1..60 characters
  string due_on = 2; // "YYYY-MM-DD"; empty = no date
  optional double position = 3;
}

// PATCH /api/task-milestones/{id} → TaskMilestoneResponse. completed is a person's toggle: 409
// CONFLICT, reason "TASK_MILESTONE_AUTO" while subtasks are linked (the server keeps it).
// DELETE /api/task-milestones/{id} → TaskMilestoneResponse without milestone; the linked
// subtasks lose their link.
message UpdateTaskMilestoneRequest {
  optional string name = 1;
  optional string due_on = 2; // "" = no date
  optional double position = 3;
  optional bool completed = 4;
}

// The changed milestone and the task after the change (with every milestone).
message TaskMilestoneResponse {
  TaskMilestone milestone = 1; // unset after DELETE
  Task task = 2;
}

// ---- board webhook (ADR-0058 §4) ----
// MANAGE_BOARD on the board and MANAGE_INTEGRATIONS of the workspace; bots by the same bits (ADR-0109).
// Business plan only (PlanLimits.board_webhooks_disabled: PUT / ping are 409 PLAN_LIMIT).

// Why deliveries are paused while the webhook stays configured.
enum BoardWebhookPauseReason {
  BOARD_WEBHOOK_PAUSE_REASON_UNSPECIFIED = 0; // not paused
  // The workspace's plan no longer includes board webhooks: new events are not queued; after
  // an upgrade delivery resumes with new events.
  BOARD_WEBHOOK_PAUSE_REASON_PLAN = 1;
}

// The webhook of a board (one per board). The secret itself is never returned after PUT.
message BoardWebhook {
  string board_id = 1;
  string url = 2;          // https only, ≤ 2048 characters, a public address
  bool has_secret = 3;
  bool enabled = 4;        // false = disabled after a day of failures (PUT enables it again)
  google.protobuf.Timestamp disabled_at = 5;
  google.protobuf.Timestamp failing_since = 6; // unset = the last attempt succeeded
  google.protobuf.Timestamp last_ok_at = 7;
  string last_error = 8;
  uint32 pending = 9;      // deliveries waiting in the queue
  string created_by = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  BoardWebhookPauseReason paused_reason = 13;
}

// PUT /api/boards/{id}/webhook → BoardWebhookResponse (creates, replaces or re-enables).
// secret: 16..256 characters, or empty — the server generates 32 random bytes (base64url).
message SetBoardWebhookRequest {
  string url = 1;
  string secret = 2;
}

// GET / PUT /api/boards/{id}/webhook (GET without a webhook: webhook unset); DELETE → 204, the
// queue is marked failed.
message BoardWebhookResponse {
  BoardWebhook webhook = 1;
  string secret = 2; // PUT only, once: the signing secret in effect
}

// POST /api/boards/{id}/webhook/ping: a synchronous delivery of a "ping" event over the same
// transport, ≤ 1 per 10 s per board (429).
message BoardWebhookPingResponse {
  bool ok = 1;
  uint32 status = 2; // the receiver's HTTP status; 0 = no answer
  string error = 3;
}

// The JSON body of a board webhook delivery (protojson with default values emitted), version 1.
// POST to BoardWebhook.url with the headers X-Calab-Webhook-Version: 1, X-Calab-Timestamp:
// <unix seconds>, X-Calab-Signature: v1=<hex HMAC-SHA256(secret, timestamp + "." + body)>,
// X-Calab-Delivery: <id>, X-Calab-Event: <type>, User-Agent: Calab-Webhook/1.0. Receivers reject
// a timestamp more than 5 minutes away, dedupe by id (at-least-once) and order by sequence
// (monotonic per board). The contract changes only by adding fields.
// Changes made by an automation rule (ADR-0060) come as their own event with actor null and
// rule set; Git events (changes field "git") with actor null.
// type: "task.created" | "task.updated" | "task.archived" | "task.restored" | "task.moved_out" |
// "task.moved_in" | "task.comment.created" | "task.comment.updated" | "task.comment.deleted" |
// "ping".
message BoardWebhookEvent {
  // A board as the webhook shows it.
  message BoardRef {
    string id = 1;
    string key = 2;
    string name = 3;
  }
  // Who made the change; unset (null) for the server's own changes (auto-archive, Git events)
  // and for changes made by an automation rule (then `rule` is set).
  message Actor {
    string id = 1;
    string name = 2;
    bool is_bot = 3;
  }
  // One task_activity entry of the change (field = its kind; before / after = its data).
  message Change {
    string field = 1;
    google.protobuf.Struct before = 2;
    google.protobuf.Struct after = 3;
  }
  message CommentAttachment {
    string name = 1;
    uint64 size = 2;
    string mime = 3;
  }
  // task.comment.*: the comment (a message of the task room).
  message Comment {
    string id = 1;
    string author_id = 2;
    string text = 3;
    repeated CommentAttachment attachments = 4;
    google.protobuf.Timestamp created_at = 5;
    google.protobuf.Timestamp edited_at = 6;
  }
  // The automation rule that made the change (ADR-0060); unset (null) otherwise.
  message Rule {
    string id = 1;
    string name = 2;
  }
  string id = 1;        // the delivery id: the idempotency key
  uint32 version = 2;   // 1
  string type = 3;
  uint32 sequence = 4;  // per board, from 1
  google.protobuf.Timestamp occurred_at = 5;
  string workspace_id = 6;
  BoardRef board = 7;
  Actor actor = 8;
  // The task without the recipient-specific fields (subscribed, muted, unread, viewer_state),
  // attachments and checklists (the counters stay). Unset for "ping".
  Task task = 9;
  string task_url = 10; // the task's link (PUBLIC_APP_URL/t/FNG-12)
  repeated Change changes = 11;
  Comment comment = 12;
  Rule rule = 13;
}

// ---- gateway events (docs/05; to the board's viewers, like room events) ----

message BoardCreate {
  Board board = 1;
}

// The board, its statuses / labels / milestones / shared views, access or archive changed; the
// client recomputes its permissions from Board.permissions. A board the recipient no longer
// sees arrives as BOARD_DELETE, a newly visible one as BOARD_CREATE.
message BoardUpdate {
  Board board = 1;
}

message BoardDelete {
  string workspace_id = 1;
  string board_id = 2;
  bool purged = 3; // false = archived (restorable by MANAGE_BOARD)
}

message TaskCreate {
  Task task = 1;
}

// TASK_UPDATE: the full task without the feed (position and assignees included). On the
// workspace channel to the board's viewers; on a user channel with the recipient's
// viewer_state, and `notice` when the change notifies them (their task level, ADR-0042 §4).
message TaskUpdate {
  Task task = 1;
  TaskNotice notice = 2;
}

// TASK_NOTICE (ADR-0090): a task notice of user_id relayed to a bot the user chose
// (UserSettings.task_notify_bots), on the bot's user channel and webhook. Sent whenever the
// user gets a TASK_UPDATE with a notice, while the bot is a member of the task's workspace,
// regardless of the bot's own VIEW_BOARD (the user entrusted their notices to it). task is the
// task as the user sees it, without the viewer's state (subscribed, muted, unread and
// viewer_state are false); task_url opens it in the app.
message TaskNoticeRelay {
  string workspace_id = 1;
  string user_id = 2;
  Task task = 3;
  TaskNotice notice = 4;
  string task_url = 5;
  string board_key = 6;
  string board_name = 7;
}

// Why a task notifies its recipient: the client shows a system notification.
message TaskNotice {
  TaskNoticeKind kind = 1;
  string actor_id = 2;
  string message_id = 3; // COMMENT / MENTIONED in a comment
  string activity_id = 4;
  string text = 5;    // RULE: the rule's rendered message (≤ 2000 characters)
  string rule_id = 6; // RULE: the rule that sent it
  // APPROVAL_REQUESTED (ADR-0082): the task changed and the recipient's decided vote was reset
  // - «Задача изменена - нужно согласовать повторно». Older clients show the plain request.
  bool re_requested = 7;
  // DUE_SOON / OVERDUE: the due date the notice is about; DUE_CHANGED: the new due date ("" =
  // removed). "YYYY-MM-DD" (ADR-0089).
  string due_on = 8;
  // DUE_SOON: 1 = due tomorrow, 0 = due today; OVERDUE: the days past due, negative (-1).
  int32 days_left = 9;
  // The notice's id in the recipient's notice history (ADR-0141, GET /api/me/task-notices):
  // uuidv7, time-ordered. Empty from an older server.
  string id = 10;
}

// One entry of GET /api/me/task-notices (ADR-0141): a task notice the caller got, with the
// task as it is named now. Only tasks the caller still sees are listed.
message TaskNoticeEntry {
  string id = 1;
  string workspace_id = 2;
  string board_id = 3;
  string task_id = 4;
  string task_key = 5;
  string task_title = 6;
  TaskNotice notice = 7;
  google.protobuf.Timestamp created_at = 8;
}

// GET /api/me/task-notices?before=<id>&limit= — newest first. A page scans limit rows of the
// history and lists those of tasks the caller sees now, so it may hold fewer entries (even none)
// while has_more: the next page is before=next_before, not the last entry's id.
message ListTaskNoticesResponse {
  repeated TaskNoticeEntry entries = 1;
  bool has_more = 2;
  // With has_more: the cursor of the next page (the last history row this page scanned).
  string next_before = 3;
}

// The «Упоминания» inbox items the caller dismissed (CBF-155, ADR-0163). Body of
// POST /api/me/inbox/dismiss → 204 (up to 100 ids of each kind; unknown or foreign ids are
// ignored) and the INBOX_DISMISS event to the caller's own sessions. A dismissed chat mention
// stays out of GET /api/me/mentions for good (an edit that mentions again does not bring it
// back); a dismissed task notice leaves the caller's notice history.
message InboxDismiss {
  repeated string message_ids = 1; // chat mentions: the message ids
  repeated string notice_ids = 2;  // task notices: TaskNoticeEntry.id
}

enum TaskNoticeKind {
  TASK_NOTICE_KIND_UNSPECIFIED = 0;
  TASK_NOTICE_KIND_ASSIGNED = 1;  // added to the assignees or made the lead
  TASK_NOTICE_KIND_MENTIONED = 2; // @<user_id> in the description or a comment
  TASK_NOTICE_KIND_COMMENT = 3;   // a comment in a task the recipient is subscribed to
  TASK_NOTICE_KIND_STATUS = 4;    // the status of a task the recipient is subscribed to changed
  // Approvals (ADR-0049 §5). Mandatory notices bypass the task level, a muted workspace and
  // «Отписаться» (like a direct mention; only «Не беспокоить» silences them on the client).
  // APPROVAL_REQUESTED (mandatory): the recipient became an approver, their decided vote was
  // reset (the task changed; TaskNotice.re_requested), or a daily reminder of a vote pending for
  // 24 h (≤ 3; actor_id empty). The first two wait the board's approval_notify_delay_seconds
  // (ADR-0082).
  TASK_NOTICE_KIND_APPROVAL_REQUESTED = 5;
  // APPROVED: the quorum was reached; REJECTED: an approver rejected (the comment is in
  // Task.approvers). Mandatory for the task's creator and lead assignee; other assignees and
  // subscribers by their task level (like STATUS).
  TASK_NOTICE_KIND_APPROVED = 6;
  TASK_NOTICE_KIND_REJECTED = 7;
  // RULE (ADR-0060): the «notify» action of an automation rule addressed the recipient (an
  // assignee, the lead, the creator or an approver); by their task level like ASSIGNED.
  TASK_NOTICE_KIND_RULE = 8;
  // ADR-0089. Addressed to the recipient (with task level ALL and MENTIONS, no subscription
  // needed) unless switched off in UserSettings.task_notify_off:
  // UNASSIGNED: removed from the assignees or from the lead by someone else (or a rule).
  TASK_NOTICE_KIND_UNASSIGNED = 9;
  // WATCHER_ADDED: made a watcher by someone else (an @mention gives MENTIONED instead).
  TASK_NOTICE_KIND_WATCHER_ADDED = 10;
  // DUE_SOON: due tomorrow (days_left 1) or today (0), at 09:00 of TASKS_DUE_TZ, to the
  // assignees and the lead; actor_id empty.
  TASK_NOTICE_KIND_DUE_SOON = 11;
  // OVERDUE: the day after the due date, once, to the assignees, the lead and the creator;
  // actor_id empty.
  TASK_NOTICE_KIND_OVERDUE = 12;
  // ADR-0089. To subscribers who did not mute the task, with task level ALL only:
  // DUE_CHANGED: the due date was set, moved or removed (due_on: the new one).
  TASK_NOTICE_KIND_DUE_CHANGED = 13;
  // PRIORITY: the priority changed (the new one is in the task).
  TASK_NOTICE_KIND_PRIORITY = 14;
  // MILESTONE: the milestone changed; text: the new milestone's name ("" = removed).
  TASK_NOTICE_KIND_MILESTONE = 15;
  // MOVED: the task was moved to another board; text: the new board's name.
  TASK_NOTICE_KIND_MOVED = 16;
  // EDITED: the title or the description changed; text: "title" or "description". Once per
  // coalesced journal entry (ADR-0081): not when the entry is replaced.
  TASK_NOTICE_KIND_EDITED = 17;
  // ATTACHMENT: a file was attached; text: its name.
  TASK_NOTICE_KIND_ATTACHMENT = 18;
  // ARCHIVED: the task was archived.
  TASK_NOTICE_KIND_ARCHIVED = 19;
  // ADR-0108 (mandatory, like the approval notices): a board manager recorded an approval on
  // the recipient's behalf (actor_id: the manager).
  TASK_NOTICE_KIND_APPROVED_ON_BEHALF = 20;
}

// The task was archived (purged false) or deleted with its board.
message TaskDelete {
  string workspace_id = 1;
  string board_id = 2;
  string task_id = 3;
  bool purged = 4;
}

// One new journal entry (TASK_ACTIVITY). A repeated change of the same field by the same user
// within a few minutes is merged into one entry (ADR-0081): the merged entry gets a new id and
// replaced_id names the entry it supersedes, which the client drops; activity empty with
// replaced_id set = the entry is gone (the field came back to its value, net no-op).
message TaskActivityAppend {
  string workspace_id = 1;
  TaskActivity activity = 2;
  string replaced_id = 3;
  // The task and board of the entry, also when activity is empty: the gateway routes the event
  // by them (who sees the task).
  string task_id = 4;
  string board_id = 5;
}

// Board categories (ADR-0058 §1): to every member of the workspace except guests.
message BoardCategoryCreate {
  BoardCategory category = 1;
}

message BoardCategoryUpdate {
  BoardCategory category = 1;
}

// Its boards move to «без категории» (BOARD_UPDATE follows for each).
message BoardCategoryDelete {
  string workspace_id = 1;
  string category_id = 2;
}

// TASK_CHECKLIST_UPDATE (ADR-0058 §2): a checklist was created or changed (items too); to the
// board's viewers. TASK_UPDATE is not sent for checklist changes: patch the task's counters.
message TaskChecklistUpdate {
  string workspace_id = 1;
  string board_id = 2;
  string task_id = 3;
  TaskChecklist checklist = 4; // the whole checklist (≤ 100 items)
  uint32 checklist_total = 5;
  uint32 checklist_done = 6;
}

// TASK_CHECKLIST_DELETE: a checklist was deleted; the task's new counters.
message TaskChecklistDelete {
  string workspace_id = 1;
  string board_id = 2;
  string task_id = 3;
  string checklist_id = 4;
  uint32 checklist_total = 5;
  uint32 checklist_done = 6;
}

// ---- Git links of tasks (ADR-0060 §4; routes in automations.proto) ----

// A Git hosting whose webhooks a board accepts.
enum GitProvider {
  GIT_PROVIDER_UNSPECIFIED = 0;
  GIT_PROVIDER_GITHUB = 1;
  GIT_PROVIDER_GITLAB = 2;
  GIT_PROVIDER_GITEA = 3; // Gitea and Forgejo
}

enum TaskGitLinkKind {
  TASK_GIT_LINK_KIND_UNSPECIFIED = 0;
  TASK_GIT_LINK_KIND_BRANCH = 1; // ref = the branch name
  TASK_GIT_LINK_KIND_PR = 2;     // a pull / merge request; ref = its number
  TASK_GIT_LINK_KIND_COMMIT = 3; // ref = the full SHA
}

// The state of a pull / merge request; UNSPECIFIED for branches and commits.
enum TaskGitLinkState {
  TASK_GIT_LINK_STATE_UNSPECIFIED = 0;
  TASK_GIT_LINK_STATE_OPEN = 1;
  TASK_GIT_LINK_STATE_MERGED = 2;
  TASK_GIT_LINK_STATE_CLOSED = 3;
}

// The release of an environment a task entered (board task #101; see BoardRelease).
message TaskRelease {
  string release_id = 1;
  string name = 2;        // "4929cf3", "1287"
  string environment = 3; // "prod", "stage"
  string url = 4;         // the pipeline, "" = none
  google.protobuf.Timestamp created_at = 5; // when the task entered it
}

// A branch, pull / merge request or commit whose name, title, body or message mentions the task
// key (FNG-12). Unique per (task, kind, provider, repo, ref); ≤ 50 per task (old commits go
// first). Links are written only by the board's Git webhook.
message TaskGitLink {
  string id = 1;
  string task_id = 2;
  TaskGitLinkKind kind = 3;
  GitProvider provider = 4;
  string repo = 5;  // owner/name (GitLab: the project path)
  string ref = 6;
  string title = 7; // ≤ 200 characters: the PR title, the first line of a commit, the branch
  string url = 8;   // ≤ 2048 characters, opened in the browser
  TaskGitLinkState state = 9;
  string author = 10; // the provider's login, ≤ 100 characters
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

// TASK_GIT_LINKS_UPDATE (ADR-0060): the Git links of a task changed; to the board's viewers and
// to the task's invitees (ADR-0059). links = every link of the task (≤ 50), count = their
// number (Task.git_links_count). TASK_UPDATE follows with the new counter.
message TaskGitLinksUpdate {
  string workspace_id = 1;
  string board_id = 2;
  string task_id = 3;
  repeated TaskGitLink links = 4;
  uint32 count = 5;
}
