syntax = "proto3";
package calaba.v1;

import "google/protobuf/timestamp.proto";
import "calaba/v1/automations.proto";
import "calaba/v1/boards.proto";
import "calaba/v1/bot.proto";
import "calaba/v1/call.proto";
import "calaba/v1/event.proto";
import "calaba/v1/invite.proto";
import "calaba/v1/identity.proto";
import "calaba/v1/media.proto";
import "calaba/v1/message.proto";
import "calaba/v1/permissions.proto";
import "calaba/v1/recording.proto";
import "calaba/v1/sip.proto";
import "calaba/v1/room.proto";
import "calaba/v1/sound.proto";
import "calaba/v1/sticker.proto";
import "calaba/v1/user.proto";
import "calaba/v1/workspace.proto";

// Gateway opcodes (docs/05-realtime-protocol.md). DISPATCH is 8 (not 0 as in Discord):
// proto3 requires the zero value to be UNSPECIFIED.
enum GatewayOpcode {
  GATEWAY_OPCODE_UNSPECIFIED = 0;
  GATEWAY_OPCODE_HEARTBEAT = 1;       // c→s
  GATEWAY_OPCODE_IDENTIFY = 2;        // c→s
  GATEWAY_OPCODE_RESUME = 3;          // c→s
  GATEWAY_OPCODE_PRESENCE_UPDATE = 4; // c→s
  GATEWAY_OPCODE_TYPING = 5;          // c→s
  GATEWAY_OPCODE_SUBSCRIBE = 6;       // c→s
  GATEWAY_OPCODE_RECONNECT = 7;       // s→c
  GATEWAY_OPCODE_DISPATCH = 8;        // s→c
  GATEWAY_OPCODE_INVALID_SESSION = 9; // s→c
  GATEWAY_OPCODE_HELLO = 10;          // s→c
  GATEWAY_OPCODE_HEARTBEAT_ACK = 11;  // s→c
}

// WebSocket close codes used by the gateway (sent as the close status, not in frames).
enum GatewayCloseCode {
  GATEWAY_CLOSE_CODE_UNSPECIFIED = 0;
  GATEWAY_CLOSE_CODE_UNKNOWN_ERROR = 4000;         // reconnect + RESUME
  GATEWAY_CLOSE_CODE_UNKNOWN_OPCODE = 4001;        // reconnect + RESUME
  GATEWAY_CLOSE_CODE_DECODE_ERROR = 4002;          // reconnect + RESUME
  GATEWAY_CLOSE_CODE_NOT_AUTHENTICATED = 4003;     // new IDENTIFY
  GATEWAY_CLOSE_CODE_AUTHENTICATION_FAILED = 4004; // refresh token, else login screen
  GATEWAY_CLOSE_CODE_INVALID_SEQ = 4007;           // new IDENTIFY
  GATEWAY_CLOSE_CODE_RATE_LIMITED = 4008;          // backoff + RESUME; before READY = too many sessions
  GATEWAY_CLOSE_CODE_SESSION_TIMED_OUT = 4009;     // new IDENTIFY
  // Do not reconnect; login screen. The close reason is "session revoked" or "session revoked:
  // <REASON>" with the ApiError.reason of ERROR_CODE_SESSION_REVOKED (REUSE, LOGOUT_ALL, ...).
  GATEWAY_CLOSE_CODE_SESSION_REVOKED = 4010;
  // This tab's gateway session was evicted: its auth session reached the cap of concurrent
  // tabs (Identify.tab_id) and this one was claimed longest ago (#40). Do not reconnect while
  // the tab is hidden; reconnect (new IDENTIFY) when it is shown again, else with backoff.
  GATEWAY_CLOSE_CODE_SESSION_EVICTED = 4011;
}

enum PresenceStatus {
  PRESENCE_STATUS_UNSPECIFIED = 0;
  PRESENCE_STATUS_ONLINE = 1;
  PRESENCE_STATUS_IDLE = 2;
  PRESENCE_STATUS_DND = 3;
  PRESENCE_STATUS_INVISIBLE = 4; // client → server only; others see OFFLINE
  PRESENCE_STATUS_OFFLINE = 5;   // server → client only
}

// One gateway frame. `op` must match the payload case; `seq` is set on DISPATCH only
// (monotonic per gateway session; clients ignore seq <= last seen).
message GatewayFrame {
  GatewayOpcode op = 1;
  uint64 seq = 2;
  oneof payload {
    // c→s
    Heartbeat heartbeat = 10;
    Identify identify = 11;
    Resume resume = 12;
    SetPresence set_presence = 13;
    Typing typing = 14;
    Subscribe subscribe = 15;
    // s→c
    Hello hello = 20;
    HeartbeatAck heartbeat_ack = 21;
    Reconnect reconnect = 22;
    InvalidSession invalid_session = 23;
    DispatchEvent dispatch = 24;
  }
}

// ---- client → server ----

message Heartbeat {
  uint64 last_seq = 1;
}

message DeviceInfo {
  string name = 1;     // e.g. hostname
  string platform = 2; // darwin | win32 | linux | web
  string app_version = 3;
}

message Identify {
  string token = 1; // access JWT
  DeviceInfo device = 2;
  uint64 capabilities = 3; // reserved bit flags for future protocol features
  // A browser tab of the auth session (#40): tabs of one browser share the auth session, each
  // keeps its own gateway session under its own tab_id (at most 64 of [A-Za-z0-9_-], random
  // per tab, kept across reloads). A new IDENTIFY replaces only the gateway session of the same
  // tab_id (close 4000 "replaced by a new session"); the auth session holds at most 8 tabs and
  // the one claimed longest ago is evicted (close 4011). Empty (desktop, bots) = one gateway
  // session per auth session, as before. An invalid value is treated as empty.
  string tab_id = 4;
}

message Resume {
  string token = 1; // fresh access JWT
  string session_id = 2; // gateway session id from READY
  uint64 seq = 3; // last seq the client processed
}

message SetPresence {
  PresenceStatus status = 1; // ONLINE | IDLE | DND | INVISIBLE
  // Present = a manual choice from the status menu, stored per user (all devices) and
  // announced to the user (Ready.presence, USER_UPDATE.presence): `status` until this time, then the
  // server returns the user to ONLINE. The zero timestamp (seconds = 0) = no end; ONLINE (or a
  // time already past) clears the manual status. At most 30 days ahead. Absent = this
  // session's automatic status (AFK IDLE / back to ONLINE); a manual status wins over it.
  google.protobuf.Timestamp until = 2;
}

message Typing {
  string room_id = 1;
}

message Subscribe {
  repeated string room_ids = 1; // replaces the previous subscription set
}

// ---- server → client ----

message Hello {
  uint32 heartbeat_interval_ms = 1;
}

message HeartbeatAck {}

message Reconnect {}

message InvalidSession {
  bool resumable = 1;
}

// DISPATCH payload: exactly one event.
message DispatchEvent {
  oneof event {
    Ready ready = 1;
    WorkspaceCreate workspace_create = 2;
    WorkspaceUpdate workspace_update = 3;
    WorkspaceDelete workspace_delete = 4;
    WorkspaceMemberAdd workspace_member_add = 5;
    WorkspaceMemberUpdate workspace_member_update = 6;
    WorkspaceMemberRemove workspace_member_remove = 7;
    RoomCreate room_create = 8;
    RoomUpdate room_update = 9;
    RoomDelete room_delete = 10;
    RoomPermissionsUpdate room_permissions_update = 11;
    MessageCreate message_create = 12;
    MessageUpdate message_update = 13;
    MessageDelete message_delete = 14;
    TypingStart typing_start = 15;
    PresenceUpdate presence_update = 16;
    VoiceStateUpdate voice_state_update = 17;
    VoiceStreamStart voice_stream_start = 18;
    VoiceStreamStop voice_stream_stop = 19;
    ReadStateUpdate read_state_update = 20;
    UserUpdate user_update = 21;
    Resumed resumed = 22;
    CategoryCreate category_create = 23;
    CategoryUpdate category_update = 24;
    CategoryDelete category_delete = 25;
    MessageReactionAdd message_reaction_add = 26;
    MessageReactionRemove message_reaction_remove = 27;
    VoiceMoved voice_moved = 28;
    RoomNotificationUpdate room_notification_update = 29;
    VoiceCameraStop voice_camera_stop = 30;
    DmCreate dm_create = 31;
    WorkspaceNotificationUpdate workspace_notification_update = 32;
    // A room's recording started or stopped (ADR-0025); to everyone who sees the room.
    RoomRecording room_recording = 33;
    // A member was banned / unbanned (backlog item 32); to the owner and admins only.
    WorkspaceBanAdd workspace_ban_add = 34;
    WorkspaceBanRemove workspace_ban_remove = 35;
    // Workspace roles (ADR-0026); to every member of the workspace.
    RoleCreate role_create = 36;
    RoleUpdate role_update = 37;
    RoleDelete role_delete = 38;
    // The caller's own state of a DM changed (item 51); to the user's own devices only.
    DmStateUpdate dm_state_update = 39;
    // Sticker packs of the workspace (ADR-0030); to every member of the workspace.
    StickerPackCreate sticker_pack_create = 40;
    StickerPackUpdate sticker_pack_update = 41;
    StickerPackDelete sticker_pack_delete = 42;
    // Member badges of the workspace (docs/09 #82); to every member of the workspace.
    BadgeCreate badge_create = 43;
    BadgeUpdate badge_update = 44;
    BadgeDelete badge_delete = 45;
    // One-to-one calls (ADR-0034); to the participants' user channels only.
    CallRing call_ring = 46;         // to the callee's devices: a call is ringing
    CallStateUpdate call_state = 47; // to both sides: the call was placed or changed state
    // Others read further (docs/09 #92): in a DM to the peer at once; in a workspace room to
    // the members who can view it, at most one per room per 3 s. Never to bots.
    PeerRead read_receipt = 48;
    // Camera backgrounds of the workspace (ADR-0035); to every member of the workspace.
    BackgroundCreate background_create = 49;
    BackgroundUpdate background_update = 50;
    BackgroundDelete background_delete = 51;
    // This device was taken out of voice by the server (docs/05 "Несколько устройств"); to the
    // user's channel, acted upon only by the device whose auth session is session_id.
    VoiceDisconnected voice_disconnected = 52;
    // Soundboard (ADR-0036): the library to every member of the workspace; SOUND_PLAY to the
    // users in the voice call of the room only (their user channels).
    SoundCreate sound_create = 53;
    SoundUpdate sound_update = 54;
    SoundDelete sound_delete = 55;
    SoundPlay sound_play = 56;
    // Bots (ADR-0031); to MANAGE_BOTS members (ADR-0048) and the bot's owner.
    BotCreate bot_create = 60;
    BotUpdate bot_update = 61;
    BotDelete bot_delete = 62;
    // Workspace calendar (ADR-0038): EVENT_CREATE / UPDATE / DELETE / RSVP to everyone who may
    // see the event (not guests); EVENT_REMINDER to one attendee's user channel;
    // ROOM_EVENT_ACTIVE / ENDED to the room's viewers (not guests).
    CalendarEventCreate event_create = 63;
    CalendarEventUpdate event_update = 64;
    CalendarEventDelete event_delete = 65;
    CalendarEventRsvp event_rsvp = 66;
    CalendarEventReminder event_reminder = 67;
    RoomEventActive room_event_active = 68;
    RoomEventEnded room_event_ended = 69;
    // Guest admission (ADR-0040): REQUEST to the room's deciders (MANAGE_ROOM there, or the
    // author of the link); DECIDED to the deciders and, on its user channel, to the guest.
    RoomAdmissionRequest room_admission_request = 70;
    RoomAdmissionDecided room_admission_decided = 71;
    // Notes shelves (ADR-0039); to the owner's user channel only (all their devices).
    NotesCreate notes_create = 72;
    NotesUpdate notes_update = 73;
    NotesDelete notes_delete = 74;
    // Task boards (ADR-0042): to the board's viewers (BOARD_* per recipient with their
    // Board.permissions); TASK_UPDATE also on a user channel with the recipient's viewer_state.
    // Comments are MESSAGE_* / MESSAGE_REACTION_* of the task rooms, to the board's viewers.
    BoardCreate board_create = 75;
    BoardUpdate board_update = 76;
    BoardDelete board_delete = 77;
    TaskCreate task_create = 78;
    TaskUpdate task_update = 79;
    TaskDelete task_delete = 80;
    TaskActivityAppend task_activity = 81;
    BotCallback bot_callback = 82; // private to the author bot (ADR-0047)
    // Telephony (ADR-0046): a phone call of a room was placed or changed status; to everyone
    // who can view the room.
    SipCallUpdate sip_call_update = 83;
    // Web apps of the workspace (ADR-0050): to every member except guests and bots.
    WorkspaceAppUpsert workspace_app_upsert = 84;
    WorkspaceAppDelete workspace_app_delete = 85;
    // Session-specific identity status; never broadcast connection configuration.
    WorkspaceIdentityAccessUpdate workspace_identity_access_update = 86;
    // Board categories (ADR-0058 §1): to every member except guests.
    BoardCategoryCreate board_category_create = 87;
    BoardCategoryUpdate board_category_update = 88;
    BoardCategoryDelete board_category_delete = 89;
    // Task checklists (ADR-0058 §2): to the board's viewers; no TASK_UPDATE for them.
    TaskChecklistUpdate task_checklist_update = 90;
    TaskChecklistDelete task_checklist_delete = 91;
    // Board automations (ADR-0060): rules to the board's viewers (VIEW_BOARD); Git links to the
    // board's viewers and the task's invitees (ADR-0059).
    BoardRuleUpdate board_rule_update = 92;
    BoardRuleDelete board_rule_delete = 93;
    TaskGitLinksUpdate task_git_links_update = 94;
  }
}

// Body of a bot webhook delivery (ADR-0031), JSON (protojson): POST to the bot's webhook URL
// with X-Calab-Signature: sha256=<hex HMAC-SHA256(secret, body)> and X-Calab-Delivery: <id>.
// Delivered events: MESSAGE_CREATE / UPDATE / DELETE and MESSAGE_REACTION_ADD / REMOVE of
// rooms the bot can view and of its DMs, plus private BOT_CALLBACK (ADR-0047).
// A delivery may repeat (retries): dedupe by id.
message BotWebhookUpdate {
  string id = 1;
  string bot_user_id = 2;
  google.protobuf.Timestamp created_at = 3;
  DispatchEvent event = 4;
}

// Aggregated per user (docs/05, "multiple devices").
message VoiceState {
  string workspace_id = 1;
  string user_id = 2;
  string room_id = 3; // empty = not in voice
  bool muted = 4;     // all sessions in the room muted
  bool deafened = 5;
  bool streaming = 6; // any session in the room streaming
  google.protobuf.Timestamp joined_at = 7; // earliest join of the user's devices in this room
  // Muted by a moderator (POST …/voice/{userId}/mute) until a moderator unmutes: the
  // microphone is muted server-side on all devices and cannot be unmuted by the user.
  bool server_muted = 8;
  bool camera = 9; // any of the user's devices in the room publishes a webcam
  // Recorded by POST /api/rooms/{id}/join (or an app-level move) but not connected to LiveKit
  // yet: every device of the user in the room is still connecting. participant_joined clears
  // it; without a connection within 15 s the state is removed (VOICE_STATE_UPDATE, empty room).
  bool pending = 10;
  // Musician mode (ADR-0052): a device of the user in this room sends its microphone without
  // echo cancellation, noise suppression and gain control, in a music Opus profile. Shown so
  // others know why they hear raw sound. Set through PATCH /api/voice/self.
  bool musician = 11;
}

message Presence {
  string user_id = 1;
  PresenceStatus status = 2;
  google.protobuf.Timestamp last_seen = 3; // unset when hidden (invisible/offline)
  // Custom status (see PATCH /api/me/status); filled in PRESENCE_UPDATE events.
  string status_text = 4;
  string status_emoji = 5;
  google.protobuf.Timestamp status_expires_at = 6;
  // When a manual IDLE / DND ends (SetPresence.until); unset = no end, or not shown
  // (invisible users are OFFLINE to others, with no until).
  google.protobuf.Timestamp until = 7;
  // In a one-to-one call now (ADR-0034, call ACTIVE); with whom is not disclosed. Changes
  // come as PRESENCE_UPDATE to all the user's workspaces.
  bool on_call = 8;
  // The client of the user's most recently connected live session (docs/09 #143), from its
  // Identify.device: app version («1.1.0») and platform (web | darwin | win32 | linux). When
  // offline, the last known ones (the session last active). Empty when unknown, and hidden
  // like last_seen (invisible).
  string client_version = 9;
  string client_platform = 10;
}

message ReadState {
  string room_id = 1;
  string last_read_message_id = 2;
  // Filled in READY only (0 in READ_STATE_UPDATE): messages of others after
  // last_read_message_id, capped at 999, and how many of them mention the user
  // (@<user_id>, @everyone, @here).
  uint32 unread_count = 3;
  uint32 mention_count = 4;
}

// Full state of one workspace, as seen by the recipient (only rooms with VIEW_ROOM).
message WorkspaceSnapshot {
  Workspace workspace = 1;
  WorkspaceRole role = 2;
  repeated Room rooms = 3;
  repeated WorkspaceMember members = 4;
  repeated VoiceState voice_states = 5;
  repeated Presence presences = 6;
  // Recipient's effective permission bits per visible room (room_id -> bits).
  // After READY, clients recompute from Room.permission_overrides (computeRoomPermissions).
  map<string, uint64> permissions = 7;
  repeated RoomCategory categories = 8;
  // Rooms being recorded now (state ACTIVE; ADR-0025), among the visible rooms.
  repeated RoomRecording recordings = 9;
  // All roles of the workspace (ADR-0026), highest position first; members[].role_ids
  // refer to them.
  repeated Role roles = 10;
  // The workspace's badge library (docs/09 #82); members[].badge_id refer to them.
  repeated Badge badges = 11;
  // The workspace's camera backgrounds (ADR-0035), in creation order.
  repeated WorkspaceBackground backgrounds = 12;
  // The workspace's soundboard (ADR-0036), in library order.
  repeated Sound sounds = 13;
  // Meetings in visible rooms from 15 minutes before their start until their end (ADR-0038
  // §6): the room badge after a (re)connect. Guests get them without attendees.
  repeated CalendarEvent active_events = 14;
  // Pending guest knocks (ADR-0040) on rooms where the recipient decides: MANAGE_ROOM in the
  // room, or the author of the link. Filled in READY only.
  repeated RoomAdmission admissions = 15;
  // Task boards the recipient sees (ADR-0042), by position, with statuses, labels, milestones
  // and shared views; empty for guests.
  repeated Board boards = 16;
  // Tasks with something unseen for the recipient (Task.unread; ≤ 999): the badge on the
  // boards icon. Changes come as TASK_UPDATE on the user channel.
  repeated string unread_task_ids = 17;
  // Phone calls (ADR-0046) dialing, ringing or active in the visible rooms. Changes come as
  // SIP_CALL_UPDATE.
  repeated SipCall sip_calls = 18;
  // Web apps of the workspace (ADR-0050), by position; empty for guests and bots. Changes come
  // as WORKSPACE_APP_UPSERT / WORKSPACE_APP_DELETE.
  repeated WorkspaceApp apps = 19;
  // Board categories of the workspace (ADR-0058 §1), by position; empty for guests. Changes
  // come as BOARD_CATEGORY_CREATE / UPDATE / DELETE.
  repeated BoardCategory board_categories = 20;
}

message Ready {
  string session_id = 1; // gateway session id (for RESUME)
  Me me = 2;
  repeated WorkspaceSnapshot workspaces = 3;
  repeated ReadState read_states = 4;
  // The user's stored per-room notification settings (rooms not listed use the default).
  repeated RoomNotificationSettings notification_settings = 5;
  // The user's direct messages (ADR-0020), most recent activity first. Their read states
  // are also in read_states, their stored notification settings in notification_settings.
  repeated DmSummary dms = 6;
  // The user's stored per-workspace notification settings (workspaces not listed use the
  // default, MENTIONS). Rooms left at INHERIT follow them.
  repeated WorkspaceNotificationSettings workspace_notification_settings = 7;
  // Where to ask for a paid plan (ADR-0024): PLAN_CONTACT_URL, else mailto:PLAN_CONTACT_EMAIL.
  string plan_contact = 8;
  // The recipient's manual status (SetPresence with until), shared by all their devices:
  // status IDLE | DND | INVISIBLE as chosen (not as others see it) and `until` (unset = no
  // end). Unset = none (online / automatic). Changes arrive as USER_UPDATE.presence.
  Presence presence = 9;
  // The recipient's current call (ADR-0034), RINGING or ACTIVE, incoming or outgoing; unset =
  // none. After a reconnect the client restores the ringing / in-call UI from it.
  Call call = 10;
  // Read receipts of workspace rooms (docs/09 #92): how far the other members (bots excluded)
  // read, for visible rooms someone else has read. DMs carry theirs in dms[].peer_read_message_id.
  repeated PeerRead peer_reads = 11;
  // The recipient's own knocks (ADR-0040): PENDING (the client shows the waiting screen
  // instead of the room) and DECLINED ones for 10 minutes after the decision.
  repeated RoomAdmission pending_admissions = 12;
  // The user's notes shelves (ADR-0039) by position; empty for bots and guest accounts.
  repeated NotesShelf notes = 13;
  repeated WorkspaceIdentityAccess identity_access = 14;
}

// A guest knocks on a room (ADR-0040); to the room's deciders.
message RoomAdmissionRequest {
  RoomAdmission admission = 1;
}

// A knock was decided, cancelled by the guest or declined for want of an answer (ADR-0040).
// To the deciders (admission.user carries the id only) and to the guest.
message RoomAdmissionDecided {
  RoomAdmission admission = 1;
}

// How far others read a room (docs/09 #92): in a DM the peer's read marker, in a workspace
// room the furthest marker among the other members (who read is not disclosed); bots' reads
// do not count. In READY (Ready.peer_reads) and as READ_RECEIPT. Clients keep the maximum:
// the recipient's own messages with id <= last_read_message_id show as read.
message PeerRead {
  string room_id = 1;
  string last_read_message_id = 2;
  // Server-internal routing, always empty for clients: the member whose own marker this is
  // (the gateway does not deliver the event to them).
  string except_user_id = 3;
}

// A direct message as seen by one participant (ADR-0020). In READY, GET /api/dms,
// POST /api/dms and DM_CREATE.
message DmSummary {
  // type DM, empty workspace_id / name (clients title it with the peer); last_message_id
  // and last_message_at filled as in READY.
  Room room = 1;
  User peer = 2; // the other participant
  // unread_count: the peer's live messages after the marker (≤ 999; a DM never read counts
  // from its start); mention_count = unread_count — every DM message notifies like a mention.
  ReadState read_state = 3;
  google.protobuf.Timestamp last_message_at = 4; // unset = no messages yet
  // The newest live message for the list preview (unset = no messages yet): the client shows
  // it without fetching the history of every DM.
  DmLastMessage last_message = 5;
  // The caller's own state of the DM (docs/09 item 51); the peer never sees it. Set = in the
  // caller's archive since then; an incoming message takes the DM out (DM_STATE_UPDATE).
  google.protobuf.Timestamp archived_at = 6;
  // «Удалить чат»: the caller no longer sees messages with id <= this one (history, search,
  // pins, last_message and read_state counts start after it). Empty = never cleared. A cleared
  // DM without last_message is hidden from the caller's list until a new message arrives.
  string cleared_before_message_id = 7;
  // The peer's read marker (docs/09 #92): the caller's messages with id <= it are read. Empty =
  // the peer never read the DM, or the peer is a bot. Updates come as READ_RECEIPT.
  string peer_read_message_id = 8;
}

// A notes shelf (ADR-0039) as its owner sees it. In READY, GET/POST/PATCH /api/notes and
// NOTES_CREATE / NOTES_UPDATE. Messages, files, pins, reactions and search use the room
// endpoints like a DM; its events come on the owner's user channel with an empty workspace_id.
message NotesShelf {
  // type NOTES, empty workspace_id; name (1..40 characters) and position (list order, ascending)
  // are the shelf's; last_message_id / last_message_at as in READY (empty = no messages).
  Room room = 1;
  string emoji = 2;               // one emoji or empty
  DmLastMessage last_message = 3; // the newest live message for the list preview; unset = none
}

// Preview of a DM's newest live message (DmSummary.last_message, NotesShelf.last_message).
message DmLastMessage {
  string id = 1;
  string author_id = 2;
  string content = 3; // the first 200 characters of the text (Markdown as sent)
  uint32 attachment_count = 4;
  google.protobuf.Timestamp created_at = 5;
  string sticker_emoji = 6; // set for a sticker message (ADR-0030): its emoji
}

message CategoryCreate {
  RoomCategory category = 1;
}

message CategoryUpdate {
  RoomCategory category = 1;
}

message CategoryDelete {
  string workspace_id = 1;
  string category_id = 2; // its rooms move out of it (ROOM_UPDATE follows)
}

message MessageReactionAdd {
  string workspace_id = 1;
  string room_id = 2;
  string message_id = 3;
  string user_id = 4;
  string emoji = 5;
}

message MessageReactionRemove {
  string workspace_id = 1;
  string room_id = 2;
  string message_id = 3;
  string user_id = 4;
  string emoji = 5;
}

// To the moved user's devices: a moderator moved them to another voice room. LiveKit
// switches the connection (RoomEvent.Moved); VOICE_STATE_UPDATE follows for everyone.
// Sent to the moved user's devices (ADR-0019). With the SFU move (LiveKit Cloud) the device
// is already in the target room: url/token are empty. With the app-level move (open-source
// LiveKit) one event per moved device carries a join token for the target room: the device
// whose auth session is session_id disconnects from the old room and connects with it at
// once (token TTL 2 min); other devices of the user ignore it. A device that does not
// connect to the target within 15 s is rolled back (VOICE_STATE_UPDATE); the old room drops
// it after 5 s.
message VoiceMoved {
  string workspace_id = 1;
  string from_room_id = 2;
  string to_room_id = 3;
  string by_user_id = 4;
  string url = 5;        // LiveKit signal URL; empty = SFU move, nothing to do
  string token = 6;      // join token for the target room (same identity)
  string session_id = 7; // auth session (device) the token is for
  string identity = 8;   // LiveKit identity "<user_id>:<session_id>"
}

// Why the server took a device out of voice (VOICE_DISCONNECTED).
enum VoiceDisconnectReason {
  VOICE_DISCONNECT_REASON_UNSPECIFIED = 0;
  // The user joined voice (a room or a call) from another device: one device in voice at a time.
  VOICE_DISCONNECT_REASON_OTHER_DEVICE = 1;
}

// To the user's devices: the server disconnected the device whose auth session is session_id
// from voice (its LiveKit participant is removed, its voice state cleared; VOICE_STATE_UPDATE
// follows). That device leaves voice without a reconnect attempt; other devices ignore it.
// A one-to-one call is not ended by it.
message VoiceDisconnected {
  string workspace_id = 1; // empty for a one-to-one call (DM room)
  string room_id = 2;
  string session_id = 3;
  VoiceDisconnectReason reason = 4;
}

// Sent after a successful RESUME, following the replayed events.
message Resumed {
  uint32 replayed = 1; // number of events re-sent from the session buffer
}

message WorkspaceCreate {
  WorkspaceSnapshot snapshot = 1; // sent to a user who created/joined a workspace
}

message WorkspaceUpdate {
  Workspace workspace = 1;
}

message WorkspaceDelete {
  string workspace_id = 1; // also sent to a user who left / was kicked
}

message WorkspaceMemberAdd {
  WorkspaceMember member = 1;
}

message WorkspaceMemberUpdate {
  WorkspaceMember member = 1;
}

message RoleCreate {
  Role role = 1;
}

// Also sent for every role whose position changed (create, order).
message RoleUpdate {
  Role role = 1;
}

// Clients drop role_id from every member's role_ids; the role's room overrides are gone
// (ROOM_PERMISSIONS_UPDATE follows for each room that had one).
message RoleDelete {
  string workspace_id = 1;
  string role_id = 2;
}

// The whole pack with its live stickers (create, rename, cover, order, stickers added /
// changed / removed).
message StickerPackCreate {
  StickerPack pack = 1;
}

message StickerPackUpdate {
  StickerPack pack = 1;
}

// The pack is gone: clients drop it from pickers and installed lists. Messages that show its
// stickers keep them.
message StickerPackDelete {
  string workspace_id = 1;
  string pack_id = 2;
}

message BadgeCreate {
  Badge badge = 1;
}

message BadgeUpdate {
  Badge badge = 1;
}

// The badge is gone; its members got WORKSPACE_MEMBER_UPDATE without it just before.
message BadgeDelete {
  string workspace_id = 1;
  string badge_id = 2;
}

message BackgroundCreate {
  WorkspaceBackground background = 1;
}

message BackgroundUpdate {
  WorkspaceBackground background = 1;
}

// The background is gone; clients that chose it fall back to no background.
message BackgroundDelete {
  string workspace_id = 1;
  string background_id = 2;
}

// A web app (ADR-0050) was added, changed or moved (a reorder that renumbers sends one per app).
message WorkspaceAppUpsert {
  WorkspaceApp app = 1;
}

// The app is gone: clients drop its icon and close its view (the desktop clears its site data).
message WorkspaceAppDelete {
  string workspace_id = 1;
  string app_id = 2;
}

message SoundCreate {
  Sound sound = 1;
}

// A sound was renamed, got another emoji or clip, or moved (then every moved sound comes).
message SoundUpdate {
  Sound sound = 1;
}

message SoundDelete {
  string workspace_id = 1;
  string sound_id = 2;
}

// Someone in the call pressed a sound (POST /api/rooms/{id}/sounds/play). Each client in the
// call plays the clip itself through an <audio> element; one that gets the event more than 3 s
// after `at` (its own clock) skips it.
message SoundPlay {
  string room_id = 1;
  string sound_id = 2; // "builtin:<name>" or a Sound.id of the room's workspace
  string user_id = 3;  // who pressed it
  google.protobuf.Timestamp at = 4;
}

message WorkspaceMemberRemove {
  string workspace_id = 1;
  string user_id = 2;
}

message WorkspaceBanAdd {
  WorkspaceBan ban = 1;
}

message WorkspaceBanRemove {
  string workspace_id = 1;
  string user_id = 2;
}

message RoomCreate {
  Room room = 1;
}

message RoomUpdate {
  Room room = 1;
}

message RoomDelete {
  string workspace_id = 1;
  string room_id = 2;
}

message RoomPermissionsUpdate {
  string workspace_id = 1;
  string room_id = 2;
  repeated RoomPermissionOverride permissions = 3;
}

message MessageCreate {
  string workspace_id = 1;
  Message message = 2;
}

message MessageUpdate {
  string workspace_id = 1;
  Message message = 2;
}

message MessageDelete {
  string workspace_id = 1;
  string room_id = 2;
  string message_id = 3;
}

message TypingStart {
  string room_id = 1;
  string user_id = 2;
  google.protobuf.Timestamp timestamp = 3;
}

message PresenceUpdate {
  Presence presence = 1;
}

message VoiceStateUpdate {
  VoiceState state = 1;
}

message VoiceStreamStart {
  string workspace_id = 1;
  string room_id = 2;
  string user_id = 3;
  string track_sid = 4;
  ScreenSharePreset preset = 5;
}

enum VoiceStreamStopReason {
  VOICE_STREAM_STOP_REASON_UNSPECIFIED = 0;
  VOICE_STREAM_STOP_REASON_ENDED = 1;         // publisher stopped / left
  VOICE_STREAM_STOP_REASON_LIMIT_REACHED = 2; // room max_streams exceeded: track muted by the server
  VOICE_STREAM_STOP_REASON_MODERATOR = 3;     // stopped by a member with MUTE_MEMBERS
  VOICE_STREAM_STOP_REASON_ROOM_POLICY = 4;   // moved into a room that does not allow it (cameras off / no VIDEO)
}

message VoiceStreamStop {
  string workspace_id = 1;
  string room_id = 2;
  string user_id = 3;
  string track_sid = 4;
  VoiceStreamStopReason reason = 5;
}

// A webcam was stopped by the server: over the room's camera_limit (LIMIT_REACHED, the track
// is muted and the camera grant withdrawn) or by a moderator (MODERATOR). A camera the user
// turns off himself only clears VoiceState.camera (reason ENDED is not sent separately).
message VoiceCameraStop {
  string workspace_id = 1;
  string room_id = 2;
  string user_id = 3;
  string track_sid = 4;
  VoiceStreamStopReason reason = 5;
}

message ReadStateUpdate {
  ReadState read_state = 1;
}

// A DM was created (POST /api/dms): sent to both participants' user channels, each with
// their own peer. Events of DM rooms (MESSAGE_*, MESSAGE_REACTION_*, TYPING_START) come on
// the participants' user channels, with an empty workspace_id.
message DmCreate {
  DmSummary dm = 1;
}

// A shelf was created on one of the owner's devices (POST /api/notes).
message NotesCreate {
  NotesShelf shelf = 1;
}

// A shelf was renamed, got another emoji or moved (PATCH /api/notes/{id}).
message NotesUpdate {
  NotesShelf shelf = 1;
}

// A shelf was deleted with all its messages (DELETE /api/notes/{id}).
message NotesDelete {
  string room_id = 1;
}

// The user's own state of a DM (DmSummary.archived_at / cleared_before_message_id): after
// PATCH /api/dms/{id}/state on any of their devices, or when an incoming message takes the DM
// out of the archive. A new cleared_before_message_id drops the loaded history up to it.
message DmStateUpdate {
  string room_id = 1;
  google.protobuf.Timestamp archived_at = 2; // unset = not archived
  string cleared_before_message_id = 3; // empty = never cleared
}

// A call to the recipient is ringing (ADR-0034): sent to every device of the callee, with
// the caller's public profile. CALL_STATE follows for the same call on every change.
message CallRing {
  Call call = 1;
  User caller = 2;
}

// A call of the recipient was placed or changed state (ADR-0034): to both participants' user
// channels. Accepting / declining on one device ends the ringing on the others.
message CallStateUpdate {
  Call call = 1;
}

// The user's notification settings of a room changed (sent to the user's own devices only).
message RoomNotificationUpdate {
  RoomNotificationSettings settings = 1;
}

// The user's notification settings of a workspace changed (sent to the user's own devices only).
message WorkspaceNotificationUpdate {
  WorkspaceNotificationSettings settings = 1;
}

// Profile change. On the user's own devices `me` is set (profile + email + settings);
// to the members of the user's workspaces only the public `user` is sent.
message UserUpdate {
  Me me = 1;
  User user = 2;
  // To the user's own sessions only, alone (me / user unset): their manual status changed or
  // ended (see Ready.presence); status ONLINE with no until = none.
  Presence presence = 3;
}

message WorkspaceIdentityAccessUpdate {
  string session_id = 1;
  WorkspaceIdentityAccess access = 2;
}
