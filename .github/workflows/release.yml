# Desktop releases of Calab (github.com/itrcz/calab) on native runners (docs/06, "Релизы: GitHub Actions → S3").
#
#   git tag v0.1.0 && git push origin v0.1.0   → build all three OSes as 0.1.0, GitHub Release (a draft — published
#                                                by infra/docker/release.sh, see the github-release job), publish
#   workflow_dispatch (version, publish)        → same; the GitHub Release is a draft, publishing is opt-in
#
# Publishing (the update feed https://releases.calab.io/ proxies this bucket, infra/docker/caddy; the pre-2.0 feed
# host https://releases.calab.ru/ serves the same bucket — feeds must keep relative file URLs, docs/06 «Домены»):
#   S3 (preferred) — bucket layout: releases/<version>/<installers, blockmaps>   (Cache-Control immutable)
#                                   latest-mac.yml, latest-linux.yml, latest.yml, index.html at the root
#                                   (no-cache, uploaded LAST; their `url:`/`path:` point into releases/<version>/)
#                                   latest/<stable name> + latest/VERSION — server-side copies of the newest stable
#                                   release (no-cache), for the landing and /download/<os> (infra/docker/caddy)
#   stand (fallback, when S3 secrets are absent) — rsync to /opt/calaba/releases (flat, as before)
#
# Every OS builds natively, so the patched uiohook-napi is compiled from source everywhere (MSVC on Windows).
#
# Secrets (set by infra/ci/set-secrets.sh from the owner's .env — never in the repo). All optional:
#   S3_ENDPOINT S3_REGION(=ru-central1) S3_BUCKET S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY   publishing to S3
#   STAND_SSH_KEY STAND_HOST STAND_KNOWN_HOSTS                          fallback publishing to the stand
#   APPLE_CERT_P12_BASE64 APPLE_CERT_PASSWORD                           macOS Developer ID Application (.p12)
#   APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID notarization (App Store Connect .p8)
#   WIN_CERT_P12_BASE64 WIN_CERT_PASSWORD                               Windows code signing (.pfx/.p12)
# Certificate material is validated first (openssl); absent, stub or undecodable → unsigned build + notice.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0). Empty = apps/desktop/package.json'
        required: false
        default: ''
      publish:
        description: 'Publish to the update feed (S3, or the stand when S3 secrets are absent)'
        type: boolean
        default: false
      require_ci:
        description: 'Require a successful ci run (push on main or this ref) for the commit being built'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_REPO: itrcz/calab                      # git@github.com:itrcz/calab.git
  UPDATE_URL: https://releases.calab.io/         # update feed (docs/10-branding.md; proxies the S3 bucket)
  HOMEPAGE: https://calab.io
  APP_ORIGIN: https://app.calab.io               # first-run server of release builds (MAIN_VITE_DEFAULT_SERVER_URL)
  LEGACY_UPDATE_URL: https://releases.calab.ru/  # feed baked into pre-2.0 builds: must keep serving the same bucket

jobs:
  # A tag must never ship clients pointing to a dead host: the feed and the default server baked into the
  # build have to answer over valid TLS before anything is built (docs/06 «Домены»). And it must never
  # ship a commit that did not pass ci.yml: on a tag push (and on a dispatch with require_ci) the build
  # waits for a successful push run of ci.yml for this SHA — on main or on the tag itself (a tag on a
  # SHA verified on main passes ci in about a minute, see ci.yml).
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read   # ci.yml runs of this SHA
    steps:
      - name: update feed and app host answer over TLS
        run: |
          fail=0
          probe() { # url, what
            local code rc=0
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 --retry-all-errors "$1") || rc=$?
            if [[ $rc == 0 && "$code" =~ ^(200|204|301|302|307|308)$ ]]; then echo "ok   $1 ($code)"
            else echo "::error::$2 $1 failed (HTTP $code, curl exit $rc: 6/7 DNS/connect, 35/60 TLS) — fix DNS/certificate/ingress before releasing"; fail=1; fi
          }
          probe "$UPDATE_URL" "update feed (UPDATE_URL)"
          probe "${UPDATE_URL%/}/latest.yml" "update feed metadata"
          probe "${LEGACY_UPDATE_URL%/}/latest.yml" "pre-2.0 update feed (LEGACY_UPDATE_URL)"
          probe "$APP_ORIGIN/api/version" "default server (APP_ORIGIN)"
          probe "$HOMEPAGE/" "site (HOMEPAGE)"
          exit $fail

      - name: ci passed for this commit
        if: github.event_name == 'push' || inputs.require_ci
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # push runs of ci.yml for exactly this SHA on main or on this ref: "<conclusion|status> <url>"
          runs() {
            gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&per_page=20" \
              --jq '.workflow_runs[] | select(.head_sha == env.SHA and (.head_branch == "main" or .head_branch == env.REF_NAME))
                    | "\(.conclusion // .status) \(.html_url)"'
          }
          for i in $(seq 1 30); do   # 30 x 30 s = 15 min
            out=$(runs) || { echo "::warning::Actions API query failed (attempt $i)"; out="pending -"; }
            ok=$(grep -m1 '^success ' <<<"$out" || true)
            if [[ -n "$ok" ]]; then echo "ci passed for $SHA: ${ok#success }"; exit 0; fi
            # every run finished and none succeeded: no point in waiting (the first minute is left for
            # the tag's own run to appear)
            if (( i > 2 )) && [[ -n "$out" ]] && ! grep -qvE '^(failure|cancelled|timed_out|action_required|skipped|startup_failure|stale|neutral) ' <<<"$out"; then
              echo "$out"
              echo "::error::ci.yml did not pass for $SHA (main or $REF_NAME): fix CI (or re-run it), then re-run this workflow"
              exit 1
            fi
            echo "waiting for ci on $SHA (attempt $i/30): ${out:-no run yet}"
            sleep 30
          done
          echo "::error::no successful ci.yml run for $SHA (main or $REF_NAME) within 15 min: check the ci run of this commit, then re-run this workflow"
          exit 1

  build:
    name: build (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac        # arm64 runner; x64 is cross-compiled (arch list comes from electron-builder.yml)
            os: macos-latest
            eb: --mac
          - target: linux
            os: ubuntu-22.04
            eb: --linux AppImage deb --x64
          - target: win
            os: windows-latest
            eb: --win nsis --x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: X11 headers for uiohook (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-dev libxtst-dev libxt-dev libxinerama-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxkbfile-dev libxrandr-dev

      - name: version
        id: ver
        env:
          VERSION: ${{ inputs.version }}   # via env, never interpolated into the script
        run: |
          v="$VERSION"
          if [[ -z "$v" && "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; fi
          # SemVer (optional prerelease); applies to the dispatch input and to the tag name alike
          if [[ -n "$v" && ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            src="tag $GITHUB_REF_NAME"; [[ -n "$VERSION" ]] && src="the 'version' input"
            # the value is echoed sanitised: no newlines → no injected ::workflow-commands::
            echo "::error::invalid version '${v//[^0-9A-Za-z.+_-]/?}' from $src: expected X.Y.Z or X.Y.Z-prerelease (e.g. 1.2.0, 1.2.0-rc.1)"
            exit 1
          fi
          if [[ -n "$v" ]]; then (cd apps/desktop && npm version "$v" --no-git-tag-version --allow-same-version); fi
          echo "version=$(node -p "require('./apps/desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      # postinstall compiles the patched uiohook-napi for the runner (electron-rebuild); electron-builder
      # compiles it again per target arch (buildDependenciesFromSource).
      - run: pnpm install --frozen-lockfile
      - name: uiohook patch applied
        run: |
          grep -q VC_CAPS_LOCK_STATE node_modules/uiohook-napi/libuiohook/include/uiohook.h
          grep -q CALABA_UIOHOOK_PATCH_V2 node_modules/uiohook-napi/src/lib/addon.c
          grep -q CALABA_HID_CAPS_V1 node_modules/uiohook-napi/libuiohook/src/darwin/input_hook.c
      # Signing only with VALID material: the base64 must decode into a PKCS#12 that opens with its password
      # (and, for notarization, a private key .p8). Anything else — absent, stub, wrong password — is an
      # unsigned build with a notice, never a failure. Secrets can't be used in `if:`, hence one bash step.
      - name: signing setup
        id: sign
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CERT_P12_BASE64: ${{ secrets.WIN_CERT_P12_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
          TARGET: ${{ matrix.target }}
        run: |
          t="$TARGET"; sign=0 args="" notarized=0
          # Secrets pasted from a .env may keep their surrounding quotes / trailing newline: normalise
          # (base64 material also loses inner whitespace). Diagnostics below never print values.
          unq() { local v="$1"; v="${v%$'\n'}"; v="${v%$'\r'}"; v="${v#\"}"; v="${v%\"}"; v="${v#\'}"; v="${v%\'}"; printf '%s' "$v"; }
          for k in APPLE_CERT_P12_BASE64 APPLE_CERT_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID WIN_CERT_P12_BASE64 WIN_CERT_PASSWORD; do
            raw="${!k}"; [[ -n "$raw" ]] || continue
            v="$(unq "$raw")"; [[ "$k" == *_BASE64 ]] && v="$(printf '%s' "$v" | tr -d ' \t\r\n')"
            [[ "$v" != "$raw" ]] && echo "::notice::$k normalised (quotes/whitespace stripped; ${#raw} → ${#v} chars)"
            printf -v "$k" '%s' "$v"
          done
          p12_ok() { # base64 password outfile
            [[ -n "$1" ]] || { echo "p12: secret is empty"; return 1; }
            printf '%s' "$1" | base64 -d > "$3" 2>/dev/null && [[ -s "$3" ]] || { echo "p12: base64 decode failed (${#1} chars)"; return 1; }
            # Apple/Windows exports use legacy RC2-40 encryption: OpenSSL 3 needs -legacy (and its legacy
            # provider), macOS's LibreSSL reads it as is but has no -legacy flag — try each validator.
            local o
            for o in /usr/bin/openssl openssl; do
              command -v "$o" >/dev/null || continue
              P12PW="$2" "$o" pkcs12 -in "$3" -passin env:P12PW -noout >/dev/null 2>&1 && return 0
              P12PW="$2" "$o" pkcs12 -legacy -in "$3" -passin env:P12PW -noout >/dev/null 2>&1 && return 0
            done
            echo "p12 check failed with: $(for o in /usr/bin/openssl openssl; do command -v "$o" >/dev/null && "$o" version; done | tr '\n' ';')"
            return 1
          }
          envset() { { echo "$1<<__EOV__"; printf '%s\n' "$2"; echo "__EOV__"; } >> "$GITHUB_ENV"; }
          cert="$RUNNER_TEMP/cert.p12"
          if [[ "$t" == mac ]] && p12_ok "$APPLE_CERT_P12_BASE64" "$APPLE_CERT_PASSWORD" "$cert"; then
            sign=1
            # electron-builder.yml keeps local builds unsigned (identity: null); drop it for this CI build only
            sed -i.bak '/^  identity: null/d' apps/desktop/electron-builder.yml
            # Own keychain instead of CSC_LINK: electron-builder's temp keychain fails on current macOS
            # runners (set-key-partition-list → "SecKeychainUnlock: passphrase not correct").
            kc="$RUNNER_TEMP/signing.keychain-db"; kcpw="$(openssl rand -hex 24)"
            security create-keychain -p "$kcpw" "$kc"
            security set-keychain-settings -lut 21600 "$kc"
            security unlock-keychain -p "$kcpw" "$kc"
            security import "$cert" -k "$kc" -P "$APPLE_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign >/dev/null
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" >/dev/null
            # shellcheck disable=SC2046  # the existing keychain list is word-split on purpose
            security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
            rm -f "$cert"
            ident="$(security find-identity -v -p codesigning "$kc" | sed -nE 's/.*"Developer ID Application: (.*)"$/\1/p' | head -1)"
            if [[ -z "$ident" ]]; then
              echo "::error::macOS: no 'Developer ID Application' identity in the imported certificate"; exit 1
            fi
            echo "::notice::mac: identity imported into a job keychain"
            envset CSC_NAME "$ident"; envset CSC_KEYCHAIN "$kc"
            # Team ID for notarytool (optional with an API key; required by the Apple ID flow)
            [[ -n "$APPLE_TEAM_ID" ]] && envset APPLE_TEAM_ID "$APPLE_TEAM_ID"
            # notarization needs the App Store Connect API key AND its Issuer ID; without the issuer: sign only
            key="$RUNNER_TEMP/apple_api_key.p8"
            if [[ -n "$APPLE_API_KEY_BASE64" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" ]] \
               && printf '%s' "$APPLE_API_KEY_BASE64" | base64 -d > "$key" 2>/dev/null && openssl pkey -in "$key" -noout 2>/dev/null; then
              envset APPLE_API_KEY "$key"; envset APPLE_API_KEY_ID "$APPLE_API_KEY_ID"; envset APPLE_API_ISSUER "$APPLE_API_ISSUER"
              args="-c.mac.notarize=true"; notarized=1
            else
              echo "::warning::macOS: signed, but NOT notarized (APPLE_API_KEY_BASE64/ID/ISSUER absent or invalid)"
            fi
          elif [[ "$t" == win ]] && p12_ok "$WIN_CERT_P12_BASE64" "$WIN_CERT_PASSWORD" "$cert"; then
            sign=1
            envset CSC_LINK "$cert"; envset CSC_KEY_PASSWORD "$WIN_CERT_PASSWORD"
          fi
          if [[ $sign == 1 ]]; then
            envset CSC_IDENTITY_AUTO_DISCOVERY true
            echo "::notice::$t: signing enabled"
          else
            envset CSC_IDENTITY_AUTO_DISCOVERY false
            [[ "$t" == linux ]] || echo "::notice::$t: no valid signing certificate (absent, stub or wrong password) — unsigned build"
          fi
          [[ $sign == 1 ]] || rm -f "$cert"   # win keeps it: electron-builder reads CSC_LINK at build time
          # Auto-install may be offered only for a trusted build: mac needs signature AND notarization
          # (Gatekeeper), win/linux just a valid signature.
          trusted=$sign; [[ "$t" == mac && $notarized != 1 ]] && trusted=0
          { echo "sign=$sign"; echo "args=$args"; echo "trusted=$trusted"; } >> "$GITHUB_OUTPUT"

      # build:app = electron-vite build + build/.gen/THIRD-PARTY-NOTICES.txt (packaged as extraResources)
      # MAIN_VITE_* are baked in at build time (main process): the update feed, and whether auto-install
      # may be offered — only when THIS platform's build is really signed (client, electron-vite env).
      - name: build:app (electron-vite + third-party notices)
        env:
          MAIN_VITE_UPDATE_FEED: ${{ env.UPDATE_URL }}
          MAIN_VITE_DEFAULT_SERVER_URL: ${{ env.APP_ORIGIN }}   # the host the preflight job checked
          MAIN_VITE_UPDATES_SIGNED: ${{ steps.sign.outputs.trusted == '1' && '1' || '' }}
        run: pnpm -F @calaba/desktop run build:app
      - name: third-party notices generated
        run: test -s apps/desktop/build/.gen/THIRD-PARTY-NOTICES.txt

      - name: electron-builder   # CSC_* / APPLE_API_* come from the signing step via GITHUB_ENV
        working-directory: apps/desktop
        env:
          EB_TARGETS: ${{ matrix.eb }}                 # word-split on purpose (several CLI args)
          EB_SIGN_ARGS: ${{ steps.sign.outputs.args }}
        run: |
          rm -rf ../../node_modules/uiohook-napi/bin   # postinstall copy for the runner arch only
          # shellcheck disable=SC2086,SC2016  # split args on purpose; ${version}/${arch}/${ext} are electron-builder macros
          pnpm exec electron-builder $EB_TARGETS --publish never $EB_SIGN_ARGS \
            -c.publish.provider=generic "-c.publish.url=$UPDATE_URL" \
            '-c.mac.artifactName=Calab-${version}-${arch}.${ext}' \
            '-c.nsis.artifactName=Calab-Setup-${version}-${arch}.${ext}' \
            '-c.appImage.artifactName=Calab-${version}-${arch}.${ext}' \
            '-c.deb.artifactName=calab_${version}_${arch}.${ext}' \
            -c.linux.executableName=calab -c.deb.packageName=calab \
            "-c.extraMetadata.homepage=$HOMEPAGE" \
            -c.directories.output=dist-release

      # Every packaged uiohook .node must be our patched build (marker compiled in by the patch), never
      # the upstream prebuilt; a missing one crashes main at startup. Runs before anything is uploaded.
      - name: native module is packaged and patched (check-native)
        run: node apps/desktop/scripts/check-native.mjs apps/desktop/dist-release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          if-no-files-found: error
          path: |
            apps/desktop/dist-release/*.dmg
            apps/desktop/dist-release/*.zip
            apps/desktop/dist-release/*.AppImage
            apps/desktop/dist-release/*.deb
            apps/desktop/dist-release/*.exe
            apps/desktop/dist-release/*.blockmap
            apps/desktop/dist-release/*.yml
            !apps/desktop/dist-release/builder-debug.yml

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # gh uses GH_TOKEN; no write token left in .git/config
          sparse-checkout: |
            CHANGELOG.md
            infra/ci
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist-release
      - name: create or update GitHub Release (gh CLI, no third-party action)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist-release
          # update feeds are per channel: latest*.yml, or rc*/beta*/alpha* for prerelease versions
          ver=$(sed -n 's/^version: //p' dist-release/*-linux.yml | head -1); [[ -n "$ver" ]]
          # Always a DRAFT: publishing a release for a tag push with the Actions token fails with
          # 403 «Resource not accessible by integration» (v0.1.0, 2026-09-26: the token may not publish a
          # ref of a commit that changes .github/workflows; drafts do not touch the ref). The draft is
          # published with the owner's token by infra/docker/release.sh (desktop step) after the feed checks.
          tag="${GITHUB_REF_NAME}"; draft="--draft"; target=()
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then tag="v$ver"; target=(--target "$GITHUB_SHA"); fi
          # body = this version's CHANGELOG.md section + download links; no section → GitHub's auto-generated notes
          links="**Скачать:** [calab.io](https://calab.io/#download) · файлы и обновления: [releases.calab.io](https://releases.calab.io/) · [все изменения](https://github.com/$RELEASE_REPO/blob/main/CHANGELOG.md)"
          edit_notes=()
          if section=$(bash infra/ci/changelog-section.sh "$ver" CHANGELOG.md); then
            printf '%s\n\n---\n%s\n' "$section" "$links" > release-notes.md
            notes=(--notes-file release-notes.md); edit_notes=("${notes[@]}")
          else
            echo "::warning::CHANGELOG.md has no section for $ver — using auto-generated release notes"
            notes=(--generate-notes --notes "$links")   # GitHub prepends --notes to the generated notes
            # `gh release edit` cannot regenerate notes: on a re-run the existing body is kept as is
          fi
          # Idempotent re-runs: an existing release is updated in place (same id → links, date and
          # published/draft state are kept), assets are replaced; it is never deleted and re-created.
          if is_draft=$(gh release view "$tag" --repo "$RELEASE_REPO" --json isDraft --jq .isDraft 2>/dev/null); then
            # a manual (dispatch) build must never overwrite the installers of a published release
            if [[ "$GITHUB_REF" != refs/tags/v* && "$is_draft" != true ]]; then
              echo "::error::release $tag is already published — a workflow_dispatch build may only update a draft (push the tag to rebuild it)"
              exit 1
            fi
            echo "::notice::release $tag exists (draft=$is_draft) — updating title/notes and replacing assets"
            gh release edit "$tag" --repo "$RELEASE_REPO" --title "Calab $ver" "${edit_notes[@]}"
            gh release upload "$tag" --repo "$RELEASE_REPO" --clobber dist-release/*
          else
            gh release create "$tag" $draft --repo "$RELEASE_REPO" "${target[@]}" \
              --title "Calab $ver" "${notes[@]}" \
              dist-release/*
          fi

  publish-s3:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-22.04          # AWS CLI v2 is preinstalled
    outputs:
      published: ${{ steps.s3.outputs.published }}
    env:
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist-release
      - name: publish to S3 (skipped without S3_* secrets)
        id: s3
        run: |
          if [[ -z "$S3_ENDPOINT" || -z "$S3_BUCKET" || -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "::notice::S3_* secrets not configured — S3 publishing skipped (stand fallback runs instead)"
            echo "published=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          export AWS_DEFAULT_REGION="${S3_REGION:-ru-central1}"   # Yandex Object Storage
          aws configure set default.s3.addressing_style path
          s3() { aws --endpoint-url "$S3_ENDPOINT" s3 "$@"; }
          cd dist-release
          ver=$(sed -n 's/^version: //p' ./*-linux.yml | head -1); [[ -n "$ver" ]]
          feeds=(*.yml)   # latest-mac.yml latest-linux.yml latest.yml — or rc-*.yml / rc.yml for prereleases
          # 1. installers + blockmaps under releases/<version>/ — immutable (versioned names, never overwritten)
          s3 cp . "s3://$S3_BUCKET/releases/$ver/" --recursive --exclude '*' \
            --include '*.dmg' --include '*.zip' --include '*.AppImage' --include '*.deb' --include '*.exe' --include '*.blockmap' \
            --cache-control 'public, max-age=31536000, immutable' --only-show-errors
          # 2. feeds: point url:/path: into releases/<version>/ (sha512/size unchanged — same bytes)
          # Relative only: releases.calab.io (new builds) and releases.calab.ru (pre-2.0 builds) serve the same
          # bucket, and each client resolves file URLs against its own feed host (docs/06 «Домены»).
          if grep -EHn '^\s*(- url|path): *[a-z]+://' "${feeds[@]}"; then
            echo "::error::absolute file URLs in the update feeds — clients of the other feed host could not follow them"; exit 1
          fi
          for y in "${feeds[@]}"; do
            sed -E -i "s#^(\s*- url: |path: )#\1releases/$ver/#" "$y"
          done
          # 3. a small index for humans (https://releases.calab.io/)
          {
            echo "<!doctype html><meta charset=utf-8><title>Calab $ver</title><h1>Calab $ver</h1><ul>"
            for f in *.dmg *.exe *.AppImage *.deb; do [[ -f "$f" ]] && echo "<li><a href=\"releases/$ver/$f\">$f</a></li>"; done
            echo "</ul><p>Update feeds: ${feeds[*]}</p>"
          } > index.html
          # 4. feeds + index LAST, no-cache: clients never see a feed pointing at a file that is not there yet
          for y in "${feeds[@]}"; do
            s3 cp "$y" "s3://$S3_BUCKET/$y" --cache-control 'no-cache' --content-type 'text/yaml; charset=utf-8' --only-show-errors
          done
          s3 cp index.html "s3://$S3_BUCKET/index.html" --cache-control 'no-cache' --content-type 'text/html; charset=utf-8' --only-show-errors
          # 5. stable download names under latest/ (the landing's buttons and /download/<os> link there; the
          #    updater feeds above are untouched): server-side copies of this release (no re-upload), stable
          #    releases only. Content-Disposition keeps the versioned name for the saved file. VERSION last.
          if [[ "$ver" == *-* ]]; then
            echo "::notice::prerelease $ver — latest/ left as is"
          else
            latest=(
              "Calab-$ver-arm64.dmg:Calab-mac-arm64.dmg"
              "Calab-$ver-x64.dmg:Calab-mac-x64.dmg"
              "Calab-Setup-$ver-x64.exe:Calab-win-x64.exe"
              "Calab-$ver-x86_64.AppImage:Calab-linux-x86_64.AppImage"
              "calab_${ver}_amd64.deb:calab-linux-amd64.deb"
            )
            for pair in "${latest[@]}"; do
              src="${pair%%:*}" dst="${pair#*:}"
              [[ -f "$src" ]] || { echo "::error::$src is not in this release — latest/$dst not updated"; exit 1; }
            done
            for pair in "${latest[@]}"; do
              src="${pair%%:*}" dst="${pair#*:}"
              s3 cp "s3://$S3_BUCKET/releases/$ver/$src" "s3://$S3_BUCKET/latest/$dst" \
                --metadata-directive REPLACE --cache-control 'no-cache' --content-type 'application/octet-stream' \
                --content-disposition "attachment; filename=\"$src\"" --only-show-errors
            done
            printf '%s\n' "$ver" > VERSION
            s3 cp VERSION "s3://$S3_BUCKET/latest/VERSION" --cache-control 'no-cache' --content-type 'text/plain; charset=utf-8' --only-show-errors
          fi
          echo "published=1" >> "$GITHUB_OUTPUT"
          echo "::notice::published Calab $ver to s3://$S3_BUCKET (feed: $UPDATE_URL, same bucket as https://releases.calab.ru/)"

  publish-stand:
    needs: [build, publish-s3]
    # fallback: only when the S3 publishing did not happen (no S3 secrets)
    if: always() && needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && needs.publish-s3.outputs.published != '1'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist-release
      - name: publish to the stand /opt/calaba/releases (skipped without STAND_* secrets)
        env:
          STAND_SSH_KEY: ${{ secrets.STAND_SSH_KEY }}
          STAND_HOST: ${{ secrets.STAND_HOST }}
          STAND_KNOWN_HOSTS: ${{ secrets.STAND_KNOWN_HOSTS }}
        run: |
          if [[ -z "$STAND_SSH_KEY" || -z "$STAND_HOST" || -z "$STAND_KNOWN_HOSTS" ]]; then
            echo "::warning::neither S3_* nor STAND_* secrets configured — the release was NOT published"; exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$STAND_SSH_KEY" > ~/.ssh/id_stand && chmod 600 ~/.ssh/id_stand
          printf '%s\n' "$STAND_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Same semantics as infra/docker/sync.sh: flat layout, installers first, latest*.yml together at the
          # end (--delay-updates), never --delete (old versions stay downloadable; cached as immutable).
          rsync -az --delay-updates -e "ssh -i ~/.ssh/id_stand -o StrictHostKeyChecking=yes" \
            dist-release/ "$STAND_HOST:/opt/calaba/releases/"
