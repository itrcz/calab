# Security review L5: keep pinned SHAs/digests fresh via reviewed PRs.
# Triage and auto-merge rules: .github/workflows/dependabot-auto-merge.yml, docs/11-maintenance.md.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: gomod
    directory: /apps/server
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      gomod: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /   # pnpm workspace: covers apps/*, packages/*
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # bumped by hand: new Chromium/Node ABI (uiohook rebuild, visual snapshots) / new Next major
      - dependency-name: electron
        update-types: ["version-update:semver-major"]
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      # Vite 8 (rolldown) with electron-vite 5 bundled the `electron` npm package into out/main: every launch of
      # 2.2.0 spawned another app instance (process.execPath install.js). Major bumps only together with
      # electron-vite, after scripts/check-main-bundle.mjs passes on a packaged build.
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      # @vitejs/plugin-react 6 requires vite ^8 (imports vite/internal) — bump together with vite
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
    groups:
      electron:
        patterns: ["electron"]
      # always its own PR: patches/uiohook-napi@*.patch must be re-applied by hand (never auto-merged)
      uiohook:
        patterns: ["uiohook-napi"]
      minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["electron", "uiohook-napi"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/apps/server, /infra/docker/caddy]
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # Go toolchain bumps are coordinated by hand: go.mod + ci.yml go-version + Dockerfile in one PR
      - dependency-name: golang
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      docker: { patterns: ["*"] }

  - package-ecosystem: docker-compose
    directory: /infra/docker
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # livekit/sip must be upgraded together with livekit-server (psrpc/protocol versions), see infra/docker/compose.yml
      - dependency-name: livekit/sip
    groups:
      docker-compose: { patterns: ["*"] }
