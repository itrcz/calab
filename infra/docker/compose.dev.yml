# Локальная разработка (macOS): БД, Valkey (совместим с Redis), LiveKit в dev-режиме без TLS.
# Файлы API пишет на локальный диск (STORAGE_DRIVER=fs, ADR-0011) — сервиса S3 нет.
# API и Electron запускаются на хосте через pnpm.
# Примечание: Docker на macOS не даёт host network → LiveKit в контейнере годится только
# для клиентов на этой же машине. Для тестов между машинами в LAN: `brew install livekit`
# и `livekit-server --dev --bind 0.0.0.0`.

# Explicit project name: volumes/containers are calaba_*, and --remove-orphans
# never touches other compose projects on a shared host.
name: calaba-dev

services:
  postgres:
    image: postgres:18-alpine   # PG 18: built-in uuidv7()
    environment:
      - POSTGRES_USER=calaba
      - POSTGRES_PASSWORD=calaba
      - POSTGRES_DB=calaba
    ports: ["55432:5432"]   # 5432 is often taken by other local projects
    volumes: [pg_dev:/var/lib/postgresql]

  valkey:
    image: valkey/valkey:9-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11   # ≥ 9.0: HEXPIRE for presence
    ports: ["56379:6379"]   # 6379 is often taken by a native Redis

  # Mail catcher (ADR-0023): the API sends to SMTP localhost:1025 (SMTP_TLS=none),
  # letters are read at http://localhost:8025. Nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:v1.30
    ports:
      - "1025:1025"
      - "8025:8025"

  livekit:
    image: livekit/livekit-server:v1.13
    # livekit.dev.yaml: ключи devkey / secret, UDP mux 7882, webhook → API на хосте (:3000),
    # Valkey (DB 1) — через него LiveKit говорит с egress
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit/livekit.dev.yaml:/etc/livekit.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux; Docker Desktop resolves it natively
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    depends_on: [valkey]

  # Телефония (ADR-0046), только по запросу: `docker compose -f infra/docker/compose.dev.yml
  # --profile sip up -d sip`. В сетевом пространстве LiveKit; без провайдера звонки падают сразу,
  # но API транков и CreateSIPParticipant работают по-настоящему.
  sip:
    image: livekit/sip:v1.17.0@sha256:d3c6441eb0918a81ab9e48ba7df6f02c1eebbeace42c963b2c6a6e5418675671
    profiles: [sip]
    network_mode: "service:livekit"
    environment:
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      SIP_CONFIG_BODY: |
        ws_url: ws://127.0.0.1:7880
        redis:
          address: valkey:6379
          db: 1
        sip_port: 5060
        rtp_port: 10000-10200
        hide_inbound_port: true
        logging:
          level: debug
    depends_on: [livekit, valkey]

  # Запись встреч (ADR-0025). В сетевом пространстве LiveKit: node_ip 127.0.0.1 из livekit.dev.yaml
  # для egress — это сам LiveKit. Файлы — в apps/server/data/recordings (RECORDINGS_PATH API
  # на хосте по умолчанию), внутри контейнера /out.
  egress:
    image: livekit/egress:v1.14.1@sha256:bf2b648b947349c3e9ff7aa8c718f00378d5c06af7624652a3653318e00333ce
    network_mode: "service:livekit"
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: devkey
        api_secret: secret
        ws_url: ws://127.0.0.1:7880
        insecure: true
        redis:
          address: valkey:6379
          db: 1
        session_limits:
          file_output_max_duration: 3h59m
    volumes:
      - ../../apps/server/data/recordings:/out
    depends_on: [livekit, valkey]

volumes:
  pg_dev:
