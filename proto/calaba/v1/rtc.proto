syntax = "proto3";
package calaba.v1;

import "calaba/v1/media.proto";
import "calaba/v1/plan.proto";

// POST /api/rooms/{id}/join (CONNECT). Returns a LiveKit token for this device
// (identity "<user_id>:<session_id>", TTL 10 min, use it to connect right away).
message JoinVoiceResponse {
  string url = 1;   // LiveKit signal URL (LIVEKIT_URL)
  string token = 2; // LiveKit access JWT
  string identity = 3;
  // Effective settings to apply when publishing: room settings capped by the workspace plan
  // (max_stream_preset, max_streams).
  RoomMediaSettings media = 4;
  bool can_speak = 5;
  bool can_stream = 6; // STREAM granted and a stream slot was free at join time
  // VIDEO granted and the room allows cameras (camera_limit > 0). The camera source is not in
  // the join token: call POST /api/rooms/{id}/camera/request before publishing a webcam.
  bool can_video = 7;
  // The device is recorded in the room as pending (VoiceState.pending) until it connects to
  // LiveKit; false when it was already connected there (a repeated /join).
  bool pending = 8;
  // Effective plan limits of the workspace (ADR-0024), e.g. stream / camera fps caps.
  PlanLimits plan_limits = 9;
}

// POST /api/rooms/{id}/voice/companion (VIEW_ROOM + CONNECT, workspace voice rooms only)
// → 200 VoiceCompanionResponse: a token for the device's companion connection (ADR-0149 §3),
// identity "<user_id>:<session_id>:web", TTL 10 min (connect right away; LiveKit refreshes it
// while connected). Subscribe and data only, no publish sources. Needs this session's seat in
// the room (pending, connected or held, VoiceState) and never creates or changes one: 409
// ERROR_CODE_CONFLICT without a seat here, 403 without the rights or for a denied session, 404
// for a one-to-one call, 422 for a room that is not a voice room.
// The companion is removed from LiveKit when the device's seat goes; a newer companion of the
// same session replaces the older one (DUPLICATE_IDENTITY).
message VoiceCompanionResponse {
  string url = 1;   // LiveKit signal URL (LIVEKIT_URL)
  string token = 2; // LiveKit access JWT
  string identity = 3;
}

// POST /api/rooms/{id}/camera/request (VIDEO + CONNECT, device in the call), body
// RequestCameraRequest (optional) → 200 RequestCameraResponse: grants the
// camera source to this device (reservation for 10 min, kept while the camera is on);
// 409 ERROR_CODE_CONFLICT when camera_limit is reached (0 = cameras off). The limit itself is
// enforced atomically when the track is published: an extra camera is muted by the server
// (VOICE_CAMERA_STOP{LIMIT_REACHED}).
// POST /api/rooms/{id}/camera/stop → 204: withdraws the camera source from this device.
// POST /api/rooms/{id}/voice/{userId}/stop-camera (MUTE_MEMBERS) → 204 | 404 (no camera and
// no reservation): mutes the member's webcams, withdraws the grant, VOICE_CAMERA_STOP{MODERATOR}.
// The stop is sticky for the member's devices until they leave the call or a moderator calls
// POST /api/rooms/{id}/voice/{userId}/allow-camera (MUTE_MEMBERS) → 204; meanwhile
// /camera/request answers 403.

// Webcam quality wanted by /camera/request; the answer is capped by the plan (ADR-0024).
message RequestCameraRequest {
  ScreenSharePreset preset = 1; // H720 = 720p, H1080 = 1080p, ORIGINAL = native; UNSPECIFIED = best allowed
  uint32 fps = 2;               // 0 = best allowed
}

// Granted webcam quality: min(wanted, plan camera_max_preset / camera_max_fps).
// UNSPECIFIED / 0 = no cap (only when nothing was asked and the plan has no cap).
message RequestCameraResponse {
  ScreenSharePreset preset = 1;
  uint32 fps = 2;
}

// POST /api/rooms/{id}/stream/request (STREAM). Reserves a stream slot for this device and
// grants screen share sources; 409 ERROR_CODE_CONFLICT when max_streams is reached.
message RequestStreamRequest {
  ScreenSharePreset preset = 1; // wanted preset; UNSPECIFIED = room maximum
  uint32 fps = 2;               // wanted frame rate; 0 = the preset's own
}

message RequestStreamResponse {
  // Granted preset: ≤ room max_stream_preset and ≤ plan stream_max_preset (ADR-0024).
  ScreenSharePreset preset = 1;
  // Granted frame rate: min(wanted, the preset's own — ECONOMY 5, H720 / H1080 15,
  // ORIGINAL 30 — and plan stream_max_fps).
  uint32 fps = 2;
}

// POST /api/rooms/{id}/voice/{userId}/move (MOVE_MEMBERS in both rooms): moves all of the
// user's devices in room {id} to the target voice room of the same workspace (LiveKit
// MoveParticipant, no reconnect). 204. The moved user gets VOICE_MOVED.
message MoveMemberRequest {
  string target_room_id = 1;
}

// PATCH /api/voice/self — optimistic self mute/deafen of this device; 204.
message UpdateVoiceSelfRequest {
  optional bool muted = 1;
  optional bool deafened = 2;
  // Musician mode of this device (ADR-0052, VoiceState.musician).
  optional bool musician = 3;
  // Push-to-talk input mode of this device (ADR-0130, VoiceState.ptt). Sent on a mode change only.
  optional bool ptt = 4;
  // This device parked the room for a phone call (ADR-0133, VoiceState.on_phone).
  optional bool on_phone = 5;
}
