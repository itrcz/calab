syntax = "proto3";
package calaba.v1;

import "google/protobuf/timestamp.proto";
import "calaba/v1/media.proto";
import "calaba/v1/identity.proto";

// Workspace plans and limits (ADR-0024). Limits are enforced by the server only and apply
// to everyone in the workspace, the owner included (they are not permission bits).

enum Plan {
  PLAN_UNSPECIFIED = 0;
  PLAN_FREE = 1;   // limits from PLAN_FREE_LIMITS
  PLAN_TEAM = 2;   // limits from PLAN_TEAM_LIMITS
  PLAN_CUSTOM = 3; // limits as stored for the workspace
  PLAN_ENTERPRISE = 4; // cloud Business; on-prem Enterprise is an operator edition
}

// Effective limits of a workspace. 0 / UNSPECIFIED = no limit.
message PlanLimits {
  uint32 room_members = 1;                 // users in one voice room (guests and pending devices count)
  ScreenSharePreset stream_max_preset = 2; // highest screen share preset
  uint32 stream_max_fps = 3;               // screen share frame rate cap
  ScreenSharePreset camera_max_preset = 4; // highest webcam resolution (H720 = 720p, H1080 = 1080p)
  uint32 camera_max_fps = 5;               // webcam frame rate cap
  uint32 streams_per_room = 6;             // screen shares at once in one room (caps max_streams of the room / workspace)
  uint64 storage_mb = 7;                   // file storage of the workspace, MiB
  uint32 members = 8;                      // workspace members: bots count, guests do not (invites and joins stop at it)
  uint32 sticker_packs = 9;                // live sticker packs of the workspace (ADR-0030)
  uint32 stickers = 10;                    // live stickers over all packs of the workspace
  uint32 bots = 20;                        // bots that are members of the workspace (ADR-0031)
  uint32 audio_tier_max_kbps = 21;         // highest voice quality tier, kbps (8 | 16 | 32 | 64; docs/02 «Битрейт»)
  uint32 boards = 22;                      // live task boards of the workspace (ADR-0042); 0 = no plan limit (≤ 50 always)
  uint32 cameras_per_room = 27;            // webcams at once in one voice room (caps camera_limit of the room / workspace); 0 = no plan limit
  bool caldav_disabled = 23;               // CalDAV sync is not part of the plan (Free); per user it works if any of their workspaces allows it
  bool musician_disabled = 28;             // musician mode (ADR-0052) is not part of the plan (Free): VoiceState.musician refused
  bool checklists_disabled = 29;           // task checklists (ADR-0058 §5) are Team and above: writes refused, reading stays
  bool board_webhooks_disabled = 30;       // board webhooks (ADR-0058 §5) are Business only: setup refused, delivery paused
  bool telephony_disabled = 31;            // telephony SIP (ADR-0046) is Business only: trunk setup, test and calls refused, settings readable
  bool automations_disabled = 32;          // board automations (ADR-0060) are Team and above: new rules refused, rules and Git events do not run
  // Removed flags (an older telephony flag, web apps, approvals per plan): never reuse their numbers.
  reserved 24, 25, 26;
}

// The plan of a workspace as members see it (Workspace.plan).
message WorkspacePlan {
  Plan plan = 1;                           // stored plan; FREE when none was ever set
  PlanLimits limits = 2;                   // effective limits (FREE's when expired)
  google.protobuf.Timestamp valid_until = 3; // unset = no expiry
  WorkspaceIdentityEntitlements identity_entitlements = 5;
  bool expired = 4;                        // valid_until passed: the FREE limits apply
}
