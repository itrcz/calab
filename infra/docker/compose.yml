# Production-like stack on a single host. Secrets live in infra/docker/.env (see .env.example).
# Deploy with ./deploy.sh (renders livekit/livekit.gen.yaml, then `docker compose up`).
# caddy, livekit and api use host network: WebRTC/TURN need direct ports, and the API
# talks to everything over 127.0.0.1. postgres/valkey publish only on 127.0.0.1.
# Files: local volume files_data via the API's fs driver (ADR-0011), no S3 service.
# Meeting recording (ADR-0025): egress writes MP4s to recordings_data, the API uploads them to
# GPTunneL and deletes them; LiveKit and egress talk over Valkey (DB 1).

# Baseline for every service we run (security review L6): no new privileges, no capabilities
# unless listed, read-only root filesystem with tmpfs for scratch space.
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

# Explicit project name: volumes/containers are calaba_*, and --remove-orphans
# never touches other compose projects on a shared host.
name: calaba

services:
  caddy:
    build: ./caddy
    network_mode: host
    restart: unless-stopped
    <<: *hardening
    cap_add: [NET_BIND_SERVICE]    # 80/443 as root without other capabilities
    tmpfs: [/tmp]
    deploy:
      resources:
        limits: { memory: 512m }
    command: caddy run --config /etc/caddy/Caddyfile
    environment:
      # docs/10-branding.md: rtc./turn.<DOMAIN>; the app on APP_HOST (default DOMAIN); optional landing
      - DOMAIN=${DOMAIN}
      - APP_HOST=${APP_HOST:-}
      - LANDING_HOST=${LANDING_HOST:-}
      - DOMAIN_ALT=${DOMAIN_ALT:-}          # extra app host (alias), optional
      - DOMAIN_LEGACY=${DOMAIN_LEGACY:-}    # extra app host (transitional), optional
      - DOMAIN_ALIASES=${DOMAIN_ALIASES:-}  # extra zones: rtc./turn.<zone> served too (docs/06 «Домены»)
      - LANDING_HOST_ALIASES=${LANDING_HOST_ALIASES:-}    # 301 → LANDING_HOST
      - RELEASES_HOST_ALIASES=${RELEASES_HOST_ALIASES:-}  # the same feed (old builds have it baked in)
      # desktop release feed: unset → releases.<DOMAIN>; set to empty → none (/download/ served locally)
      - RELEASES_HOST=${RELEASES_HOST-releases.${DOMAIN}}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-}   # public base URL of the release bucket; empty → /srv/releases
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ../../web:/srv/web:ro              # <repo root on host>/web = web client static (sync.sh: apps/desktop/dist-web or placeholder)
      - ../../releases:/srv/releases:ro    # <repo root on host>/releases = /download/* (sync.sh: apps/desktop/dist-release)
      - ../../landing:/srv/landing:ro      # <repo root on host>/landing = LANDING_HOST static (sync.sh: apps/landing/out)
    logging: *logging

  livekit:
    image: livekit/livekit-server:v1.13@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    network_mode: host
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit/livekit.gen.yaml:/etc/livekit.yaml:ro   # rendered by deploy.sh
    environment:
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      # Valkey password for the redis: section of the config (livekit-server reads REDIS_PASSWORD),
      # so it is not rendered into livekit.gen.yaml. Redis is what connects LiveKit to egress.
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    deploy:
      resources:
        limits: { memory: 4g }
    depends_on:
      valkey: { condition: service_healthy }
    logging: *logging

  # LiveKit Egress (ADR-0025): records meetings — audio-only room composites, which run without
  # Chrome (SDK source, ~0.5 CPU each) — into MP4 files on recordings_data. Talks to LiveKit
  # over Valkey (psrpc, same DB as LiveKit) and joins rooms over the loopback websocket.
  # The API limits concurrent recordings (RECORDING_MAX_CONCURRENT) and stops them at 3 h 58 min
  # (GPTunneL takes ≤ 4 h); the egress ends a file at 3 h 59 min by itself as a safety net. Not read-only: PulseAudio and the handler
  # write under /home/egress; no capabilities (the Chrome sandbox is not used).
  egress:
    image: livekit/egress:v1.14.1@sha256:bf2b648b947349c3e9ff7aa8c718f00378d5c06af7624652a3653318e00333ce   # works with livekit-server 1.13
    network_mode: host
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: "${LIVEKIT_API_KEY}"
        api_secret: "${LIVEKIT_API_SECRET}"
        ws_url: ws://127.0.0.1:7880
        insecure: true
        redis:
          address: 127.0.0.1:6379
          password: "${REDIS_PASSWORD}"
          db: 1
        template_port: 7980
        session_limits:
          file_output_max_duration: 3h59m
        logging:
          level: info
          json: true
    volumes:
      - recordings_data:/out
    deploy:
      resources:
        limits: { cpus: "4", memory: 4g }
    depends_on:
      valkey: { condition: service_healthy }
      recordings-init: { condition: service_completed_successfully }
    logging: *logging

  # LiveKit SIP (telephony, ADR-0046): puts phone lines of outbound calls into rooms. Only with
  # SIP_ENABLED=1 in .env: deploy.sh turns on the compose profile "sip" and renders
  # livekit/sip.yaml.tpl into SIP_CONFIG_BODY (it holds the Valkey password, so it is never
  # written to disk); without the flag nothing starts and no port opens. Talks to LiveKit over
  # Valkey (psrpc, DB 1). Public ports: 5060 udp+tcp (SIP), 10000–10200 udp (RTP) — docs/03.
  # v1.14.0 is built on the same livekit/protocol commit as livekit-server v1.13.7 (psrpc
  # 0.7.6 / 0.7.7); newer sip releases move to protocol 1.52 / psrpc 0.8 — upgrade together.
  sip:
    image: livekit/sip:v1.17.0@sha256:d3c6441eb0918a81ab9e48ba7df6f02c1eebbeace42c963b2c6a6e5418675671
    profiles: [sip]
    network_mode: host
    restart: unless-stopped
    <<: *hardening                 # binds 5060 (> 1024): no capabilities needed
    tmpfs: [/tmp]
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - SIP_CONFIG_BODY=${SIP_CONFIG_BODY:-}   # from deploy.sh; empty = the service refuses to start
    deploy:
      resources:
        limits: { cpus: "2", memory: 512m }
    depends_on:
      valkey: { condition: service_healthy }
      livekit: { condition: service_started }
    logging: *logging

  # One-shot: recordings_data belongs to the API user (distroless nonroot 65532), which creates
  # a world-writable directory per workspace for the egress user (1001) and deletes the files.
  # Reuses the Valkey image (already pulled) for its shell. FOWNER: from the second deploy on,
  # /out belongs to 65532 and root may chmod it only with this capability.
  recordings-init:
    image: valkey/valkey:9-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    network_mode: none
    restart: "no"
    user: "0:0"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    entrypoint: ["sh", "-c", "chmod 0755 /out && chown 65532:65532 /out"]
    volumes:
      - recordings_data:/out
    logging: *logging

  api:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
      args:
        # Stamped into GET /api/version. The host tree has no .git (sync.sh excludes it),
        # so the caller passes them: CALABA_COMMIT=$(git rev-parse --short HEAD).
        VERSION: ${CALABA_VERSION:-dev}
        COMMIT: ${CALABA_COMMIT:-unknown}
    network_mode: host
    restart: unless-stopped
    environment:
      - HTTP_ADDR=127.0.0.1:3000
      - PUBLIC_APP_URL=https://${APP_HOST:-${DOMAIN}}
      - PUBLIC_APP_URL_ALT=${DOMAIN_ALT:+https://${DOMAIN_ALT}}   # empty when no alias host
      # every browser origin of the web client (server: PUBLIC_APP_URLS, comma-separated); empty parts skipped
      - PUBLIC_APP_URLS=https://${APP_HOST:-${DOMAIN}}${DOMAIN_ALT:+,https://${DOMAIN_ALT}}${DOMAIN_LEGACY:+,https://${DOMAIN_LEGACY}}
      - DATABASE_URL=postgres://calaba:${POSTGRES_PASSWORD}@127.0.0.1:5432/calaba
      - REDIS_URL=redis://:${REDIS_PASSWORD}@127.0.0.1:6379
      - REDIS_KEY_PREFIX=${REDIS_KEY_PREFIX:-}   # key/channel namespace for a shared Valkey (docs/06); empty = none
      - JWT_SECRET=${JWT_SECRET}
      # ADR-0054 / release-2.0-identity §13: empty dependencies preserve legacy startup;
      # partial/invalid configuration fails startup. Never derive these keys from JWT_SECRET.
      - IDENTITY_PUBLIC_ORIGIN=${IDENTITY_PUBLIC_ORIGIN:-}
      - IDENTITY_ENCRYPTION_KEYS=${IDENTITY_ENCRYPTION_KEYS:-}
      - IDENTITY_ENCRYPTION_ACTIVE_KID=${IDENTITY_ENCRYPTION_ACTIVE_KID:-}
      - OAUTH_SIGNING_KEYS=${OAUTH_SIGNING_KEYS:-}
      - OAUTH_SIGNING_ACTIVE_KID=${OAUTH_SIGNING_ACTIVE_KID:-}
      - IDENTITY_ENDPOINTS=${IDENTITY_ENDPOINTS:-}
      - IDENTITY_DIRECTORY_HOSTS=${IDENTITY_DIRECTORY_HOSTS:-}
      - IDENTITY_EDITION=${IDENTITY_EDITION:-cloud}
      - IDENTITY_ENTERPRISE_WORKSPACE_IDS=${IDENTITY_ENTERPRISE_WORKSPACE_IDS:-}
      - ACCESS_TOKEN_TTL=${ACCESS_TOKEN_TTL:-24h}      # access JWT; revocation is instant regardless (docs/04 «Auth»)
      - REFRESH_TOKEN_TTL=${REFRESH_TOKEN_TTL:-8760h}  # session (sliding): 1 year without use ends it
      # the rtc. host clients get; after a domain move keep the old one while older desktop builds are in use
      # (their CSP allows only the old family — docs/06 «Домены»)
      - LIVEKIT_URL=wss://${RTC_PUBLIC_HOST:-rtc.${DOMAIN}}
      - LIVEKIT_INTERNAL_URL=http://127.0.0.1:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - STORAGE_DRIVER=fs
      - STORAGE_PATH=/data/files
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      - STORAGE_MAX_TOTAL_BYTES=${STORAGE_MAX_TOTAL_BYTES:-53687091200}   # 50 GiB for all uploads (shared host disk)
      - REGISTRATION_MODE=${REGISTRATION_MODE:-invite}
      # mail (ADR-0023): values only in the stand's .env (never in the repo); empty = mail disabled
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_TLS=${SMTP_TLS:-tls}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - PLAN_FREE_LIMITS=${PLAN_FREE_LIMITS:-}          # ADR-0024; empty = built-in
      - PLAN_TEAM_LIMITS=${PLAN_TEAM_LIMITS:-}
      - PLAN_BUSINESS_LIMITS=${PLAN_BUSINESS_LIMITS:-}
      - PLAN_CONTACT_URL=${PLAN_CONTACT_URL:-}
      - PLAN_CONTACT_EMAIL=${PLAN_CONTACT_EMAIL:-it@gptunnel.ai}
      - SUPERADMIN_EMAILS=${SUPERADMIN_EMAILS:-}
      # meeting recording (ADR-0025)
      - GPTUNNEL_API_URL=${GPTUNNEL_API_URL:-https://gptunnel.ru}
      - GPTUNNEL_WEB_URL=${GPTUNNEL_WEB_URL:-https://gptunnel.ru}
      - RECORDING_MAX_CONCURRENT=${RECORDING_MAX_CONCURRENT:-3}
      - RECORDING_KEEP_DAYS=${RECORDING_KEEP_DAYS:-30}
      - RECORDINGS_PATH=/data/recordings
      - RECORDING_EGRESS_DIR=/out
      # Bot API limits per bot (ADR-0031)
      - BOT_RATE_PER_SEC=${BOT_RATE_PER_SEC:-30}
      - BOT_MESSAGES_PER_MIN=${BOT_MESSAGES_PER_MIN:-20}
    <<: *hardening                 # distroless nonroot (65532); writes only to /data/files, /data/recordings
    tmpfs: [/tmp]
    volumes:
      - files_data:/data/files
      - recordings_data:/data/recordings
    deploy:
      resources:
        limits: { memory: 1g }
    healthcheck:   # distroless has no curl: the binary probes its own /readyz (postgres + valkey)
      test: ["CMD", "/server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      recordings-init: { condition: service_completed_successfully }
    logging: *logging

  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873   # PG 18: built-in uuidv7()
    restart: unless-stopped
    <<: *hardening
    user: "70:70"                  # run as postgres directly: no gosu, no capabilities needed
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=70,gid=70,mode=2775
    environment:
      - POSTGRES_USER=calaba
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=calaba
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql   # PG 18 images keep PGDATA in a versioned subdir here
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calaba"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { memory: 2g }
    logging: *logging

  # Valkey (BSD-3-Clause, Redis-compatible) instead of Redis 7.4+ (RSAL/SSPL). ≥ 9.0: hash
  # field TTL (HEXPIRE) for presence; the API checks the version at startup. Clients still
  # speak the Redis protocol (REDIS_URL, rueidis).
  valkey:
    image: valkey/valkey:9-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    restart: unless-stopped
    <<: *hardening
    user: "999:1000"               # valkey
    tmpfs: [/tmp]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    # Password goes into a tmpfs config file, not argv (visible in `ps` on the shared host).
    # noeviction: sessions, revocations and gateway buffers must never be silently dropped.
    command:
      - sh
      - -c
      - |
        umask 077
        pw=$$(printf '%s' "$$REDIS_PASSWORD" | sed 's/[\\"]/\\&/g')   # escape \ and " for the config
        printf 'requirepass "%s"\n' "$$pw" > /tmp/auth.conf
        exec valkey-server /tmp/auth.conf --save 60 1 --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      # New volume: Valkey does not read Redis 7.4 persistence files (RDB 12). Only transient
      # state lives here (revocation markers, limits, voice, presence, gateway buffers).
      - valkey_data:/data
    deploy:
      resources:
        limits: { memory: 768m }
    healthcheck:
      test: ["CMD-SHELL", "VALKEYCLI_AUTH=\"$$REDIS_PASSWORD\" valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  valkey_data:
  files_data:   # uploaded files (API fs driver); back up offsite, see docs/06
  recordings_data:   # meeting recordings until GPTunneL has them (≤ 7 days); not backed up
