syntax = "proto3";
package calaba.v1;

import "google/protobuf/timestamp.proto";
import "calaba/v1/achievement.proto";
import "calaba/v1/plan.proto";
import "calaba/v1/user.proto";
import "calaba/v1/workspace.proto";

// Superadmin API (ADR-0024): /api/admin/*, only for users whose email is in
// SUPERADMIN_EMAILS (Me.is_superadmin); everyone else gets 404. Own rate limit (60/min).

// Usage of a workspace (admin API).
message WorkspaceUsage {
  uint32 members = 1;      // members without guests
  uint32 rooms = 2;        // live rooms
  uint64 storage_mb = 3;   // stored files, MiB (rounded up)
  uint64 storage_bytes = 4;
  google.protobuf.Timestamp last_activity = 5; // newest message; unset = none
  uint32 bots = 6;          // bots that are members (they count as members too)
  uint32 sticker_packs = 7; // live sticker packs
}

// A workspace as the superadmin sees it.
message AdminWorkspace {
  Workspace workspace = 1; // with plan
  User owner = 2;
  string owner_email = 3;
  WorkspaceUsage usage = 4;
  string plan_note = 5;
  string plan_updated_by = 6; // user id; empty = never set
  google.protobuf.Timestamp plan_updated_at = 7;
  // Suspension (workspace.suspension has when / why): who suspended it.
  string suspended_by = 8;       // user id
  string suspended_by_email = 9;
}

// GET /api/admin/workspaces?q= (superadmin; others get 404). q matches name, slug or the
// owner's email (substring, case-insensitive); empty = newest workspaces. At most 50.
message AdminSearchWorkspacesResponse {
  repeated AdminWorkspace workspaces = 1;
}

// GET /api/admin/workspaces/{id}
message AdminGetWorkspaceResponse {
  AdminWorkspace workspace = 1;
}

// PUT /api/admin/workspaces/{id}/plan. limits only with PLAN_CUSTOM (stored as written,
// 0 = no limit); FREE and TEAM take their limits from the server config. valid_until must be
// in the future (unset = no expiry). Every change is logged; WORKSPACE_UPDATE follows.
message AdminSetPlanRequest {
  Plan plan = 1;
  PlanLimits limits = 2;
  google.protobuf.Timestamp valid_until = 3;
  string note = 4; // ≤ 500 characters
}

message AdminSetPlanResponse {
  AdminWorkspace workspace = 1;
}

// One plan change (GET /api/admin/workspaces/{id}/plan/log, newest first, ≤ 100).
message PlanLogEntry {
  string id = 1;
  string workspace_id = 2;
  string actor_id = 3;
  string actor_email = 4;
  Plan plan = 5;
  PlanLimits limits = 6; // as set (custom) or the plan's limits at that time
  google.protobuf.Timestamp valid_until = 7;
  string note = 8;
  google.protobuf.Timestamp created_at = 9;
}

message AdminPlanLogResponse {
  repeated PlanLogEntry entries = 1;
}

// PUT /api/admin/workspaces/{id}/suspension. suspended=true needs a reason (1..500 characters;
// shown to the owner / admins); false resumes (the reason is ignored). Idempotent. Every change
// is logged; WORKSPACE_UPDATE follows (Workspace.suspension). Suspending disconnects everyone
// from the workspace's voice rooms.
message AdminSetSuspensionRequest {
  bool suspended = 1;
  string reason = 2;
}

message AdminSetSuspensionResponse {
  AdminWorkspace workspace = 1;
}

// An achievement of the host catalog as the superadmin sees it (ADR-0061).
message AdminAchievement {
  Achievement achievement = 1;
  uint32 granted_count = 2;    // live grants (revoked ones are not counted)
  uint32 workspaces_count = 3; // workspaces with a live grant of it
}

// GET /api/admin/achievements: the whole catalog by position, archived ones included.
// POST /api/admin/achievements (multipart/form-data: "image", "title", "description") ->
// Achievement. The image is a PNG or WebP with an alpha channel and a transparent background
// (else 422 reason IMAGE_NEEDS_ALPHA), at most 4 MB, each side 128..2048 px; the server crops it
// to the visible part (+4 % margin) and makes a 512x512 WebP with alpha. title 1..60, description
// 0..200 characters. A new achievement goes to the end of the catalog.
// PATCH /api/admin/achievements/{id} (multipart/form-data, every field optional: "title",
// "description", "position", "archived" = true|false, "image") -> Achievement.
// DELETE /api/admin/achievements/{id} -> 204; 409 reason ACHIEVEMENT_IN_USE once it was granted
// (revoked grants included: archive it instead).
message AdminListAchievementsResponse {
  repeated AdminAchievement achievements = 1;
}
