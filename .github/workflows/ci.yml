name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  proto:
    name: buf lint / breaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          setup_only: true
      - run: buf lint
      - name: buf breaking (against main)
        if: github.event_name == 'pull_request'
        run: buf breaking --against ".git#branch=origin/main"

  gen-drift:
    name: generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          setup_only: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: apps/server/go.sum
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # apps/desktop postinstall compiles uiohook-napi (electron-rebuild): needs the X11 headers on Linux
      - name: X11 headers for uiohook
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-dev libxtst-dev libxt-dev libxext-dev libxinerama-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxkbfile-dev libxrandr-dev
      - run: pnpm install --frozen-lockfile   # provides protoc-gen-es (local buf plugin)
      - uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          sqlc-version: '1.31.1'
      - run: make gen
      - name: check drift
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
          git diff --exit-code

  go:
    name: go vet / test / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: apps/server/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: apps/server
          args: --config ../../.golangci.yml --build-tags integration
      # THIRD-PARTY-NOTICES.txt ships in the image; it must match go.mod (fails on GPL/LGPL/AGPL too)
      - name: third-party notices are up to date
        working-directory: .
        run: make third-party-notices && git diff --exit-code

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: apps/server/go.sum
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  go-integration:
    name: go integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: calaba
          POSTGRES_PASSWORD: calaba
          POSTGRES_DB: calaba
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U calaba" --health-interval 2s --health-timeout 2s --health-retries 20
      valkey:   # same image/digest as infra/docker/compose.yml (ADR-0017); speaks the Redis protocol, has HEXPIRE
        image: valkey/valkey:9-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 2s --health-timeout 2s --health-retries 20
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: apps/server/go.sum
      - name: start LiveKit (dev mode; services cannot pass --dev)
        run: |
          docker run -d --name livekit -p 7880:7880 -p 7881:7881 -p 7882:7882/udp \
            livekit/livekit-server:v1.13@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3 --dev --bind 0.0.0.0
          for i in $(seq 1 30); do curl -sf http://localhost:7880 >/dev/null && break; sleep 1; done
      - run: go test -race -tags integration -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://calaba:calaba@localhost:5432/calaba
          TEST_REDIS_URL: redis://localhost:6379/15

  ts:
    name: pnpm typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # apps/desktop postinstall compiles uiohook-napi (electron-rebuild): needs the X11 headers on Linux
      - name: X11 headers for uiohook
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-dev libxtst-dev libxt-dev libxext-dev libxinerama-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxkbfile-dev libxrandr-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test

  landing:
    name: landing lint / typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # apps/desktop postinstall compiles uiohook-napi (electron-rebuild): needs the X11 headers on Linux
      - name: X11 headers for uiohook
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-dev libxtst-dev libxt-dev libxext-dev libxinerama-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxkbfile-dev libxrandr-dev
      - run: pnpm install --frozen-lockfile
      # pnpm runs one script per invocation, hence three steps
      - run: pnpm -F @calaba/landing lint
      - run: pnpm -F @calaba/landing typecheck
      - run: pnpm -F @calaba/landing build
      - run: test -f apps/landing/out/index.html
