name: images

# Production images of a release, built after a green `ci` run of a release tag (v*), the same moment
# release.sh used to update the stand: the server and web version is the tag.
#
#   1. api: build apps/server/Dockerfile at the exact commit `ci` tested.
#   2. web: build the web client and the landing (as release.sh does) into infra/docker/web-image:
#      Caddy, its behind-proxy config (infra/docker/caddy) and the static files; the config is validated
#      in the built image before the push.
#   3. Push both to the production registry, Harbor cr.shds.io/calab (VK Cloud), with a Harbor robot that
#      may only push to the calab project.
#   4. File one GitHub deployment `calab-prod` whose payload holds both image digests, so the API and
#      the web of a release roll out together.
#   5. agents: build apps/server/Dockerfile.sipreg and Dockerfile.ivr and push them the same way (tag = the
#      commit SHA, digest in the run summary); not part of the deployment — devops rolls them out.
#
# The production cluster pulls those deployments itself and rolls the digests out (it accepts only
# deployments created by this workflow for commits on main). This workflow has no access to the
# cluster. Rollback: re-run an older successful run of this workflow.
#
# Repository secrets (masked in the public logs): HARBOR_USER / HARBOR_PASSWORD — Harbor robot with push to
# the calab project of cr.shds.io. cr.shds.io resolves to a private address publicly; the VK ingress
# publishes only the calab and gpu projects, so each job pins it in /etc/hosts.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: ['v*']     # release tags; workflow_run runs on the default branch, so the OIDC subject stays main

permissions: {}

# One run at a time, newest pending wins: deployments are filed in commit order, so an older build
# can never land after a newer one.
concurrency:
  group: images
  cancel-in-progress: false

env:
  SHA: ${{ github.event.workflow_run.head_sha }}
  TAG: ${{ github.event.workflow_run.head_branch }}

jobs:
  api:
    if: >-
      github.repository == 'itrcz/calab' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      REGISTRY: cr.shds.io/calab
      HARBOR_USER: ${{ secrets.HARBOR_USER }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - name: build
        run: |
          test -n "$HARBOR_USER" && test -n "$HARBOR_PASSWORD" || { echo "::error::HARBOR_USER / HARBOR_PASSWORD are not set"; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release tag: $TAG"; exit 1; }
          docker build -f apps/server/Dockerfile \
            --build-arg VERSION="${TAG#v}" --build-arg COMMIT="${SHA:0:12}" \
            -t "$REGISTRY/api:$SHA" .

      - name: registry login (Harbor)
        run: |
          echo "138.16.203.140 cr.shds.io" | sudo tee -a /etc/hosts >/dev/null
          printf '%s' "$HARBOR_PASSWORD" | docker login cr.shds.io --username "$HARBOR_USER" --password-stdin

      - name: push
        id: push
        run: |
          # Harbor commits a big layer to S3 slower than docker waits: the push fails though the layer has
          # landed; a retry finds it and gets to the tag.
          for i in 1 2 3; do docker push -q "$REGISTRY/$IMAGE:$SHA" && break; [ "$i" = 3 ] && exit 1; sleep 30; done
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY/$IMAGE:$SHA" | sed 's/.*@//')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker logout cr.shds.io
        env:
          IMAGE: api

  web:
    if: >-
      github.repository == 'itrcz/calab' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      REGISTRY: cr.shds.io/calab
      HARBOR_USER: ${{ secrets.HARBOR_USER }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # apps/desktop postinstall compiles uiohook-napi (electron-rebuild): needs the X11 headers on Linux
      - name: X11 headers for uiohook
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-dev libxtst-dev libxt-dev libxext-dev libxinerama-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxkbfile-dev libxrandr-dev

      - name: build web client and landing (as release.sh)
        run: |
          test -n "$HARBOR_USER" && test -n "$HARBOR_PASSWORD" || { echo "::error::HARBOR_USER / HARBOR_PASSWORD are not set"; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release tag: $TAG"; exit 1; }
          pnpm install --frozen-lockfile
          VERSION="${TAG#v}" pnpm -F @calaba/desktop build:web
          pnpm -F @calaba/landing build
          test -f apps/desktop/dist-web/index.html && test -f apps/landing/out/index.html
          ctx="$RUNNER_TEMP/web-image"
          mkdir -p "$ctx"
          cp -R apps/desktop/dist-web "$ctx/web"
          cp -R apps/landing/out "$ctx/landing"
          mkdir "$ctx/caddy"
          cp infra/docker/caddy/Caddyfile.behind-proxy infra/docker/caddy/sites.caddy infra/docker/caddy/log.caddy \
            infra/docker/caddy/entrypoint.sh "$ctx/caddy/"
          find "$ctx" -name '*.map' -delete   # source maps are not published (as sync.sh)
          docker build -f infra/docker/web-image/Dockerfile -t "$REGISTRY/web:$SHA" "$ctx"
          # The shipped config must parse with every optional site present (test hosts only, no listeners).
          docker run --rm -e DOMAIN=calab.test -e APP_HOST=app.calab.test -e LANDING_HOST=calab.test \
            -e LANDING_HOST_ALIASES=www.calab.test -e LANDING_HOST_MIRRORS=calab2.test \
            -e RELEASES_HOST=releases.calab.test -e RELEASES_HOST_ALIASES=releases.calab2.test \
            -e S3_PUBLIC_URL=https://storage.example.test/bucket -e API_UPSTREAM=api:3000 \
            "$REGISTRY/web:$SHA" caddy validate --config /etc/caddy/Caddyfile
          # Same config, but with APP_LINKS_IOS/APP_LINKS_ANDROID set (DEV-4947 review follow-up):
          # entrypoint.sh then splices the universal-link JSON `respond` blocks in, which the run
          # above never exercises — parse those in CI too, not first against prod.
          docker run --rm -e DOMAIN=calab.test -e APP_HOST=app.calab.test -e LANDING_HOST=calab.test \
            -e LANDING_HOST_ALIASES=www.calab.test -e LANDING_HOST_MIRRORS=calab2.test \
            -e RELEASES_HOST=releases.calab.test -e RELEASES_HOST_ALIASES=releases.calab2.test \
            -e S3_PUBLIC_URL=https://storage.example.test/bucket -e API_UPSTREAM=api:3000 \
            -e APP_LINKS_IOS="ABCDE12345.test.calab" \
            -e APP_LINKS_ANDROID="test.calab:$(printf 'AA:%.0s' $(seq 1 31))AA" \
            "$REGISTRY/web:$SHA" caddy validate --config /etc/caddy/Caddyfile

      - name: registry login (Harbor)
        run: |
          echo "138.16.203.140 cr.shds.io" | sudo tee -a /etc/hosts >/dev/null
          printf '%s' "$HARBOR_PASSWORD" | docker login cr.shds.io --username "$HARBOR_USER" --password-stdin

      - name: push
        id: push
        run: |
          # Harbor commits a big layer to S3 slower than docker waits: the push fails though the layer has
          # landed; a retry finds it and gets to the tag.
          for i in 1 2 3; do docker push -q "$REGISTRY/$IMAGE:$SHA" && break; [ "$i" = 3 ] && exit 1; sleep 30; done
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY/$IMAGE:$SHA" | sed 's/.*@//')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker logout cr.shds.io
        env:
          IMAGE: web

  # The inbound-call agents (ADR-0117 calab-ivr, ADR-0121/0125 calab-sipreg): pushed as cr.shds.io/calab/ivr:<sha>
  # and cr.shds.io/calab/sipreg:<sha>, rolled out by devops, not by the calab-prod
  # deployment: they are single-replica agents outside the api/web rollout, and a failed agent build does
  # not hold back a release.
  agents:
    if: >-
      github.repository == 'itrcz/calab' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [sipreg, ivr]
    permissions:
      contents: read
    env:
      REGISTRY: cr.shds.io/calab
      HARBOR_USER: ${{ secrets.HARBOR_USER }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - name: build
        run: |
          test -n "$HARBOR_USER" && test -n "$HARBOR_PASSWORD" || { echo "::error::HARBOR_USER / HARBOR_PASSWORD are not set"; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release tag: $TAG"; exit 1; }
          docker build -f "apps/server/Dockerfile.$IMAGE" -t "$REGISTRY/$IMAGE:$SHA" .

      - name: registry login (Harbor)
        run: |
          echo "138.16.203.140 cr.shds.io" | sudo tee -a /etc/hosts >/dev/null
          printf '%s' "$HARBOR_PASSWORD" | docker login cr.shds.io --username "$HARBOR_USER" --password-stdin

      - name: push
        run: |
          # Harbor commits a big layer to S3 slower than docker waits: the push fails though the layer has
          # landed; a retry finds it and gets to the tag.
          for i in 1 2 3; do docker push -q "$REGISTRY/$IMAGE:$SHA" && break; [ "$i" = 3 ] && exit 1; sleep 30; done
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY/$IMAGE:$SHA" | sed 's/.*@//')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest"; exit 1; }
          docker logout cr.shds.io
          # The digest for devops to pin.
          echo "$IMAGE @ $TAG: \`$digest\` (tag \`$SHA\`)" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [api, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      deployments: write   # file the calab-prod deployment
    steps:
      - name: file deployment
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ needs.api.outputs.digest }}
          WEB: ${{ needs.web.outputs.digest }}
        run: |
          jq -n --arg sha "$SHA" --arg api "$API" --arg web "$WEB" '{
              ref: $sha, environment: "calab-prod", task: "deploy",
              auto_merge: false, required_contexts: [],
              production_environment: true, payload: {api: $api, web: $web},
              description: "api + web images"
            }' | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '"deployment \(.id) for \(.sha[0:12])"'
