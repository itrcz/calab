syntax = "proto3";
package calaba.v1;

import "google/protobuf/timestamp.proto";
import "calaba/v1/user.proto";

// Workspace calendar and meetings (ADR-0038). Messages are named CalendarEvent* (not Event*):
// a TS export named `Event` would shadow the DOM Event type in every module importing it.
//
// Times are UTC instants; clients show them in the viewer's zone. An all-day event starts and
// ends at midnight of its `tz` (ends_at exclusive: a one-day event lasts 24 h of that zone).
//
// Visibility: a member (not a guest) sees an event with a room when they can VIEW_ROOM that
// room, and any event they organize or attend. Guests see no calendar, only the meeting active
// in a room they can view (WorkspaceSnapshot.active_events, ROOM_EVENT_ACTIVE / ENDED,
// GET /api/events/{id}) without its attendees (empty list, counts only). Bots (ADR-0031,
// ADR-0051) are never attendees: they see the events they organize and those of rooms they
// view, and edit by the same rules as people.
//
// Editing: the organizer; else MANAGE_ROOM in the event's room, or MANAGE_EVENTS (ADR-0048) for
// an event without a room or in a room the editor sees.

// An attendee's answer (informational, ADR-0038 §3).
enum AttendeeStatus {
  ATTENDEE_STATUS_UNSPECIFIED = 0;
  ATTENDEE_STATUS_PENDING = 1;
  ATTENDEE_STATUS_ACCEPTED = 2;
  ATTENDEE_STATUS_DECLINED = 3;
  ATTENDEE_STATUS_MAYBE = 4;
}

// Repeat of a series (a subset of RFC 5545 RRULE, ADR-0038 §1).
enum EventRepeat {
  EVENT_REPEAT_UNSPECIFIED = 0; // no repeat
  EVENT_REPEAT_DAILY = 1;
  EVENT_REPEAT_WEEKLY = 2;
  EVENT_REPEAT_BIWEEKLY = 3;
  EVENT_REPEAT_MONTHLY = 4; // the same day of the month; months without that day are skipped
}

// One attendee: a member of the workspace (user_id) or an external address (email,
// ADR-0038 «Дополнение»). Exactly one of the two is set.
message CalendarEventAttendee {
  string user_id = 1;
  bool required = 2; // false = optional («необязательно»)
  AttendeeStatus status = 3;
  google.protobuf.Timestamp responded_at = 4; // unset while PENDING
  // External attendee's address: in full for the organizer, the attendees and those who may
  // edit the event; masked ("a***@example.com") for other viewers; empty for bots that may
  // not edit it.
  string email = 5;
}

message CalendarEventCounts {
  uint32 accepted = 1;
  uint32 declined = 2;
  uint32 maybe = 3;
  uint32 pending = 4;
}

// A meeting, or one occurrence of a series. In lists (GET …/events) every occurrence in the
// window is one CalendarEvent with its own starts_at / ends_at and occurrence_at; the series
// itself (GET /api/events/{id}, gateway events) has occurrence_at unset and the first
// occurrence's times.
message CalendarEvent {
  string id = 1;
  string workspace_id = 2;
  string room_id = 3; // voice room of the meeting; empty = none
  string title = 4;   // 1..120 characters
  string description = 5; // ≤ 4000 characters, markdown-lite
  google.protobuf.Timestamp starts_at = 6;
  google.protobuf.Timestamp ends_at = 7;
  bool all_day = 8;
  string tz = 9; // IANA zone of the organizer: repeats keep its wall-clock time across DST
  string organizer_id = 10;
  bool record = 11; // offer the organizer to record the meeting (ADR-0038 §6)
  EventRepeat repeat = 12;
  google.protobuf.Timestamp repeat_until = 13; // unset = no end (with a repeat)
  google.protobuf.Timestamp occurrence_at = 14; // start of this occurrence (lists, reminders)
  google.protobuf.Timestamp cancelled_at = 15;   // set in EVENT_DELETE (the whole event cancelled)
  // Recording of this occurrence (ADR-0025) started by the organizer in the meeting window;
  // empty = none. Its card / transcript: GET /api/rooms/{room_id}/recordings/{id}/transcript.
  string recording_id = 16;
  // The caller's own answer; UNSPECIFIED when the caller is not an attendee and in gateway
  // events (clients take it from attendees[]).
  AttendeeStatus my_status = 17;
  CalendarEventCounts counts = 18;
  repeated CalendarEventAttendee attendees = 19;
  // Occurrences of the series cancelled one by one (DELETE /api/events/{id}?occurrence=…).
  repeated google.protobuf.Timestamp cancelled_occurrences = 20;
  google.protobuf.Timestamp created_at = 21;
  google.protobuf.Timestamp updated_at = 22;
  uint32 sequence = 23; // iCalendar SEQUENCE: +1 on every change mailed to the attendees
  // Every external attendee got a guest link to the room (ADR-0016). Links are made only when
  // the organizer may create room links (MANAGE_ROOM in the room, the workspace not suspended).
  // False with a room and external attendees = they were invited without a link: the client
  // says so («гостевая ссылка недоступна»).
  bool guest_links = 24;
  // The client's rights on this event (computed for the caller; false in gateway events).
  bool can_edit = 25;
}

// Attendee as sent by the client: a member (user_id) or an external address (email).
message CalendarEventAttendeeInput {
  string user_id = 1;
  string email = 2;
  bool required = 3;
}

// GET /api/workspaces/{id}/events?from=<RFC 3339>&to=<RFC 3339> — occurrences overlapping
// [from, to) that the caller may see, earliest first. The window is at most 62 days; guests → 403.
message ListCalendarEventsResponse {
  repeated CalendarEvent events = 1;
}

// POST /api/workspaces/{id}/events → 201 CalendarEventResponse. A member, not a guest.
// Attendees: ≤ 100 in total, ≤ 20 external addresses; members of the workspace, not bots
// or guests; the organizer is always an attendee (accepted) and need not be listed, except a
// bot organizer (ADR-0051), which never attends: mail goes out on its behalf, no guest links.
message CreateCalendarEventRequest {
  string room_id = 1; // a voice room of the workspace the caller can see; empty = none
  string title = 2;
  string description = 3;
  google.protobuf.Timestamp starts_at = 4;
  google.protobuf.Timestamp ends_at = 5; // > starts_at, at most 7 days later
  bool all_day = 6; // starts_at / ends_at are rounded to midnight of tz
  string tz = 7;    // IANA zone; empty = the caller's profile zone, else UTC
  bool record = 8;
  EventRepeat repeat = 9;
  google.protobuf.Timestamp repeat_until = 10;
  repeated CalendarEventAttendeeInput attendees = 11;
}

// PATCH /api/events/{id} → CalendarEventResponse. Unset fields are unchanged; `attendees`,
// when `set_attendees` is true, replaces the list (kept answers of those who stay). A change
// of time, room, title, description or repeat mails the attendees again (SEQUENCE + 1).
// Editing a series changes every occurrence (v1).
message UpdateCalendarEventRequest {
  optional string room_id = 1; // "" = no room
  optional string title = 2;
  optional string description = 3;
  google.protobuf.Timestamp starts_at = 4;
  google.protobuf.Timestamp ends_at = 5;
  optional bool all_day = 6;
  optional string tz = 7;
  optional bool record = 8;
  optional EventRepeat repeat = 9;
  google.protobuf.Timestamp repeat_until = 10;
  bool clear_repeat_until = 11;
  bool set_attendees = 12;
  repeated CalendarEventAttendeeInput attendees = 13;
}

// POST, GET /api/events/{id}, PATCH. A guest of the workspace (ADR-0016) gets GET only for
// the meeting active in a room they can view: that occurrence, attendees empty, can_edit false,
// no recording_id; otherwise 404. PATCH / DELETE / rsvp → 403 for a guest who sees the room.
message CalendarEventResponse {
  CalendarEvent event = 1;
}

// DELETE /api/events/{id} → 204: cancels the event (EVENT_DELETE, CANCEL mail).
// DELETE /api/events/{id}?occurrence=<RFC 3339 start> cancels that occurrence of a series only
// (EVENT_UPDATE with it in cancelled_occurrences, the attendees get the updated invitation).

// PUT /api/events/{id}/rsvp → CalendarEventResponse. The caller must be an attendee.
message RsvpCalendarEventRequest {
  AttendeeStatus status = 1; // ACCEPTED | DECLINED | MAYBE
}

// GET /api/me/events/today?tz=<IANA> — the caller's upcoming meetings of today (in tz, else the
// profile zone, else UTC) in all their workspaces, for the calendar icon: occurrences that end
// after now, not declined by the caller, which they organize or attend.
message TodayCalendarEventsResponse {
  uint32 count = 1;
  repeated CalendarEvent events = 2;
}

// External attendee's answer without an account (ADR-0038 «Дополнение»). The invitation mail
// has three links https://<APP_HOST>/e/<id>/rsvp?t=<token>, one per answer; the web page reads
// the event with GET /api/event-rsvp?t=… and answers with POST /api/event-rsvp. The token is
// signed (HMAC) and carries the event, the address, the answer and its expiry (the end of the
// event, or of the series); 410 EVENT_OVER after it, 404 for a bad signature or an address no
// longer invited. POST is idempotent. Public routes (no login).
//
// Deep link for invited people without an account («Диплинки для приглашённых»): the mail of an
// external attendee links the meeting (main button, invite.ics URL) as
// https://<APP_HOST>/e/<id>?t=<view token>. A view token is signed the same way with the answer
// `view`, valid until the end of the meeting (series) + 1 h; GET accepts it (status UNSPECIFIED),
// POST with it → 400 (answers need an answer token: take accept_token / maybe_token /
// decline_token of the response). Other attendees are never listed (privacy, ADR-0038).
message EventRsvpTokenRequest {
  string token = 1;
}

message EventRsvpTokenResponse {
  string event_id = 1;
  string title = 2;
  google.protobuf.Timestamp starts_at = 3; // next occurrence (or the event's start)
  google.protobuf.Timestamp ends_at = 4;
  bool all_day = 5;
  string tz = 6;
  string organizer_name = 7;
  string workspace_name = 8;
  AttendeeStatus status = 9; // the answer of the link (after POST: stored); UNSPECIFIED for a view token
  string email = 10;
  bool cancelled = 11;
  string description = 12; // markdown-lite, as stored
  string room_name = 13;   // empty = no room
  AttendeeStatus my_status = 14; // the stored answer of this address
  // Signed answer tokens of this address (POST /api/event-rsvp {token}); empty once the meeting
  // is over or cancelled.
  string accept_token = 15;
  string maybe_token = 16;
  string decline_token = 17;
  // The guest link of this address into the meeting's room (https://<APP_HOST>/r/<code>);
  // empty without a room or when links are unavailable (no MANAGE_ROOM of the organizer,
  // revoked). It works in [guest_from, guest_until): «ссылка станет активной за 15 минут до
  // начала».
  string guest_url = 18;
  google.protobuf.Timestamp guest_from = 19;
  google.protobuf.Timestamp guest_until = 20;
  EventRepeat repeat = 21;
  google.protobuf.Timestamp repeat_until = 22;
  string organizer_email = 23; // only a confirmed address, else empty
}

// ---- free / busy and finding a time (ADR-0041) ----

// What makes a person busy.
enum BusyKind {
  BUSY_KIND_UNSPECIFIED = 0;
  BUSY_KIND_MEETING = 1;  // a Calab meeting they organize or attend (answer not «declined»)
  BUSY_KIND_EXTERNAL = 2; // their connected CalDAV calendar (no id; a title only by its share_level)
}

// One busy interval (an occurrence; intervals of a person may overlap).
message BusyInterval {
  google.protobuf.Timestamp starts_at = 1;
  google.protobuf.Timestamp ends_at = 2;
  // The meeting, only when the caller may see it in this workspace (ADR-0038 §2); empty =
  // just «busy».
  string event_id = 3;
  BusyKind kind = 4;
  // An all-day meeting / external event: busy from midnight to midnight of the person's zone.
  bool all_day = 5;
  // BUSY_KIND_EXTERNAL only, by the owner's CalDavAccount.share_level (ADR-0045 §4): the event's
  // title at TITLE / DETAILS, else empty. Never its place, organizer or link.
  string title = 6;
  // BUSY_KIND_EXTERNAL at DETAILS only: the event's attendees who are members of this workspace
  // (matched by a confirmed e-mail; not guests or bots). Other addresses are never shared.
  repeated string attendee_user_ids = 7;
}

message FreeBusyUser {
  string user_id = 1;
  string timezone = 2; // IANA zone of the person, "UTC" without one
  WorkHours work_hours = 3;
  repeated BusyInterval busy = 4; // overlapping [from, to), earliest first
}

// GET /api/workspaces/{id}/freebusy?users=<id,id,…>&from=<RFC 3339>&to=<RFC 3339> — busy
// intervals of ≤ 20 members of the workspace (not guests or bots) in a window of ≤ 14 days.
// Members only: guests → 403; a user who is not a member → 422 (field users). Bots
// (ADR-0051) get the busy time only: no title or attendees of external events.
// Meetings of every workspace of the person count (no id outside this one). 60 per minute.
message FreeBusyResponse {
  repeated FreeBusyUser users = 1; // in the order asked
}

// POST /api/workspaces/{id}/freebusy/suggest → SuggestSlotsResponse: up to 10 earliest
// windows of duration_min (5..1440) on a 15-minute grid inside [from, to) (≤ 14 days; not
// before now) where every person is free and, with room_id, the room has no other meeting.
// within_work_hours: only where the working hours of all of them intersect; 409
// NO_COMMON_HOURS when they do not intersect in the window at all. 30 per minute.
message SuggestSlotsRequest {
  repeated string users = 1; // 1..20 members, as in freebusy
  uint32 duration_min = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
  bool within_work_hours = 5;
  string room_id = 6; // a voice room of the workspace the caller can see; empty = none
}

message Slot {
  google.protobuf.Timestamp starts_at = 1;
  google.protobuf.Timestamp ends_at = 2;
}

message SuggestSlotsResponse {
  repeated Slot slots = 1; // earliest first; empty = no common free window
}

// ---- the user's CalDAV calendar (ADR-0041 §4) ----
//
// One account per user (not guests or bots: 403). The password (an app-specific password) is
// stored encrypted and never returned. Every answer is CalDavAccountResponse:
// GET /api/me/caldav → the account (absent = not connected).
// POST /api/me/caldav ConnectCalDavRequest → discovery (https only, public addresses, 10 s,
// no redirects) and the account with its calendars; 422 url / password when the server
// cannot be used; 5 per hour. Connecting again with the same URL and username keeps the
// chosen calendar.
// PUT /api/me/caldav UpdateCalDavRequest → the account; 404 without one; 422 for a calendar
// not in calendars.
// PATCH /api/me/caldav SetCalDavShareRequest → the account; 404 without one; 422 for UNSPECIFIED
// (ADR-0045 §2: what colleagues see of the imported events in free / busy).
// DELETE /api/me/caldav → 204; the imported busy time is removed.
// POST /api/me/caldav/sync → the account after an import now; 422 without a calendar or with
// import off; once per minute.
// Import (every CALDAV_SYNC_INTERVAL, default 15 min) keeps the events of −1…+30 days: times,
// and (ADR-0045 §1) title, place, attendees, organizer and a link; never the description. Push puts the user's meetings into the calendar as <calendar_href><event id>.ics.

message CalDavCalendar {
  string href = 1; // absolute URL of the collection
  string name = 2;
  string color = 3; // "#RRGGBB" or empty
}

message CalDavAccount {
  string url = 1;
  string username = 2;
  string calendar_href = 3; // the chosen calendar (one of calendars); empty = none yet
  bool import = 4; // import busy time (default true)
  bool push = 5;   // put the user's meetings into the calendar (default false)
  google.protobuf.Timestamp last_sync_at = 6;
  string last_error = 7; // of the last import or push; empty = fine
  repeated CalDavCalendar calendars = 8; // event calendars found at connection
  CalDavShareLevel share_level = 9; // what colleagues see (ADR-0045 §2); BUSY by default
}

// What colleagues see of the imported events in free / busy (ADR-0045 §2, §4).
enum CalDavShareLevel {
  CAL_DAV_SHARE_LEVEL_UNSPECIFIED = 0;
  CAL_DAV_SHARE_LEVEL_BUSY = 1;    // only «busy»
  CAL_DAV_SHARE_LEVEL_TITLE = 2;   // the title
  CAL_DAV_SHARE_LEVEL_DETAILS = 3; // the title and the attendees who are members of the workspace
}

message SetCalDavShareRequest {
  CalDavShareLevel share_level = 1;
}

message CalDavAccountResponse {
  CalDavAccount account = 1;
  bool plan_locked = 2; // none of the caller's workspace plans includes CalDAV: sync is stopped, the stored account is kept
}

message ConnectCalDavRequest {
  string url = 1; // https URL of the server or the principal
  string username = 2;
  string password = 3;
}

message UpdateCalDavRequest {
  string calendar_href = 1;
  bool import = 2;
  bool push = 3;
}

// ---- the user's own external events (ADR-0045 §3) ----
//
// GET /api/me/external-events?from=<RFC 3339>&to=<RFC 3339>[&workspace=<id>] →
// ExternalEventsResponse: the caller's imported events overlapping [from, to) (≤ 14 days) with
// their details. With workspace (the caller a member, not a guest; else 403) attendees who are
// members of it get their user_id. People only: guests and bots → 403.

message ExternalAttendee {
  string email = 1; // lower case
  string name = 2;  // CN; may be empty
  string user_id = 3; // a member of the asked workspace with this confirmed address; else empty
  // The attendee's answer as the calendar has it (PARTSTAT): ACCEPTED, DECLINED, TENTATIVE = MAYBE;
  // NEEDS-ACTION, none or another value = PENDING.
  AttendeeStatus status = 4;
}

message ExternalEvent {
  string uid = 1; // a hash of the VEVENT UID (the same for every occurrence of a series)
  google.protobuf.Timestamp starts_at = 2;
  google.protobuf.Timestamp ends_at = 3;
  bool all_day = 4;
  string summary = 5;  // ≤ 200 characters
  string location = 6; // ≤ 200 characters
  repeated ExternalAttendee attendees = 7; // ≤ 50
  string organizer = 8; // e-mail, lower case
  // The conference link («Подключиться», ADR-0045 amendment 1): X-GOOGLE-CONFERENCE /
  // X-MICROSOFT-SKYPETEAMSMEETINGURL, else URL (unless it is the provider's page of the event),
  // else the first https:// of LOCATION, else of DESCRIPTION; empty = none.
  string url = 9;
  string href = 10; // the calendar object (absolute URL) — what DELETE names; empty until the next import
  bool recurring = 11; // an occurrence of a series (DELETE offers THIS or SERIES)
  // The provider's web page of the event («Открыть в календаре»), only when it is reliable
  // (Yandex: its URL property; Nextcloud: the calendar app's link of the object); else empty.
  string web_url = 12;
  // My answer when I am an attendee and not the organizer (my addresses: my Calab e-mail and the
  // CalDAV login when it is an address): «Принять / Отклонить / Может быть» are offered
  // (POST /api/me/external-events/rsvp). UNSPECIFIED = not an attendee, or the organizer.
  AttendeeStatus my_status = 13;
}

message ExternalEventsResponse {
  repeated ExternalEvent events = 1; // earliest first
}

// DELETE /api/me/external-events DeleteExternalEventRequest → 204 (ADR-0045 amendment 1): deletes
// my imported event from my CalDAV calendar. SERIES (or an event without repeats) — a CalDAV
// DELETE of the object with If-Match: its ETag; THIS of a series — a PUT of the object with an
// added EXDATE (a changed occurrence is removed too), also with If-Match. The local rows go at
// once; the next import confirms. 404 — no such event of mine (or no account); 409 CONFLICT — the
// event changed in the calendar (the provider answered 412, or it was not imported with an href
// yet): reload; 422 — the calendar is read-only (403 / 405 from the provider); 30 per minute.
// People only: guests and bots → 403. The account's password never leaves the server.

enum ExternalDeleteScope {
  EXTERNAL_DELETE_SCOPE_UNSPECIFIED = 0;
  EXTERNAL_DELETE_SCOPE_THIS = 1;   // only this occurrence (the whole event when it has no repeats)
  EXTERNAL_DELETE_SCOPE_SERIES = 2; // the whole series
}

message DeleteExternalEventRequest {
  string uid = 1; // ExternalEvent.uid
  string href = 2; // ExternalEvent.href
  google.protobuf.Timestamp start = 3; // ExternalEvent.starts_at of the occurrence
  ExternalDeleteScope scope = 4;
}

// POST /api/me/external-events/rsvp RespondExternalEventRequest → 204 (ADR-0045 amendment 2): my
// answer to an imported event, written into my CalDAV calendar — the object read again (it must
// still be the imported version), PARTSTAT of my ATTENDEE set in every VEVENT of the uid (the whole
// series, like Calab's own answers), a PUT with If-Match. The provider mails the reply to the
// organizer (RFC 6638 implicit scheduling). The server imports again at once, so the next GET has
// the new answer. 404 — no such event of mine (or no account); 409 CONFLICT — the event changed in
// the calendar (EVENT_CHANGED): reload; 422 — status not ACCEPTED / DECLINED / MAYBE, I am not an
// attendee (reason NOT_AN_ATTENDEE) or the calendar is read-only (CALENDAR_READ_ONLY); shares the
// 30 per minute of the delete. People only: guests and bots → 403.
message RespondExternalEventRequest {
  string uid = 1; // ExternalEvent.uid
  string href = 2; // ExternalEvent.href
  google.protobuf.Timestamp start = 3; // ExternalEvent.starts_at of the occurrence
  AttendeeStatus status = 4; // ACCEPTED, DECLINED or MAYBE
}

// ---- gateway (docs/05) ----

// EVENT_CREATE / EVENT_UPDATE / EVENT_DELETE: the series (occurrence_at unset, my_status
// UNSPECIFIED), to everyone who may see the event (see above). EVENT_DELETE carries the
// cancelled event (cancelled_at set) and also goes to attendees who lost the event (removed
// from the list, or its room hidden to them).
message CalendarEventCreate {
  CalendarEvent event = 1;
}

message CalendarEventUpdate {
  CalendarEvent event = 1;
}

message CalendarEventDelete {
  CalendarEvent event = 1;
}

// EVENT_RSVP: an attendee answered; to everyone who may see the event.
message CalendarEventRsvp {
  string workspace_id = 1;
  string event_id = 2;
  CalendarEventAttendee attendee = 3;
  CalendarEventCounts counts = 4;
  CalendarEvent event = 5; // the series after the answer (as in EVENT_UPDATE)
}

// EVENT_REMINDER: to one attendee's devices (user channel), `minutes` before the occurrence
// (one of the user's event_reminders). The client shows a system notification.
message CalendarEventReminder {
  CalendarEvent event = 1; // the occurrence (occurrence_at set)
  google.protobuf.Timestamp occurrence_at = 2;
  uint32 minutes = 3;
}

// ROOM_EVENT_ACTIVE: 15 minutes before an occurrence with a room starts (and at once for one
// created or moved inside that window) until it ends; to the room's viewers. The
// room row shows the calendar badge. WorkspaceSnapshot.active_events has the current ones.
// Guests who see the room get it too, without attendees (see CalendarEventResponse).
message RoomEventActive {
  string workspace_id = 1;
  string room_id = 2;
  CalendarEvent event = 3; // the occurrence
}

// ROOM_EVENT_ENDED: the occurrence ended, was cancelled or moved away from the room / window.
message RoomEventEnded {
  string workspace_id = 1;
  string room_id = 2;
  string event_id = 3;
  google.protobuf.Timestamp occurrence_at = 4;
}
