# Packaging config. Signing/notarization come in stage 4 (docs/07-roadmap.md);
# certificates are provided via env (CSC_LINK, APPLE_ID, ...), never committed.
# appId stays as before the rename (docs/10): macOS keys Microphone / Screen Recording / Input
# Monitoring grants and the Keychain item by it, NSIS its upgrade GUID, Windows notifications
# their AppUserModelID — a new id would reset all of that for installed builds.
appId: app.calaba.desktop
productName: Calab
copyright: © 2026 GPTunneL
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  # uiohook-napi must be our patched build (Caps Lock, mouse 3–5 release; patches/uiohook-napi@*.patch),
  # compiled per arch below — never the upstream prebuilt binaries it ships.
  - '!**/node_modules/uiohook-napi/prebuilds/**'
asarUnpack:
  - '**/*.node'
# Owner artwork (scripts/gen-icons.sh). Tray + Linux window icons are loaded by main at runtime.
extraResources:
  # Licence (BUSL-1.1 + NOTICE + commercial terms) and third-party notices (generated by
  # `pnpm build:app`), shown in «О программе».
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../NOTICE
    to: NOTICE
  - from: ../../COMMERCIAL-LICENSE.md
    to: COMMERCIAL-LICENSE.md
  - from: build/.gen/THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
  - from: build/icons/tray
    to: icons/tray
  - from: build/icons/linux/512x512.png
    to: icons/window.png
npmRebuild: true
# Compile native deps from source for every target arch (x64 is cross-compiled on Apple Silicon),
# so the packaged uiohook_napi.node is the patched build/Release of that arch.
buildDependenciesFromSource: true
protocols:
  # calab:// (docs/10); calaba:// — the pre-rename scheme — stays as an alias.
  - name: Calab
    schemes: [calab, calaba]
mac:
  icon: build/icons/mac/icon.icns
  category: public.app-category.business
  # Apple Silicon and Intel as separate artifacts (the update feed serves the matching one).
  artifactName: Calab-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Unsigned until the Developer ID arrives (stage 4); CSC_LINK in env enables signing.
  identity: null
  # Stage 4: notarization (needs APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID in env).
  # notarize: true
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Calab использует микрофон для голосовых комнат.
    NSAudioCaptureUsageDescription: Calab захватывает системный звук при показе экрана.
    NSAppleEventsUsageDescription: Calab открывает системные настройки разрешений.
win:
  icon: build/icons/win/icon.png
  target: [nsis]
  # Windows only: ship upstream's prebuilt uiohook (prebuilds/win32-x64). Our patch touches only
  # libuiohook's darwin code, and node-gyp cannot compile for win32 outside Windows (release
  # builds run in Linux Docker). mac/linux keep the global prebuilds exclusion above and are
  # compiled from the patched source. electron-builder takes only `!exclusions` from plain
  # strings for node_modules, so the inclusion is a FileSet; the directory itself is listed
  # too because the global `prebuilds/**` exclusion also matches it.
  files:
    - from: .
      filter:
        - '**/node_modules/uiohook-napi/prebuilds'
        - '**/node_modules/uiohook-napi/prebuilds/win32-x64/**'
nsis:
  artifactName: Calab-Setup-${version}-${arch}.${ext}
  license: ../../LICENSE
  oneClick: false
  perMachine: false
linux:
  icon: build/icons/linux
  target: [AppImage, deb]
  category: Network
  executableName: calab
  artifactName: Calab-${version}-${arch}.${ext}
  maintainer: GPTunneL <it@gptunnel.ai>
deb:
  packageName: calab
  # The package was «calaba» before the rename (docs/10): replace it on upgrade instead of
  # installing side by side (both would claim calaba:// and the same binary name space).
  fpm: ['--replaces=calaba', '--conflicts=calaba']
