syntax = "proto3";
package calaba.v1;

import "google/protobuf/timestamp.proto";
import "calaba/v1/call.proto";
import "calaba/v1/file.proto";
import "calaba/v1/recording.proto";
import "calaba/v1/sticker.proto";
import "calaba/v1/user.proto";

message Message {
  string id = 1; // uuidv7 generated by Postgres: order of ids = order of commits
  string room_id = 2;
  string author_id = 3;
  string content = 4; // ≤ 4000 chars
  repeated FileMeta attachments = 5; // ≤ 20, in order
  string reply_to_id = 6;
  string nonce = 7; // client id of the optimistic message, echoed back
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp edited_at = 9;
  // Aggregated reactions in order of first use. `me` is relative to the requesting user and
  // is filled only in REST responses; in events (MESSAGE_UPDATE) counts are current but `me`
  // is always false — clients keep their own `me` and apply MESSAGE_REACTION_ADD/REMOVE.
  repeated Reaction reactions = 10;
  google.protobuf.Timestamp pinned_at = 11; // unset = not pinned
  string pinned_by = 12;
  // Link previews (unfurl) of this message are hidden: clients do not render them.
  bool embeds_hidden = 13;
  // SYSTEM: a message posted by the server about an event (ADR-0025), rendered from `system`
  // instead of `content` (empty); author_id is the user the event is about. It cannot be
  // edited; it can be deleted (MANAGE_MESSAGES or the author), reacted to and pinned.
  MessageKind kind = 14;
  SystemMessage system = 15; // set for kind SYSTEM
  // A sticker message (ADR-0030): empty content, no attachments, cannot be edited. Unset
  // with an empty content and no attachments = the sticker is gone (its workspace was
  // deleted); clients show a placeholder.
  Sticker sticker = 16;
  // A bot command (ADR-0031): the message starts with /name or /name@username of a bot of the
  // room. Set only in MESSAGE_CREATE (gateway and webhook) delivered to that bot; everyone
  // else, REST responses included, gets the plain message.
  MessageCommand command = 30;
  // A forwarded copy (ADR-0033): a new message of this room by author_id, copied from another
  // message. Unset for an ordinary message. It cannot be edited (422, reason
  // MESSAGE_NOT_EDITABLE); a copy of a recording card follows the original card (MESSAGE_UPDATE).
  Forward forward = 17;
  InlineKeyboard inline_keyboard = 18; // bot-authored ordinary messages only
  uint64 keyboard_revision = 19; // server-owned; changes on text or keyboard edits
  // ADR-0106: the bot that wrote the message on behalf of its owner, the author (author_id);
  // clients show «Name (via bot X)». Empty for everything else.
  string via_bot_id = 20;
  // ADR-0156: the channel, "mcp" when the author (a bot, or a person through via_bot_id) wrote the
  // message through the MCP endpoint; clients show «via MCP». Empty otherwise.
  string via = 22;
  // ADR-0140: who saw the message on screen and when — people only (bots and the author never),
  // oldest first. Set only in REST answers to the author (GET /api/rooms/{id}/messages/{messageId};
  // in GET /api/rooms/{id}/messages for bot callers), never in events. Empty before the feature
  // started (READY.read_receipts_from).
  repeated MessageReader read_by = 21;
}

// ADR-0140: a person who saw a message (Message.read_by, GET …/messages/{messageId}/readers).
message MessageReader {
  string user_id = 1;
  google.protobuf.Timestamp read_at = 2;
}

// GET /api/rooms/{id}/messages/{messageId}/readers (ADR-0140): the author only (others 403);
// people who saw the message, oldest first. A guest author sees only the people of its rooms.
message ListMessageReadersResponse {
  repeated MessageReader readers = 1;
}

// Where a forwarded message comes from (ADR-0033). A copy of a copy points at the original.
message Forward {
  string author_id = 1; // author of the original message
  // Room of the original message; empty when it is a DM or the original is gone (deleted
  // for good). The room may be hidden from the reader: clients show only the author and date.
  string room_id = 2;
  string message_id = 3; // the original message; empty when it is gone
  google.protobuf.Timestamp sent_at = 4; // when the original was sent
}

// A command addressed to a bot: "/name args" or "/name@username args".
message MessageCommand {
  string bot_user_id = 1;
  string name = 2; // without the slash and @username, lower case
  string args = 3; // the rest of the message after the command, trimmed
}

enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED = 0; // a user's message
  MESSAGE_KIND_SYSTEM = 1;
}

// Payload of a system message. Clients that do not know the case show nothing for it.
message SystemMessage {
  oneof payload {
    RecordingCard recording = 1; // a meeting recording (ADR-0025)
    BirthdayCard birthday = 2;   // docs/09 #76
    CallCard call = 3;           // a DM call log line (ADR-0034)
    AchievementCard achievement = 4; // ADR-0061
    AutomationCard automation = 5; // a message of a board automation rule (ADR-0060)
    RoomIconCard room_icon = 6;    // the room's picture was changed (ADR-0092)
    ContactSharedCard contact_shared = 7; // a person shared their contact with a bot (ADR-0100)
  }
}

// "You shared your contact with @bot: phone, email": posted by the server into the DM of a person
// and a bot when the person confirms a REQUEST_CONTACT button (ADR-0100); the author is the
// person. Seen by both; carries the field names only, never the values. No notification. Clients
// also use it to show the button as «Отправлено».
message ContactSharedCard {
  string bot_user_id = 1;
  repeated ContactField fields = 2; // what was shared, in the order PHONE, EMAIL
  string message_id = 3;            // the bot message with the button
  string button_id = 4;
}

// "<author> changed the room picture": posted by the server into the room when PATCH
// /api/rooms/{id} changes icon_file_id; the author is who changed it. No notification or sound.
// The file stays readable to those who see the room while the message lives.
message RoomIconCard {
  string file_id = 1; // the new picture; empty = the picture was removed
}

// «Автоматизация»: a board automation rule posted into a text room or into the task's comments
// (actions notify_room / comment). Rendered as the task's card with the text; the author is the
// rule's creator, the client shows «Автоматизация: <rule_name>» instead.
message AutomationCard {
  string board_id = 1;
  string task_id = 2;
  string rule_id = 3;
  string rule_name = 4;
  string text = 5; // the rendered template, ≤ 2000 characters
}

// "Today is <author>'s birthday!": posted once a day per workspace by the server at 09:00 of
// the author's time zone (UTC without one) into the first text room of the workspace.
message BirthdayCard {
  uint32 day = 1;
  uint32 month = 2;
}

// "<author> receives an achievement": posted by the server when an achievement is granted with
// announce = true, into the announcement room of the workspace (as BirthdayCard). The author is the
// recipient, and the card mentions them (inbox «Mentions»). Revoking the grant keeps the card.
message AchievementCard {
  string achievement_id = 1; // Achievement.id of the workspace catalog (GET /api/workspaces/{id}/achievements)
  string grant_id = 2;       // MemberAchievement.id
  string note = 3;           // «for what»
  string granted_by = 4;     // user id
}

message Reaction {
  string emoji = 1; // Unicode emoji sequence
  uint32 count = 2;
  bool me = 3;
}

// GET /api/messages/{id}/reactions/{emoji}?after=&limit= (VIEW_ROOM): the public profiles of
// the users who reacted with {emoji} — the source of the reaction tooltip, loaded on demand.
// Ordered by user id (a stable keyset: `after` is the last id of the previous page); limit
// 1..100, default 25. Reading the reactor list has the same 404 rules as the message itself:
// deleted, in the cleared slice of a DM or in a room the caller cannot view.
message ListReactionUsersResponse {
  repeated User users = 1;
  bool has_more = 2;
}

// GET /api/workspaces/{id}/messages/search?q=&room_id=&author_id=&before=&limit= and
// GET /api/rooms/{id}/messages?q=: full-text search (newest first, cursor `before`,
// limit ≤ 50) over rooms the caller can view. The response is ListMessagesResponse.

// GET /api/rooms/{id}/pins (VIEW_ROOM): pinned messages, most recently pinned first
// (≤ 50 per room). The response is ListMessagesResponse.

// GET /api/rooms/{id}/messages?before=&after=&limit= (VIEW_ROOM). Newest first for `before`.
// Also the response of GET /api/me/mentions?before=&limit=&workspace_id= : messages that
// mention the caller (@<user_id>, @everyone, @here) in rooms the caller can view, newest first.
message ListMessagesResponse {
  repeated Message messages = 1;
  bool has_more = 2;
  // ADR-0140: the furthest seen marker of the other people of the room (READ_RECEIPT value), for
  // rooms READY does not list (task rooms); empty — nobody else saw anything, or a bot caller.
  string peer_read_message_id = 3;
}

// POST /api/rooms/{id}/messages (SEND_MESSAGES; ATTACH_FILES if attachments).
// Idempotent by (author, nonce): a retry returns the existing message with 200 instead of 201.
message CreateMessageRequest {
  string content = 1;
  repeated string attachment_ids = 2;
  string reply_to_id = 3;
  string nonce = 4; // ≤ 64 chars
  // Send a sticker (ADR-0030) instead of text: content and attachments must be empty. The
  // sticker's pack must be usable here: a room of its workspace, or a DM whose participants
  // are both non-guest members of it; the sender must not be a guest there.
  string sticker_id = 5;
  InlineKeyboard inline_keyboard = 6;
}

message CreateMessageResponse {
  Message message = 1;
}

// PATCH /api/messages/{id} (author only; not a sticker message; not a forwarded copy: 422
// VALIDATION, reason MESSAGE_NOT_EDITABLE)
message UpdateMessageRequest {
  string content = 1; // same empty-text semantics as older clients
  InlineKeyboard inline_keyboard = 2; // omitted = keep; empty rows = remove
  bool preserve_content = 3; // keyboard-only edit: requires inline_keyboard and empty content
}

message UpdateMessageResponse {
  Message message = 1;
}

// POST /api/rooms/{id}/messages/{mid}/forward (ADR-0033): copies the message {mid} of the room
// {id} (VIEW_ROOM there; 404 for a deleted or hidden message) into to_room_id as a new message
// of the caller (SEND_MESSAGES there; ATTACH_FILES for a message with attachments; a DM: its
// participant) → 201 ForwardMessageResponse, MESSAGE_CREATE with `forward`. Copied: content,
// sticker, embeds_hidden, attachments (the same files, no quota) and a recording card. Not
// copied: reactions, pin, reply, mentions (a copy notifies nobody by @). 422 reason
// NOT_FORWARDABLE: a bot command or a system message other than a recording card.
message ForwardMessageRequest {
  string to_room_id = 1;
}

message ForwardMessageResponse {
  Message message = 1;
}

// PUT /api/messages/{id}/embeds-hidden (author, or MANAGE_MESSAGES) → UpdateMessageResponse;
// MESSAGE_UPDATE to the room. Does not mark the message edited.
message SetEmbedsHiddenRequest {
  bool hidden = 1;
}

// PUT /api/rooms/{id}/read (VIEW_ROOM). Moves the read marker forward only; 204.
message UpdateReadStateRequest {
  string message_id = 1;
  // ADR-0140: the message was on screen (the feed's bottom, a card's last comment): the seen
  // marker moves too — read receipts and «Прочитали». Without it only the read marker moves
  // («mark as read» actions). Ignored for bots.
  bool seen = 2;
}

// Callback metadata is public to everyone who can read the message. Never put secrets here.
// At most 5 rows, 5 buttons per row, 25 buttons total and 50 allowed users.
message InlineKeyboard {
  repeated InlineKeyboardRow rows = 1;
  repeated string allowed_user_ids = 2; // empty = any reader with SEND_MESSAGES
}

message InlineKeyboardRow {
  repeated InlineButton buttons = 1;
}

message InlineButton {
  string id = 1; // unique within this keyboard, 1..64 ASCII letters/digits/_/-
  string label = 2; // 1..80 characters
  string data = 3; // opaque public metadata, at most 512 bytes
  bool disabled = 4;
  // What pressing the button does (ADR-0100); unset = a callback button (BOT_CALLBACK).
  InlineButtonKind kind = 5;
  // REQUEST_CONTACT only: the contact fields the bot asks for, one or both, no repeats.
  repeated ContactField fields = 6;
  // REQUEST_CONTACT only: why the bot asks, shown to the person; at most 120 characters.
  string reason = 7;
}

enum InlineButtonKind {
  INLINE_BUTTON_KIND_UNSPECIFIED = 0; // a callback button: POST /api/messages/{id}/interactions
  // "Share contact" (ADR-0100): only in a DM of the bot with a person, otherwise sending or
  // editing the message is 400 BAD_REQUEST, reason BOT_CONTACT_REQUEST_DM_ONLY. The person
  // confirms on their client; the server then sends the contact from the profile
  // (POST /api/messages/{id}/buttons/{buttonId}/contact). Pressing it through /interactions is
  // 409 BUTTON_UNAVAILABLE.
  INLINE_BUTTON_KIND_REQUEST_CONTACT = 1;
}

enum ContactField {
  CONTACT_FIELD_UNSPECIFIED = 0;
  CONTACT_FIELD_PHONE = 1;
  CONTACT_FIELD_EMAIL = 2;
}

// POST /api/messages/{id}/interactions (people only; VIEW_ROOM and SEND_MESSAGES).
// A retry with the same actor + nonce returns the original receipt; never repeats delivery.
message CreateMessageInteractionRequest {
  string button_id = 1;
  uint64 keyboard_revision = 2;
  string nonce = 3; // required, 1..64 bytes; reuse on network retries
}

message CreateMessageInteractionResponse {
  string interaction_id = 1; // accepted for delivery, NOT proof the bot completed an action
}

// Private to the message's author bot, over gateway and configured webhook.
message BotCallback {
  string id = 1; // stable across transports and retries; bots MUST durably dedupe effects
  string bot_user_id = 2;
  string user_id = 3; // authenticated actor, never supplied by the client
  string workspace_id = 4; // empty for a DM
  string room_id = 5;
  string message_id = 6;
  string button_id = 7;
  string data = 8; // loaded from the saved keyboard
  uint64 keyboard_revision = 9;
  google.protobuf.Timestamp created_at = 10;
}

// POST /api/messages/{id}/buttons/{buttonId}/contact (people only, no body; ADR-0100): the
// caller confirms the REQUEST_CONTACT button {buttonId} of the bot message {id} in their DM with
// the bot. The server composes the contact from the caller's profile (the client sends no
// values): the requested fields that are set. Errors: 404 the message (deleted, hidden, cleared
// part of the DM); 403 bots, a blocked or unavailable bot, not the DM's person; 400 reason
// BOT_CONTACT_REQUEST_DM_ONLY outside a DM; 409 BUTTON_UNAVAILABLE (no such REQUEST_CONTACT
// button, disabled, another user's keyboard), CONTACT_ALREADY_SHARED (at most one share per
// button per person); 422 VALIDATION reason CONTACT_EMPTY (none of the requested fields is set);
// 429 reason CONTACT_SHARE_LIMIT (at most 10 shares per person per hour). On success: CONTACT_SHARED
// to that bot only (gateway and webhook), a ContactSharedCard system message in the DM
// (MESSAGE_CREATE to both) and a journal entry without the values.
message ShareContactResponse {
  string share_id = 1;              // ContactShared.id
  repeated ContactField fields = 2; // what was shared
  Message message = 3;              // the system message posted into the DM
}

// A person's contact shared with a bot (ADR-0100). Private to that bot, over gateway
// (CONTACT_SHARED) and its webhook. Only the requested fields that are set in the profile are
// filled; a field not shared is empty / false.
message ContactShared {
  string id = 1; // stable across transports and webhook retries; dedupe by it
  string bot_user_id = 2;
  string user_id = 3; // the person, from the authentication, never from the client
  string display_name = 4;
  string phone = 5; // E.164 as in the profile; empty = not shared
  // Always false for now: the product has no phone verification yet (ADR-0100 §5).
  bool phone_verified = 6;
  string email = 7; // empty = not shared
  bool email_verified = 8; // the address was confirmed with a code (ADR-0065)
  google.protobuf.Timestamp shared_at = 9;
  string room_id = 10;    // the DM
  string message_id = 11; // the bot message with the button
  string button_id = 12;
  string data = 13; // the button's data, as saved
  repeated ContactField fields = 14; // what was shared, in the order PHONE, EMAIL
}

// GET /api/workspaces/{id}/bot-contact-shares?before=&limit= (VIEW_JOURNALS; people only;
// ADR-0100): the journal of contacts shared with the workspace's bots, newest first, without
// the values. `before` is the id of the last entry of the previous page; limit 1..100, default 50.
message ListBotContactSharesResponse {
  repeated BotContactShareEntry entries = 1;
  bool has_more = 2;
}

message BotContactShareEntry {
  string id = 1;
  string bot_user_id = 2;
  string user_id = 3;
  repeated ContactField fields = 4;
  google.protobuf.Timestamp shared_at = 5;
}
