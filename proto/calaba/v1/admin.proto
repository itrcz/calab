syntax = "proto3";
package calaba.v1;

import "google/protobuf/timestamp.proto";
import "calaba/v1/plan.proto";
import "calaba/v1/user.proto";
import "calaba/v1/workspace.proto";

// Superadmin API (ADR-0024): /api/admin/*, only for users whose email is in
// SUPERADMIN_EMAILS (Me.is_superadmin); everyone else gets 404. Own rate limit (60/min).

// Usage of a workspace (admin API).
message WorkspaceUsage {
  uint32 members = 1;      // members without guests
  uint32 rooms = 2;        // live rooms
  uint64 storage_mb = 3;   // stored files, MiB (rounded up)
  uint64 storage_bytes = 4;
  google.protobuf.Timestamp last_activity = 5; // newest message; unset = none
  uint32 bots = 6;          // bots that are members (they count as members too)
  uint32 sticker_packs = 7; // live sticker packs
}

// A workspace as the superadmin sees it.
message AdminWorkspace {
  Workspace workspace = 1; // with plan
  User owner = 2;
  string owner_email = 3;
  WorkspaceUsage usage = 4;
  string plan_note = 5;
  string plan_updated_by = 6; // user id; empty = never set
  google.protobuf.Timestamp plan_updated_at = 7;
  // Suspension (workspace.suspension has when / why): who suspended it.
  string suspended_by = 8;       // user id
  string suspended_by_email = 9;
  // Upload limits of the workspace's members (ADR-0155): the superadmin's overrides (an unset
  // field = the server default) and the server defaults with the hard cap of max_file_mb.
  UploadLimits upload_limits = 10;
  UploadLimits upload_defaults = 11; // UPLOAD_RATE_BURST, UPLOAD_RATE_PER_HOUR, MAX_FILE_SIZE_MB
  uint32 max_file_mb_cap = 12;
}

// Upload limits per member of a workspace (ADR-0155): burst = uploads at once, per_hour = the
// refill of that bucket, max_file_mb = the size of one file. They apply to every workspace
// upload (chat attachments, the Disk, boards, wiki); DM and notes uploads keep the defaults.
message UploadLimits {
  optional uint32 burst = 1;       // 1..10000
  optional uint32 per_hour = 2;    // 1..100000
  optional uint32 max_file_mb = 3; // 1..max_file_mb_cap
}

// GET /api/admin/workspaces?q= (superadmin; others get 404). q matches name, slug or the
// owner's email (substring, case-insensitive); empty = newest workspaces. At most 50.
message AdminSearchWorkspacesResponse {
  repeated AdminWorkspace workspaces = 1;
}

// GET /api/admin/workspaces/{id}
message AdminGetWorkspaceResponse {
  AdminWorkspace workspace = 1;
}

// PUT /api/admin/workspaces/{id}/plan. limits: required with PLAN_CUSTOM (stored as written,
// 0 = no limit); optional with PLAN_TEAM / PLAN_ENTERPRISE (ADR-0113): the full limits the
// workspace gets, of which only the values that differ from the plan's defaults are stored, so
// the rest keeps following the server config (unset = the plan's defaults, overrides dropped);
// refused with PLAN_FREE. valid_until must be
// in the future (unset = no expiry). Every change is logged; WORKSPACE_UPDATE follows.
message AdminSetPlanRequest {
  Plan plan = 1;
  PlanLimits limits = 2;
  google.protobuf.Timestamp valid_until = 3;
  string note = 4; // ≤ 500 characters
  // ADR-0086: a plan whose limits the workspace already exceeds is refused (409
  // PLAN_LIMITS_EXCEEDED with ApiError.plan_violations) unless the superadmin confirms it here;
  // the override and the violations are written to the plan log.
  bool override_limits = 5;
  // PLAN_CUSTOM only (422 otherwise): the name members see (trimmed, control characters removed,
  // <= 40 characters; empty = «Индивидуальный») and a short description (<= 140).
  string display_name = 6;
  string description = 7;
}

message AdminSetPlanResponse {
  AdminWorkspace workspace = 1;
}

// One plan change (GET /api/admin/workspaces/{id}/plan/log, newest first, ≤ 100).
message PlanLogEntry {
  string id = 1;
  string workspace_id = 2;
  string actor_id = 3;
  string actor_email = 4;
  Plan plan = 5;
  PlanLimits limits = 6; // as set (custom) or the plan's limits at that time
  google.protobuf.Timestamp valid_until = 7;
  string note = 8;
  google.protobuf.Timestamp created_at = 9;
  string display_name = 10; // PLAN_CUSTOM: the name and description set with this change
  string description = 11;
}

message AdminPlanLogResponse {
  repeated PlanLogEntry entries = 1;
}

// PUT /api/admin/workspaces/{id}/suspension. suspended=true needs a reason (1..500 characters;
// shown to the owner / admins); false resumes (the reason is ignored). Idempotent. Every change
// is logged; WORKSPACE_UPDATE follows (Workspace.suspension). Suspending disconnects everyone
// from the workspace's voice rooms.
message AdminSetSuspensionRequest {
  bool suspended = 1;
  string reason = 2;
}

message AdminSetSuspensionResponse {
  AdminWorkspace workspace = 1;
}

// PUT /api/admin/workspaces/{id}/upload-limits (ADR-0155): replaces the overrides (an unset
// field = back to the server default); out of range = 422 VALIDATION with the field. Applies to
// the next upload, no restart; every change is written to the workspace's admin log.
message AdminSetUploadLimitsRequest {
  UploadLimits limits = 1;
}

message AdminSetUploadLimitsResponse {
  AdminWorkspace workspace = 1;
}
