syntax = "proto3";
package calaba.v1;

import "google/protobuf/timestamp.proto";
import "calaba/v1/event.proto";
import "calaba/v1/media.proto";

enum RoomType {
  ROOM_TYPE_UNSPECIFIED = 0;
  ROOM_TYPE_VOICE = 1; // voice room with its own text chat
  ROOM_TYPE_TEXT = 2;
  ROOM_TYPE_DM = 3;    // direct message (ADR-0020): no workspace, two participants
  ROOM_TYPE_NOTES = 4; // notes shelf (ADR-0039): no workspace, only its owner
  ROOM_TYPE_TASK = 5;  // comments of a task (ADR-0042): hidden, access from the task's board
}

enum PermissionTargetType {
  PERMISSION_TARGET_TYPE_UNSPECIFIED = 0;
  PERMISSION_TARGET_TYPE_ROLE = 1;
  PERMISSION_TARGET_TYPE_USER = 2;
}

// Room-level override (ADR-0008). allow/deny are Permission bit masks.
message RoomPermissionOverride {
  PermissionTargetType target_type = 1;
  // ROLE: role id (ADR-0026; requests may still name a built-in role "owner" | "admin" |
  // "member" | "guest", stored and returned as its id); USER: user id.
  string target_id = 2;
  uint64 allow = 3;
  uint64 deny = 4;
}

// Per-room media override; an unset field means "use the workspace default".
message RoomMediaOverride {
  optional uint32 audio_bitrate_kbps = 1; // tiers 8|16|32|64 (24, 48: legacy)
  optional ScreenSharePreset max_stream_preset = 2;
  optional uint32 max_streams = 3;        // 0..10
  optional uint32 camera_limit = 4;       // 0..25 (0 = cameras off)
}

message Room {
  string id = 1;
  string workspace_id = 2;
  RoomType type = 3;
  string name = 4;
  string topic = 5;
  int32 position = 6;
  // Informational: private rooms get `deny VIEW_ROOM` for role member on creation.
  bool is_private = 7;
  // Effective settings (override merged over workspace defaults). Clients apply these.
  RoomMediaSettings media = 8;
  // Raw override, for the room settings UI.
  RoomMediaOverride media_override = 9;
  // All overrides; clients feed them to computePermissions for UI decisions.
  repeated RoomPermissionOverride permission_overrides = 10;
  google.protobuf.Timestamp created_at = 11;
  // Newest live message (for unread counts against ReadState). Filled in READY /
  // WORKSPACE_CREATE snapshots and GET /api/workspaces/{id}/rooms; empty when the room has
  // no messages or in other events (clients track MESSAGE_CREATE).
  string last_message_id = 12;
  google.protobuf.Timestamp last_message_at = 13;
  string category_id = 14; // empty = no category (top of the list)
  // Voice rooms: when the current call started (first participant joined an empty room).
  // Filled in READY / WORKSPACE_CREATE snapshots; unset when nobody is in the room.
  google.protobuf.Timestamp voice_started_at = 15;
  uint32 user_limit = 16; // voice rooms: max users (0 = unlimited, 1..99); MOVE_MEMBERS ignores it
  // Voice rooms: a short status of the current call ("Планёрка", ≤ 60 chars); empty = none.
  // Set by PATCH /api/rooms/{id}/voice-status, cleared when the room empties (ROOM_UPDATE).
  string voice_status = 17;
  // Voice rooms: members may record the meeting (ADR-0025). Default true; changed with
  // PATCH /api/rooms/{id} allow_recording, which needs MANAGE_RECORDINGS (ADR-0048).
  bool allow_recording = 18;
  // Private rooms only (ADR-0029, ADR-0048): closed even to administrators. ADMINISTRATOR gives
  // no bypass and VIEW_ROOM comes only from an allow override on the room (by role or
  // personally); the workspace owner always sees it. Changed with PATCH /api/rooms/{id}
  // restricted. Strangers get 404 for the room everywhere.
  bool restricted = 19;
  // Guests arriving by a link of the room wait for a decision (ADR-0040); a link may
  // override it (RoomInvite.require_approval). Changed with PATCH /api/rooms/{id}.
  bool guest_approval = 20;
  // Temporary rooms (ADR-0044). A room is temporary when expires_at is set (there is no
  // separate is_temp flag): a VOICE room archived by the server at expires_at (ROOM_DELETE).
  // Clients list temporary rooms in the virtual group «Временные» sorted by expires_at and
  // ignore category_id / position for them.
  google.protobuf.Timestamp expires_at = 21;
  // Who created the room (empty for older rooms). The creator of a temporary room manages it
  // like MANAGE_ROOM (rename, extend, links, access, delete) — clients: mayManageRoom(room, me)
  // = MANAGE_ROOM in the room || (expires_at set && created_by == me && not a guest).
  string created_by = 22;
  // Set only in the archive listing (GET /api/workspaces/{id}/rooms?archived=1).
  google.protobuf.Timestamp archived_at = 23;
  uint32 message_count = 24; // the archive listing only: live messages of the room
  // The room's picture (ADR-0092): an image file of the workspace, shown instead of the glyph of
  // the room type; empty = the glyph. Clients load it as /api/files/{id} (readable by everyone who
  // sees the room). Changed with PATCH /api/rooms/{id} icon_file_id; a deleted file clears it.
  string icon_file_id = 25;
}

// Per-user notification level of a room or a workspace (docs/05 «Уведомления»). UNSPECIFIED
// means the default: INHERIT for a room, MENTIONS for a workspace. The effective level of a
// room is its own level unless INHERIT, else its workspace's; a DM notifies like a mention.
enum NotificationLevel {
  NOTIFICATION_LEVEL_UNSPECIFIED = 0;
  NOTIFICATION_LEVEL_ALL = 1;      // every message
  NOTIFICATION_LEVEL_MENTIONS = 2; // only messages mentioning the user (@<user_id>, @everyone, @here)
  NOTIFICATION_LEVEL_NONE = 3;     // nothing
  NOTIFICATION_LEVEL_INHERIT = 4;  // rooms only: follow the workspace level (the room default)
}

// The caller's notification settings for one room. Rooms without a stored row use the
// default (INHERIT, not muted). Sent in READY (notification_settings) and ROOM_NOTIFICATION_UPDATE.
message RoomNotificationSettings {
  string room_id = 1;
  NotificationLevel level = 2;
  google.protobuf.Timestamp muted_until = 3; // unset = not muted; in the past = no longer muted
}

// PUT /api/rooms/{id}/notifications (VIEW_ROOM). Replaces the caller's settings for the
// room; level INHERIT (or UNSPECIFIED) without muted_until resets to the default.
message UpdateRoomNotificationSettingsRequest {
  NotificationLevel level = 1;
  google.protobuf.Timestamp muted_until = 2; // at most 1 year ahead
}

message UpdateRoomNotificationSettingsResponse {
  RoomNotificationSettings settings = 1;
}

// The caller's notification settings for one workspace: the level of its rooms left at
// INHERIT, and a mute of the whole workspace (its rooms stay silent whatever their level).
// Workspaces without a stored row use the default (MENTIONS, not muted). Sent in READY
// (workspace_notification_settings) and WORKSPACE_NOTIFICATION_UPDATE.
message WorkspaceNotificationSettings {
  string workspace_id = 1;
  NotificationLevel level = 2; // ALL | MENTIONS | NONE
  google.protobuf.Timestamp muted_until = 3; // unset = not muted; in the past = no longer muted
  // Task notifications of the workspace's boards (ADR-0042 §4, «Задачи»): ALL (default) |
  // MENTIONS (assigned to me, @me) | NONE. The workspace mute silences them too.
  NotificationLevel task_level = 4;
}

// PUT /api/workspaces/{id}/notifications (member). Replaces the caller's settings for the
// workspace; level MENTIONS (or UNSPECIFIED) without muted_until resets to the default.
// INHERIT is rejected (422).
message UpdateWorkspaceNotificationSettingsRequest {
  NotificationLevel level = 1;
  google.protobuf.Timestamp muted_until = 2; // at most 1 year ahead
  // ALL | MENTIONS | NONE; unset = keep the stored task level (older clients).
  optional NotificationLevel task_level = 3;
}

message UpdateWorkspaceNotificationSettingsResponse {
  WorkspaceNotificationSettings settings = 1;
}

// Room category (a collapsible group in the room list). Visible to all members; clients
// hide categories without visible rooms.
message RoomCategory {
  string id = 1;
  string workspace_id = 2;
  string name = 3; // 1..100 chars
  int32 position = 4;
}

// POST /api/workspaces/{id}/categories (MANAGE_ROOM at workspace level)
message CreateCategoryRequest {
  string name = 1;
  optional int32 position = 2; // default: after the last category
}

message CreateCategoryResponse {
  RoomCategory category = 1;
}

// GET /api/workspaces/{id}/categories
message ListCategoriesResponse {
  repeated RoomCategory categories = 1;
}

// PATCH /api/categories/{id} (MANAGE_ROOM at workspace level)
message UpdateCategoryRequest {
  optional string name = 1;
  optional int32 position = 2;
}

message UpdateCategoryResponse {
  RoomCategory category = 1;
}

// PUT /api/workspaces/{id}/rooms/order (MANAGE_ROOM at workspace level). Batch reorder after
// drag & drop: listed rooms get the given position and category (category_id "" = none),
// listed categories the given position. Unlisted items are unchanged.
message SetRoomOrderRequest {
  message RoomPosition {
    string room_id = 1;
    int32 position = 2;
    string category_id = 3;
  }
  message CategoryPosition {
    string category_id = 1;
    int32 position = 2;
  }
  repeated RoomPosition rooms = 1;
  repeated CategoryPosition categories = 2;
}

message SetRoomOrderResponse {
  repeated Room rooms = 1;
  repeated RoomCategory categories = 2;
}

// POST /api/workspaces/{id}/rooms (MANAGE_ROOM at workspace level, i.e. admin/owner)
message CreateRoomRequest {
  RoomType type = 1;
  string name = 2; // 1..100 chars
  string topic = 3; // ≤ 1024 chars
  bool is_private = 4;
  RoomMediaOverride media_override = 5;
  optional int32 position = 6; // default: after the last room
  string category_id = 7;       // optional category of the same workspace
  uint32 user_limit = 8;        // voice rooms only, 0..99
}

message CreateRoomResponse {
  Room room = 1;
}

// GET /api/workspaces/{id}/rooms — only rooms where the caller has VIEW_ROOM.
// ?archived=1 (ADR-0044): the archive of temporary rooms instead — MANAGE_ROOM at workspace
// level (else 403), only rooms where the caller has VIEW_ROOM, newest archived first, with
// archived_at, created_by, expires_at and message_count. Their history is read with GET
// /api/rooms/{id}/messages (and /messages/{messageId}, /pins; VIEW_ROOM); anything else on an
// archived temporary room (writes, reactions, voice, links, settings) answers 410 ROOM_ARCHIVED.
// Archived permanent rooms stay hidden (404) as before.
message ListRoomsResponse {
  repeated Room rooms = 1;
}

// GET /api/rooms/{id}
message GetRoomResponse {
  Room room = 1;
  uint64 permissions = 2; // caller's effective permissions in this room
}

// PATCH /api/rooms/{id} (MANAGE_ROOM; on a temporary room also its creator, ADR-0044). Unset
// fields are left unchanged.
// media_override, when present, replaces the whole override (unset inner fields = default).
message UpdateRoomRequest {
  optional string name = 1;
  optional string topic = 2;
  optional int32 position = 3;
  optional RoomMediaOverride media_override = 4;
  optional string category_id = 5; // "" = remove from category
  optional uint32 user_limit = 6;  // 0 = unlimited
  // Voice rooms: allow meeting recording (ADR-0025). Needs MANAGE_RECORDINGS (ADR-0048) besides
  // MANAGE_ROOM; switching it off stops a running recording.
  optional bool allow_recording = 7;
  // Private rooms only (ADR-0029, 422 on a public one). MANAGE_ROOM in the room (ADR-0048; the
  // creator of a temporary room too); the owner may always lift it. Switching it on gives the
  // caller (unless the owner) a personal allow VIEW_ROOM | MANAGE_ROOM so they keep access.
  optional bool restricted = 8;
  optional bool guest_approval = 9; // ADR-0040
  // Temporary rooms only (ADR-0044; 422 on a permanent room). A new end: in the future and at
  // most 7 days from now (422 otherwise; extend or shorten). The room's links that ended with
  // the room follow it. MANAGE_ROOM or the creator.
  google.protobuf.Timestamp expires_at = 10;
  // Temporary rooms only: true makes the room permanent (expires_at cleared). Needs real
  // MANAGE_ROOM in the room (the creator's implicit right is not enough: 403).
  bool make_permanent = 11;
  // Temporary rooms only (ADR-0044, «Доступ»): private = the member role loses VIEW_ROOM (a
  // deny override, as a private room at creation); public = that deny is removed. Personal
  // overrides stay. MANAGE_ROOM or the creator. Permanent rooms: 422 (their access dialog
  // edits the overrides with PUT /api/rooms/{id}/permissions).
  optional bool is_private = 12;
  // The room's picture (ADR-0092), text and voice rooms only (422 otherwise). "" removes it. Same
  // right as the name (MANAGE_ROOM or the creator of a temporary room). An image the caller
  // uploaded to this workspace (422 iconFileId otherwise). A change posts a system message
  // room_icon (SystemMessage.room_icon) into the room from the caller.
  optional string icon_file_id = 13;
}

// PATCH /api/rooms/{id}/voice-status (voice rooms): CONNECT and being in the call now, or
// MANAGE_ROOM. Empty status clears it. Response: UpdateRoomResponse; everyone gets ROOM_UPDATE.
message UpdateVoiceStatusRequest {
  string status = 1; // ≤ 60 characters after trimming
}

message UpdateRoomResponse {
  Room room = 1;
}

// PUT /api/rooms/{id}/permissions (MANAGE_ROOM; on a temporary room also its creator, who
// may allow only bits they hold there). Replaces all overrides of the room.
message SetRoomPermissionsRequest {
  repeated RoomPermissionOverride overrides = 1;
}

message SetRoomPermissionsResponse {
  Room room = 1;
}

// POST /api/workspaces/{id}/rooms/temp (ADR-0044): a temporary voice room with a ready link.
// Needs CREATE_TEMP_ROOMS at workspace level (403 otherwise). One transaction: the room
// (after the last room, no category, created_by = caller), for a private room the member
// role's VIEW_ROOM deny plus a personal allow for the caller and member_ids, the room link
// (expires with the room; approval as the room's guest_approval) and, with with_event, a
// calendar meeting. Everyone who sees the room gets ROOM_CREATE (and EVENT_CREATE).
// Limits: 20 live temporary rooms per workspace, 5 per creator — 409 TEMP_ROOM_LIMIT with
// used / limit, reason "PER_USER" for the creator's cap.
message CreateTempRoomRequest {
  string name = 1;         // 1..100 characters
  uint32 ttl_seconds = 2;  // 900 (15 min) .. 604800 (7 days); expires_at = now + ttl
  bool with_event = 3;     // a meeting from now (rounded up to 5 min) to expires_at, room = this
  // The link admits guests (ADR-0016; default true). Needs INVITE_GUESTS at workspace level and
  // a verified email (403 FORBIDDEN / EMAIL_NOT_VERIFIED). false = a members-only link
  // (RoomInvite.members_only, ADR-0043): workspace members only.
  optional bool guests = 4;
  // Visible only to the creator, member_ids and whoever joins by the link (workspace
  // admins see it as any private room). false (default) = every member sees it.
  bool private = 5;
  // Private rooms: up to 50 workspace members (not guests; 422 otherwise) who get access too.
  repeated string member_ids = 6;
}

message TempRoomResponse {
  Room room = 1;
  // The room link for sharing: <PUBLIC_APP_URL>/r/<invite_code>. Its bits: VIEW_ROOM,
  // CONNECT, SPEAK, VIDEO, STREAM, SEND_MESSAGES, ATTACH_FILES — those the creator holds.
  // A workspace member joining a private room by it gets the same personal allow
  // (ROOM_PERMISSIONS_UPDATE); the link lists in GET /api/rooms/{id}/invites.
  string invite_url = 2;
  string invite_code = 3;
  CalendarEvent event = 4; // with_event only
}
