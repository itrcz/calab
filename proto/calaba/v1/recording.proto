syntax = "proto3";
package calaba.v1;

import "google/protobuf/timestamp.proto";

// Meeting recording and transcription in GPTunneL (ADR-0025). The server records the room's
// mixed audio (LiveKit Egress), uploads it to GPTunneL with the workspace's device token and
// posts a card (SystemMessage.recording) into the room chat.

// Whether a room is being recorded (the "REC" indicator).
enum RoomRecordingState {
  ROOM_RECORDING_STATE_UNSPECIFIED = 0;
  ROOM_RECORDING_STATE_ACTIVE = 1;  // recording now
  ROOM_RECORDING_STATE_STOPPED = 2; // stopped: the indicator goes away (upload continues, see the card)
}

// The recording of a voice room. In WorkspaceSnapshot.recordings (active ones, READY /
// WORKSPACE_CREATE), in the ROOM_RECORDING event (start and stop, to everyone who sees the
// room) and in the start / stop responses.
message RoomRecording {
  string workspace_id = 1;
  string room_id = 2;
  string recording_id = 3;
  RoomRecordingState state = 4;
  string by_user_id = 5; // who started it (empty if that account is gone)
  google.protobuf.Timestamp since = 6; // when it started: clients count the REC timer from it
  // STOPPED only: why — "user" (POST …/recording/stop), "empty" (nobody in the call for
  // 2 min), "max_duration" (4 h), "disabled" (recording forbidden in the room),
  // "plan_inactive" (the workspace plan stopped being active, ADR-0086 amendment 1), "egress"
  // (the recorder ended by itself, e.g. the call ended), "lost" (the recorder is gone).
  string stop_reason = 7;
  string stopped_by = 8; // "user": who stopped it
}

// Life of a recording after it stops (RecordingCard.status).
enum RecordingStatus {
  RECORDING_STATUS_UNSPECIFIED = 0;
  RECORDING_STATUS_RECORDING = 1;  // still recording
  RECORDING_STATUS_UPLOADING = 2;  // uploading to GPTunneL
  RECORDING_STATUS_PROCESSING = 3; // uploaded; GPTunneL transcribes and summarizes (web_url is set)
  RECORDING_STATUS_DONE = 4;       // transcript and summary are ready in GPTunneL (web_url), then copied here
  RECORDING_STATUS_FAILED = 5;     // see error
}

// The chat card of a recording (SystemMessage.recording). Posted when the recording stops,
// updated in place (MESSAGE_UPDATE) as it moves on: UPLOADING → PROCESSING → DONE | FAILED.
message RecordingCard {
  string recording_id = 1;
  string started_by = 2;
  google.protobuf.Timestamp started_at = 3;
  uint32 duration_sec = 4;
  RecordingStatus status = 5;
  string web_url = 6; // the recording's page in GPTunneL (PROCESSING, DONE; also FAILED once uploaded); host app.gptunnel.ai → GPTUNNEL_WEB_URL
  // FAILED: machine-readable reason. GPTunneL's: "insufficient_balance", "account_unavailable",
  // "transcription_failed", "summary_failed", "empty_audio", "storage_failed", "internal";
  // ours: "device_revoked" (the workspace was disconnected from GPTunneL), "not_paired",
  // "upload_failed", "too_large", "no_audio" (the recorder produced no file), "recorder_failed",
  // "timeout" (no result within 2 h; the page may still get it).
  string error = 7;
  // FAILED — which retry the card offers (backlog 40). Both negative, so that cards stored
  // before these fields (both false) offer «Проверить снова» only:
  // not_uploaded = false: the file was delivered (the upload completed), «Проверить снова»
  // (POST …/recheck); it is never sent again (reupload → 409).
  // not_uploaded = true and file_gone = false: the upload did not complete and the local file
  // is kept, «Отправить снова» (POST …/reupload).
  // not_uploaded = true and file_gone = true: nothing to retry.
  // file_gone: the local file is gone (removed after done, 7 days after the stop, or never
  // written).
  bool file_gone = 8;
  bool not_uploaded = 9;
  // DONE: the meeting summary from GPTunneL, Markdown (headings, lists, bold); empty until it
  // is fetched or when GPTunneL does not give it (docs/17). Visible to everyone who sees the
  // room's chat (VIEW_ROOM), like the card itself.
  string summary = 10;
  // DONE: the full transcript is kept on the server: GET /api/rooms/{id}/recordings/{rid}/transcript.
  bool has_transcript = 11;
  // DONE: the summary / transcript are still being fetched from GPTunneL (the card may say so).
  bool result_pending = 12;
  // DONE: the recording's audio is attached to the card message (Message.attachments, an
  // audio/mp4 file) until this moment (RECORDING_KEEP_DAYS after DONE); unset = no audio.
  google.protobuf.Timestamp audio_until = 13;
  // The recording was deleted (DELETE /api/rooms/{id}/recordings/{rid}): the card only says
  // who deleted it and when; every other field but recording_id, started_by, started_at and
  // duration_sec is empty.
  google.protobuf.Timestamp deleted_at = 14;
  string deleted_by = 15;
}

// One remark of a transcript (GPTunneL's MeetingTranscriptSegment).
message TranscriptSegment {
  int32 speaker = 1; // the speaker's number from recognition (0, 1, …); -1 = unknown
  uint32 start_ms = 2; // from the start of the recording
  uint32 end_ms = 3;
  string text = 4;
}

// GET /api/rooms/{id}/recordings/{rid}/transcript (VIEW_ROOM in the room; in a restricted room
// only its members, ADR-0029): the whole transcript kept on the server. 404 NOT_FOUND: no such
// recording in this room, deleted, or no transcript (RecordingCard.has_transcript = false).
message GetRecordingTranscriptResponse {
  string recording_id = 1;
  string language = 2; // "ru", "en", … ("" = unknown)
  repeated TranscriptSegment segments = 3;
}

// DELETE /api/rooms/{id}/recordings/{rid} → 204 (docs/09 #50): who started the recording, the
// workspace owner, or MANAGE_MESSAGES in the room (and VIEW_ROOM). Removes the audio
// attachment, the local file, the summary and the transcript, deletes the recording in
// GPTunneL too (best effort) and turns the chat card into «Запись удалена» (MESSAGE_UPDATE,
// RecordingCard.deleted_at). A running recording is stopped first: 409 CONFLICT. Errors: 403
// FORBIDDEN, 404 NOT_FOUND (no such recording in this room, or already deleted).

// The GPTunneL connection of a workspace. GET/POST/DELETE /api/workspaces/{id}/integrations/gptunnel.
message GptunnelIntegration {
  bool paired = 1;
  string device_name = 2;  // as shown in GPTunneL's device list ("Calab · <workspace>")
  string account = 3;      // the GPTunneL account the recordings go to (name or email)
  string paired_by = 4;    // user id
  google.protobuf.Timestamp paired_at = 5;
  string web_url = 6;      // GPTunneL web base ("https://gptunnel.ru"; app.gptunnel.ai is shown as GPTUNNEL_WEB_URL)
}

// GET /api/workspaces/{id}/integrations/gptunnel (any member except guests).
message GetGptunnelIntegrationResponse {
  GptunnelIntegration integration = 1; // paired = false when not connected
}

// POST /api/workspaces/{id}/integrations/gptunnel (MANAGE_INTEGRATIONS, ADR-0048): pair with a code shown
// by GPTunneL (8 characters, "ABCD-EFGH"; case, dashes and spaces are ignored). Replaces an
// existing connection. Errors: 422 CODE_INVALID (wrong or expired code), 429 RATE_LIMITED,
// 503 UNAVAILABLE (GPTunneL unreachable).
message PairGptunnelRequest {
  string code = 1;
}

message PairGptunnelResponse {
  GptunnelIntegration integration = 1;
}

// DELETE /api/workspaces/{id}/integrations/gptunnel (MANAGE_INTEGRATIONS) → 204: revokes the
// device token in GPTunneL (best effort) and forgets it. Uploads in progress fail with
// "device_revoked".

// POST /api/rooms/{id}/recording/start (voice room; a member of the workspace — not a guest —
// with VIEW_ROOM and CONNECT; somebody must be in the call). Errors: 403 FORBIDDEN (guest,
// no CONNECT, or the room does not allow recording: Room.allow_recording), 409 NOT_PAIRED,
// 409 ALREADY_RECORDING, 409 RECORDING_LIMIT (RECORDING_MAX_CONCURRENT on the server; used /
// limit set), 409 CONFLICT (nobody is in the call), 503 UNAVAILABLE (recorder unavailable).
message StartRecordingResponse {
  RoomRecording recording = 1;
}

// POST /api/rooms/{id}/recording/stop (the same people as start) → the stopped recording;
// 404 NOT_FOUND when the room is not being recorded.
message StopRecordingResponse {
  RoomRecording recording = 1;
}

// Retry of a FAILED recording (backlog 40); the same people as start (a member, not a guest,
// with VIEW_ROOM and CONNECT; allow_recording is not required). The chat card follows by
// MESSAGE_UPDATE. Errors: 404 NOT_FOUND (no such recording in this room), 409 NOT_PAIRED,
// 409 CONFLICT (not FAILED, or — recheck — never delivered: RecordingCard.not_uploaded),
// 409 ALREADY_UPLOADED (reupload of a delivered recording), 409 FILE_GONE (reupload: the local
// file is gone). A 409 about the recording also refreshes its card (MESSAGE_UPDATE).
//
// POST /api/rooms/{id}/recordings/{rid}/recheck: FAILED → PROCESSING; GPTunneL's status is
// polled again by gptunnel id, the 2 h window starts anew.
// POST /api/rooms/{id}/recordings/{rid}/reupload (upload did not complete, file kept):
// FAILED → UPLOADING; the local file is sent to GPTunneL again as a new recording there.
message RetryRecordingResponse {
  RecordingCard recording = 1;
}
