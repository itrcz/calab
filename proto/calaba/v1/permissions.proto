syntax = "proto3";
package calaba.v1;

import "google/protobuf/timestamp.proto";

// Permission bits. See docs/04-data-model.md and ADR-0008. Never reuse a freed bit.
enum Permission {
  PERMISSION_UNSPECIFIED = 0;
  PERMISSION_VIEW_ROOM = 1;         // 1 << 0
  PERMISSION_SEND_MESSAGES = 2;     // 1 << 1
  PERMISSION_ATTACH_FILES = 4;      // 1 << 2
  PERMISSION_MANAGE_MESSAGES = 8;   // 1 << 3
  PERMISSION_CONNECT = 16;          // 1 << 4
  PERMISSION_SPEAK = 32;            // 1 << 5
  PERMISSION_STREAM = 64;           // 1 << 6
  PERMISSION_MUTE_MEMBERS = 128;    // 1 << 7
  PERMISSION_MANAGE_ROOM = 256;     // 1 << 8
  PERMISSION_MANAGE_WORKSPACE = 512; // 1 << 9
  PERMISSION_ADMINISTRATOR = 1024;  // 1 << 10
  PERMISSION_MOVE_MEMBERS = 2048;   // 1 << 11: move others between voice rooms, join over user_limit
  PERMISSION_MANAGE_NICKNAMES = 4096; // 1 << 12: workspace-level, change others' nicknames
  PERMISSION_MENTION_EVERYONE = 8192; // 1 << 13: @everyone / @here mention everyone who sees the room
  PERMISSION_VIDEO = 16384;           // 1 << 14: publish a webcam in voice rooms (member: yes by default)
  // 1 << 15: workspace-level, create / edit / delete / order roles below one's highest role
  // and assign them (ADR-0026). Not settable per room; only admins may grant it to a role.
  PERMISSION_MANAGE_ROLES = 32768;
  // 1 << 16: workspace-level, create / edit / delete the workspace's sticker packs (ADR-0030).
  // Not settable per room.
  PERMISSION_MANAGE_STICKERS = 65536;
  // Task boards (ADR-0042). Board bits: they apply to boards only (room overrides ignore them,
  // board overrides touch only them). Member default: VIEW_BOARD | CREATE_TASKS.
  // 1 << 17: see a board, its tasks and comments; comment; subscribe.
  PERMISSION_VIEW_BOARD = 131072;
  // 1 << 18: create tasks; edit the ones one created or is assigned to.
  PERMISSION_CREATE_TASKS = 262144;
  // 1 << 19: edit, move and archive any task; moderate comments.
  PERMISSION_EDIT_TASKS = 524288;
  // 1 << 20: statuses, labels, milestones, settings, access and archive of the board.
  PERMISSION_MANAGE_BOARD = 1048576;
  // Invitations (ADR-0043). Not implied by MANAGE_WORKSPACE / MANAGE_ROOM (migration 00047
  // granted them to the roles holding those); settable per room; never for guests.
  // 1 << 21: workspace invites (links, e-mail, adding an account); in a room: members-only
  // room links (RoomInvite.members_only) that give workspace members access to that room.
  PERMISSION_INVITE_MEMBERS = 2097152;
  // 1 << 22: room links that admit guests (ADR-0016), their approval setting and deciding on
  // knocking guests (ADR-0040); meeting guest links of an organizer (ADR-0038).
  PERMISSION_INVITE_GUESTS = 4194304;
  // 1 << 23 (ADR-0044): create temporary rooms (POST /api/workspaces/{id}/rooms/temp).
  // Workspace-level: room overrides neither grant nor take it. In the built-in member role by
  // default (migration 00048 added it to existing member roles); never for guests. The
  // workspace switches the feature off by removing it from the member role.
  PERMISSION_CREATE_TEMP_ROOMS = 8388608;
  // 1 << 24 (ADR-0046): place outbound phone calls (SIP) from a voice room the caller is in
  // (POST /api/rooms/{id}/calls). Workspace and room level (room overrides grant and take it).
  // Nobody by default, calls cost money: admins grant it to roles or people. Never for guests
  // (the server refuses them whatever the bits say; the guest role cannot hold it).
  PERMISSION_PLACE_CALLS = 16777216;
  // Roles v2 (ADR-0048): permissions by function, split off MANAGE_WORKSPACE. All seven are
  // workspace-level: room and board overrides neither grant nor take them. Not implied by
  // MANAGE_WORKSPACE (migration 00052 granted them to the roles holding it); ADMINISTRATOR
  // includes them; never for guests.
  // 1 << 25: create task boards (the creator manages their board through a personal override).
  PERMISSION_CREATE_BOARDS = 33554432;
  // 1 << 26: remove and ban / unban members, badges, promote guests, assign roles below one's
  // highest role (editing the roles themselves is MANAGE_ROLES).
  PERMISSION_MANAGE_MEMBERS = 67108864;
  // 1 << 27: create, change and delete the workspace's bots and their tokens (ADR-0031).
  PERMISSION_MANAGE_BOTS = 134217728;
  // 1 << 28: telephony settings (ADR-0046), GPTunneL pairing and future integrations.
  PERMISSION_MANAGE_INTEGRATIONS = 268435456;
  // 1 << 29: the call journal, board activity export and other workspace journals; entries of
  // rooms and boards the holder cannot see stay hidden.
  PERMISSION_VIEW_JOURNALS = 536870912;
  // 1 << 30: change and cancel other people's meetings, workspace-wide meetings (ADR-0038).
  PERMISSION_MANAGE_EVENTS = 1073741824;
  // 1 << 31: delete recordings of any room the holder can see, the recording consent of rooms
  // (Room.allow_recording). Proto enums are int32: the value is bit 31 as a signed number
  // (0x80000000); read it as unsigned (TS: BigInt.asUintN(32, …)). Bits from 1 << 32 on cannot be
  // enum values: they are listed as constants in this comment block and in docs/04.
  // Billing bits (ADR-0087), workspace-level, outside ADMINISTRATOR (it does not include them),
  // never in overrides, granted and assigned by the workspace owner only; the owner always has
  // all three, guests and bots never (TS BILLING_BITS, Go perm.BillingView …):
  // 1 << 32 BILLING_VIEW: the badge state and «Тариф»: balance, history, plan, receipts.
  // 1 << 33 BILLING_TOPUP: manual top-up through a hosted payment page; implies VIEW.
  // 1 << 34 BILLING_MANAGE: plan changes, one-click top-up, auto-topup, saved methods, payer,
  // refund requests, the market before the first payment; implies VIEW and TOPUP.
  PERMISSION_MANAGE_RECORDINGS = -2147483648;
}

// Built-in workspace roles. Since ADR-0026 a member holds several roles (WorkspaceMember.
// role_ids); WorkspaceMember.role stays as the highest built-in role for older clients.
enum WorkspaceRole {
  WORKSPACE_ROLE_UNSPECIFIED = 0;
  WORKSPACE_ROLE_OWNER = 1;
  WORKSPACE_ROLE_ADMIN = 2;
  WORKSPACE_ROLE_MEMBER = 3;
  WORKSPACE_ROLE_GUEST = 4;
}

message PermissionOverride {
  uint64 allow = 1;
  uint64 deny = 2;
}

// A workspace role (ADR-0026). Four built-in roles exist in every workspace: OWNER and ADMIN
// (full access; permissions fixed), MEMBER (every non-guest; default permissions editable)
// and GUEST (editable within the guest set). Every non-guest member holds MEMBER, every guest
// GUEST; custom roles are added on top.
message Role {
  string id = 1;
  string workspace_id = 2;
  // 1..32 characters. Built-in roles carry their key ("owner" | "admin" | "member" |
  // "guest", fixed): clients show a localized name for them.
  string name = 3;
  uint32 color = 4; // 0xRRGGBB; 0 = no color
  // Higher = more senior. Built-ins: guest 0, member 1, admin 1000, owner 1001; custom roles
  // in between (2..). Room overrides of a member's roles apply lowest position first.
  int32 position = 5;
  uint64 permissions = 6; // workspace-level bits (OR over the member's roles)
  WorkspaceRole builtin = 7; // UNSPECIFIED = custom role
  bool mentionable = 8;
  google.protobuf.Timestamp created_at = 9;
}
